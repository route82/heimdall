<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HEIMDALL</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#12161C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HEIMDALL">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=3">
<link rel="icon" href="./icons/favicon.ico?v=3" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png?v=3">
<link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png?v=3">
<link rel="shortcut icon" href="./icons/favicon.ico?v=3">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F5F6F8;color:#12161C;line-height:1.7;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:break-word;
 font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
/* ── 왼쪽 사이드바 얼개 */
.side{position:fixed;left:0;top:0;bottom:0;width:238px;z-index:30;background:#fff;
 border-right:1px solid #E6EAF0;display:flex;flex-direction:column;overflow-y:auto}
.main{margin-left:238px;min-height:100vh}
.mtop{display:none}
.brand{display:flex;align-items:center;padding:18px 18px 14px}
.sgroup{padding:6px 12px 2px}
.sgt{font-size:11px;font-weight:700;letter-spacing:.06em;color:#A8B0BC;
 padding:10px 10px 5px;text-transform:uppercase}
.sfoot{margin-top:auto;border-top:1px solid #F0F2F5;padding:13px 16px 16px}
.sfoot .who{font-size:13.5px;font-weight:600;display:block;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sfoot .frow{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.sfoot .btn{padding:6px 11px;font-size:12.5px}
.scrim{display:none}
.bolt{height:.55em;width:auto;display:block;flex:none}
/* 로고 — 가이드라인 최소 크기: 인물형 웹 40px, 심볼 24px */
.lgh{height:42px;width:auto;display:block}
.lgv{height:132px;width:auto;display:block;margin:0 auto}
.login .mark{display:flex;justify-content:center;margin-bottom:22px}
.login h2{margin:0 0 6px;font-size:21px}
.opts{display:flex;gap:18px;margin:2px 0 14px;font-size:13.5px;color:#5B6472}
.opts label{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.opts input{width:17px;height:17px;margin:0;accent-color:#2B6CB0}
.nav{appearance:none;border:0;background:none;font-size:14.5px;font-weight:600;color:#4A5464;
 padding:9px 10px;cursor:pointer;border-radius:9px;width:100%;text-align:left;
 display:flex;align-items:center;gap:10px;line-height:1.4}
.nav svg{width:17px;height:17px;flex:none;color:#98A0AC}
.nav:hover{background:#F2F5F9}
.nav[aria-current=true]{background:#EAF2FD;color:#2B6CB0}
.nav[aria-current=true] svg{color:#2B6CB0}
.me{font-size:13px;color:#5C6672;display:flex;align-items:center;gap:8px;
 flex:none;white-space:nowrap}
.me .who{max-width:180px;overflow:hidden;text-overflow:ellipsis}
.role{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:#EEF2F7;color:#4A5464}
.wrap{max-width:1040px;margin:0 auto;padding:28px 30px 90px}
.page{display:none}.page.on{display:block}
h1{font-size:23px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:#5C6672;font-size:13.5px;margin-bottom:22px}
.card{display:block;background:#fff;border:1px solid #E6EAF0;border-radius:12px;padding:16px 20px;
 margin-bottom:10px;cursor:pointer;transition:.12s}
.card:hover{border-color:#2B6CB0;box-shadow:0 3px 14px rgba(43,108,176,.08)}
.ct{font-size:16.5px;font-weight:700;margin-bottom:4px}
.shsec{font-size:11.5px;font-weight:700;letter-spacing:.04em;color:#5C6672;
 margin:12px 0 6px;padding-top:8px;border-top:1px solid #F0F2F5}
.shsec:first-of-type{margin-top:0;padding-top:0;border-top:0}
.shlb{display:flex;align-items:center;gap:5px;font-size:13.5px}
.card.locked{cursor:default;background:#FAFBFD;border-style:dashed}
.box.locked{background:#FAFBFD;border-style:dashed;user-select:none}
.card.locked:hover{border-color:#DDE2E9;box-shadow:none}
.card.locked .ct{color:#B6BEC9;letter-spacing:.12em}
.cm{font-size:13px;color:#5C6672;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
.t-draft{background:#EEF1F5;color:#5B6472}.t-review{background:#FFF3D6;color:#8A6100}
.t-reported{background:#E3F5E9;color:#1B6B36}.t-archived{background:#EDE9F5;color:#5A3699}
.btn{appearance:none;border:1px solid #DDE2E9;background:#fff;border-radius:9px;padding:9px 16px;
 font-size:14px;font-weight:600;cursor:pointer;color:#3A424F}
.btn.p{background:#2B6CB0;border-color:#2B6CB0;color:#fff}
.btn.g{background:#12833F;border-color:#12833F;color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
input,select,textarea{font-family:inherit;font-size:14.5px;padding:10px 13px;border:1px solid #DDE2E9;
 border-radius:9px;background:#fff}
input:focus,textarea:focus,select:focus{outline:none;border-color:#2B6CB0}
.full{width:100%}
.box{background:#fff;border:1px solid #E6EAF0;border-radius:12px;padding:22px 24px;margin-bottom:14px}
.tabs{display:flex;gap:3px;border-bottom:1px solid #E6EAF0;margin:18px 0 20px}
.tab{appearance:none;border:0;background:none;font-size:15px;font-weight:600;color:#5C6672;
 padding:11px 15px;cursor:pointer;border-bottom:2.5px solid transparent}
.tab[aria-selected=true]{color:#2B6CB0;border-bottom-color:#2B6CB0}
.pane{display:none}.pane.on{display:block}
.seg{display:grid;grid-template-columns:70px 1fr;gap:14px;padding:7px 0}
.seg:hover{background:#FAFBFD}
.ts{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:#98A0AC;padding-top:3px;
 word-break:normal}
.spk{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;margin-bottom:3px}
.s0{background:#E4EEFC;color:#1F5286}.s1{background:#E7F4E8;color:#1F6B33}
.s2{background:#FBEBE2;color:#9B4A15}.s3{background:#F0E9FA;color:#5A3699}
.s4{background:#FCE9EF;color:#95214A}.s5{background:#E6F2F4;color:#14615F}
.seg p{margin:0}
[contenteditable=true]{outline:1px dashed #C7D3E4;border-radius:6px;padding:3px 7px;background:#FCFDFF}
[contenteditable=true]:focus{outline:2px solid #2B6CB0;background:#fff}
.hl{border-left:3px solid #2B6CB0;padding:2px 0 2px 18px;margin-bottom:24px}
.hl .ts{margin-bottom:4px}
.hl h3{font-size:17.5px;margin:0 0 8px;line-height:1.5}
.hl ul{margin:0;padding-left:18px;color:#3A424F}.hl li{margin:5px 0;font-size:15px}
table{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0}
th,td{border:1px solid #E6EAF0;padding:9px 11px;text-align:left;vertical-align:top}
th{background:#F5F7FA;font-weight:600}
.md h1{font-size:21px}.md h2{font-size:17.5px;margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid #EEF1F5}
.md ul{padding-left:19px}
.act{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:start;
 padding:12px 0;border-top:1px solid #F0F2F5}
.act input[type=checkbox]{width:19px;height:19px;margin-top:3px}
.act .meta{font-size:12.5px;color:#98A0AC;margin-top:2px}
.act.done .task{text-decoration:line-through;color:#A8B0BA}
.hit{background:#fff;border:1px solid #E6EAF0;border-radius:10px;padding:13px 16px;margin-bottom:8px;cursor:pointer}
.hit:hover{border-color:#2B6CB0}
.hit .h{font-size:12.5px;color:#5C6672;margin-bottom:3px}
mark{background:#FFF2A8;padding:1px 2px;border-radius:3px}
.empty{padding:52px;text-align:center;color:#98A0AC;background:#fff;border:1px dashed #DDE2E9;border-radius:12px}
.login{max-width:400px;margin:14vh auto;background:#fff;border:1px solid #E6EAF0;border-radius:14px;padding:34px}
.login h2{margin:0 0 6px;font-size:21px}
.opts{display:flex;gap:18px;margin:2px 0 14px;font-size:13.5px;color:#5B6472}
.opts label{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.opts input{width:17px;height:17px;margin:0;accent-color:#2B6CB0}.login p{margin:0 0 20px;color:#5C6672;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#12161C;color:#fff;
 padding:13px 20px;border-radius:10px;font-size:14px;z-index:80;box-shadow:0 6px 22px rgba(0,0,0,.25)}
.bar{position:fixed;right:22px;bottom:22px;display:flex;gap:9px;z-index:50}
.bar .btn{box-shadow:0 4px 16px rgba(0,0,0,.16);padding:12px 20px;border-radius:24px}
.hist{margin-top:26px;font-size:12.5px;color:#98A0AC}
.hist div{padding:4px 0;border-top:1px solid #F2F4F7}
.chatwrap{display:flex;gap:18px;align-items:flex-start}
.rooms{width:230px;flex:none;background:#fff;border:1px solid #E6EAF0;border-radius:12px;
 padding:10px;position:sticky;top:22px;max-height:78vh;overflow-y:auto}
.rooms .newbtn{width:100%;margin-bottom:8px}
.room{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:8px;cursor:pointer;
 font-size:13.5px;color:#3A424F}
.room:hover{background:#F5F7FA}
.room.on{background:#EAF2FE;color:#2B6CB0;font-weight:600}
.room .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room .ic{appearance:none;border:0;background:none;cursor:pointer;font-size:13px;
 color:#B6BEC9;padding:2px 3px;flex:none}
.room .ic:hover{color:#2B6CB0}
.room .ic.pin.on{color:#E0A800}
.chatmain{flex:1;min-width:0}
.chat{display:flex;flex-direction:column;gap:14px;margin-bottom:20px}
.msg{max-width:88%;padding:13px 16px;border-radius:14px;font-size:15px;line-height:1.72}
.msg.q{align-self:flex-end;background:#2B6CB0;color:#fff;border-bottom-right-radius:5px}
.msg.a{align-self:flex-start;background:#fff;border:1px solid #E6EAF0;border-bottom-left-radius:5px}
.msg.a .md h1{font-size:17px}.msg.a .md h2{font-size:15.5px;margin:14px 0 6px;border:0;padding:0}
.msg.a .md p{margin:6px 0}.msg.a .md ul{padding-left:18px;margin:6px 0}
.msg .src{margin-top:9px;padding-top:8px;border-top:1px solid #EEF1F5;
 font-size:12px;color:#98A0AC}
.msg.wait{color:#5C6672;background:#F2F4F7;border:0}
.ask{display:flex;gap:8px;position:sticky;bottom:0;background:#F5F6F8;padding:10px 0 4px}
.ask textarea{flex:1;resize:none;min-height:46px;max-height:120px;font-size:15px}
.stree{margin:1px 0 3px}
.st{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;text-align:left;
 font-family:inherit;font-size:13px;color:#4A5464;padding:5px 8px;border-radius:8px;cursor:pointer;line-height:1.4}
.st:hover{background:#F2F5F9}
.st.sel{background:#EAF2FD;color:#2B6CB0;font-weight:600}
.st .fi{width:14px;height:14px;flex:none;color:#98A0AC}
.st.sel .fi{color:#2B6CB0}
.st .cr{width:12px;height:12px;flex:none;color:#98A0AC;transition:transform .12s}
.st .cr.o{transform:rotate(90deg)}
.st .stw{width:14px;flex:none;display:flex;align-items:center;justify-content:center}
.st .stt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st .stc{font-size:11px;color:#98A0AC;flex:none}
.st .pdot{width:9px;height:9px;border-radius:3px;flex:none}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#E6EAF0;
 border:1px solid #E6EAF0;border-radius:12px;overflow:hidden}
.cgh{background:#F7F9FC;padding:8px 6px;text-align:center;font-size:12.5px;color:#5C6672;font-weight:600}
.cday{background:#fff;min-height:104px;padding:6px 6px 8px}
.cday.out{background:#FAFBFC}
.cday .dn{font-size:12px;color:#98A0AC;margin-bottom:4px}
.cday.today .dn{color:#2B6CB0;font-weight:700}
.cev{display:block;width:100%;text-align:left;border:0;background:#EAF2FD;color:#2B6CB0;
 border-radius:6px;padding:3px 6px;font-size:11.5px;margin-bottom:3px;cursor:pointer;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:inherit}
.cev.done{background:#E9F6EE;color:#1E7A46}
.cev.miss{background:#FDECEA;color:#C0392B}
.clist .card{margin-bottom:9px}
.hcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:13px;margin:18px 0 26px}
.hcard{background:#fff;border:1px solid #E6EAF0;border-radius:14px;padding:22px 20px;cursor:pointer;
 text-align:left;font-family:inherit;transition:box-shadow .15s,border-color .15s}
.hcard:hover{border-color:#2B6CB0;box-shadow:0 3px 14px rgba(43,108,176,.13)}
.hcard .hic{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:13px}
.hcard .hic svg{width:22px;height:22px}
.hcard h2{font-size:16.5px;margin:0 0 5px}
.hcard p{font-size:13px;color:#5C6672;margin:0;line-height:1.55}
.hrec .card{margin-bottom:9px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{appearance:none;border:1px solid #DDE2E9;background:#fff;border-radius:20px;
 padding:7px 13px;font-size:13px;color:#3A424F;cursor:pointer;font-family:inherit}
.chip:hover{border-color:#2B6CB0;color:#2B6CB0}
.chip.on{background:#2B6CB0;border-color:#2B6CB0;color:#fff;font-weight:600}
.pj{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:11px}
.pjc{background:#fff;border:1px solid #E6EAF0;border-radius:12px;padding:16px 18px;cursor:pointer}
.pjop{border:none;background:none;color:#98A0AC;font-size:15px;cursor:pointer;padding:2px 5px;border-radius:6px}
.delx{border:none;background:none;color:#C0C6CF;font-size:16px;cursor:pointer;padding:2px 7px;border-radius:6px}
.delx:hover{background:#FDECEC;color:#C0392B}
.pjop:hover{background:#EEF2F7;color:#12161C}
.pjc:hover{border-color:#2B6CB0}
.pjc .n{font-size:16px;font-weight:700;margin-bottom:3px}
.pjc .d{font-size:12.5px;color:#98A0AC}
.pjbar{width:34px;height:4px;border-radius:4px;margin-bottom:10px;background:#2B6CB0}
.pjbtn{appearance:none;border:1px solid #DDE2E9;background:#fff;border-radius:9px;
 padding:8px 12px;font-size:13.5px;font-family:inherit;cursor:pointer;color:#3A424F;
 max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.pjbtn:hover{border-color:#2B6CB0;color:#2B6CB0}
/* ── 프로젝트 폴더 나무 */
.tree{background:#fff;border:1px solid #E6EAF0;border-radius:12px;padding:8px 8px}
.tb{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;
 cursor:pointer;font-size:14.5px;color:#3A424F}
.tb:hover{background:#F2F5F9}
.tb.sel{background:#EAF2FD;color:#2B6CB0;font-weight:700}
.tb .fi{width:17px;height:17px;flex:none;color:#2B6CB0}
.tb.sel .fi{color:#2B6CB0}
.tb .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb .tc{font-size:12px;color:#98A0AC;background:#F2F5F9;border-radius:20px;
 padding:1px 9px;flex:none;font-weight:600}
.tb.sel .tc{background:#D9E8FB;color:#2B6CB0}
.tw{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center;
 border-radius:5px;color:#A8B0BC;cursor:pointer}
.tw:hover{background:#E4E9F0;color:#3A424F}
.cr{width:14px;height:14px;transition:transform .15s}
.cr.o{transform:rotate(90deg)}
.pdot{width:9px;height:9px;border-radius:9px;flex:none;margin:0 4px;background:#2B6CB0}
/* 프로젝트 색 고르기 — 색 이름 대신 색 네모를 직접 누릅니다 */
.swatch{display:flex;gap:6px;align-items:center}
.sw{width:30px;height:30px;border-radius:8px;border:2px solid transparent;
 cursor:pointer;padding:0;appearance:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.sw:hover{transform:scale(1.08)}
.sw.on{border-color:#12161C;box-shadow:0 0 0 2px #fff inset}
.tk{margin-left:19px;border-left:1px solid #EDF0F4;padding-left:6px}
.pdot.c-blue{background:#2B6CB0}
.pdot.c-green{background:#12833F}
.pdot.c-orange{background:#D97706}
.pdot.c-purple{background:#6D3FD1}
.pdot.c-red{background:#C0392B}
.pdot.c-teal{background:#0E8A8A}
.tops{opacity:.55;flex:none;white-space:nowrap}
.tb:hover .tops{opacity:1}
.pjbtn.none{color:#98A0AC}
.mask{position:fixed;inset:0;background:rgba(20,26,35,.45);z-index:100;
 display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px}
.pick{background:#fff;border-radius:14px;width:100%;max-width:460px;max-height:78vh;
 display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.pick .hd{padding:18px 20px 12px;border-bottom:1px solid #EEF1F5}
.pick .hd h3{margin:0 0 10px;font-size:17px}
.pick .hd input{width:100%}
.pick .bd{overflow-y:auto;padding:8px 0}
.pick .it{display:flex;align-items:center;gap:10px;padding:11px 20px;cursor:pointer;font-size:15px}
.pick .it:hover,.pick .it.on{background:#F2F7FE}
.pick .it .fi{width:14px;height:14px;color:#98A0AC;flex:none}
.pick .it .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .it .cnt{font-size:12px;color:#98A0AC;flex:none}
.pick .it.cur{font-weight:700;color:#2B6CB0}
.pick .ft{padding:12px 20px;border-top:1px solid #EEF1F5;display:flex;gap:8px}
.pick .none{color:#98A0AC;padding:26px 20px;text-align:center;font-size:14px}
.pick .sec{padding:9px 20px 4px;font-size:11.5px;font-weight:700;color:#A8B0BA;letter-spacing:.03em}
.c-blue{background:#2B6CB0}.c-green{background:#12833F}.c-orange{background:#C2620F}
.c-purple{background:#6B3FB5}.c-red{background:#B32E4B}.c-teal{background:#0E6E6B}
.install{appearance:none;border:1px solid #DDE2E9;background:#fff;border-radius:8px;
 padding:5px 11px;font-size:12.5px;font-weight:600;color:#2B6CB0;cursor:pointer}
.upd{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#2B6CB0;color:#fff;
 padding:11px 18px;border-radius:10px;font-size:14px;z-index:90;cursor:pointer;
 box-shadow:0 6px 22px rgba(43,108,176,.35)}

/* ── 좁은 화면 ─────────────────────────────────────── */
@media(max-width:900px){
  /* 좁은 화면에서는 사이드바를 서랍으로 숨깁니다 */
  .side{transform:translateX(-100%);transition:transform .22s ease;width:262px;
   box-shadow:0 0 0 rgba(0,0,0,0)}
  body.snav .side{transform:none;box-shadow:0 12px 40px rgba(0,0,0,.18)}
  body.snav .scrim{display:block;position:fixed;inset:0;z-index:25;background:rgba(20,24,31,.38)}
  .main{margin-left:0}
  .mtop{display:flex;position:sticky;top:0;z-index:20;background:#fff;
   border-bottom:1px solid #E6EAF0;align-items:center;gap:10px;padding:0 14px}
  .mtop .brand{padding:9px 0;margin-right:auto}
  .mtop .brand .lgh{height:34px}
  .burger{appearance:none;border:1px solid #DDE2E9;background:#fff;border-radius:9px;
   width:36px;height:36px;display:flex;align-items:center;justify-content:center;
   cursor:pointer;color:#3A424F;flex:none}
  .mtop .me{font-size:12px;gap:6px}
  .mtop .me .who{max-width:96px}

function go(v){

    upload:renderUpload, rec:renderRec, server:renderServer,
    guide:renderGuide, usage:renderUsage}[v]||(()=>{}))();
}

// ─────────────────────────── 일정 (회의실 예약)
// 구글 회의실 캘린더에서 가져온 「우리 그룹」 예약만 보여줍니다.
let CAL = {mode:'month', anchor:new Date()};
const KSTF = o => new Intl.DateTimeFormat('ko-KR', Object.assign({timeZone:'Asia/Seoul'}, o));
const ymd = d => new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(d);

function calRange(){
  const a = new Date(CAL.anchor);
  if(CAL.mode==='day')  return [new Date(a.setHours(0,0,0,0)), new Date(new Date(CAL.anchor).setHours(23,59,59,999))];
  if(CAL.mode==='week'){
    const s0=new Date(a); s0.setDate(s0.getDate()-s0.getDay()); s0.setHours(0,0,0,0);
    const e0=new Date(s0); e0.setDate(e0.getDate()+6); e0.setHours(23,59,59,999);
    return [s0,e0];
  }
  const s0=new Date(a.getFullYear(), a.getMonth(), 1);
  const e0=new Date(a.getFullYear(), a.getMonth()+1, 0, 23,59,59,999);
  return [s0,e0];
}

async function renderCal(){
  const el=$('#p-cal');
  const [s0,e0]=calRange();
  const gs=new Date(s0); gs.setDate(gs.getDate()-7);
  const ge=new Date(e0); ge.setDate(ge.getDate()+7);
  el.innerHTML='<h1>일정</h1><div class="sub">불러오는 중…</div>';
  const [cal,mtg]=await Promise.all([
    SB.from('hd_cal_event').select('uid,title,room,starts_at,ends_at,all_day')
      .gte('starts_at',gs.toISOString()).lte('starts_at',ge.toISOString()).order('starts_at'),
    SB.from('hd_meeting').select('id,cal_uid').not('cal_uid','is',null)]);
  if(cal.error) return el.innerHTML=`<h1>일정</h1><div class="empty">${esc(cal.error.message)}<br>
    회의실_캘린더.sql 을 실행하셨는지 확인해주세요.</div>`;
  const evs=cal.data||[];
  const done=new Map((mtg.data||[]).filter(x=>x.cal_uid).map(x=>[x.cal_uid,x.id]));

  const title = CAL.mode==='month' ? KSTF({year:'numeric',month:'long'}).format(CAL.anchor)
    : CAL.mode==='week' ? `${ymd(s0)} ~ ${ymd(e0)}`
    : KSTF({year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(CAL.anchor);
  const MODES=[['month','월'],['week','주'],['day','일']];

  let last='';
  try{
    const {data:sy}=await SB.from('hd_cal_event').select('synced_at')
      .order('synced_at',{ascending:false}).limit(1).maybeSingle();
    if(sy&&sy.synced_at){
      const m=Math.max(0,Math.round((Date.now()-new Date(sy.synced_at))/60000));
      last = m<1 ? '방금 전' : (m<60 ? `${m}분 전` : `${Math.round(m/60)}시간 전`);
    }
  }catch(e){}
  el.innerHTML=`<h1>일정</h1>
    <div class="sub">회의실 예약 중 우리 그룹 것만 보입니다. 예약을 누르면 그 회의를 녹음하거나 회의록을 엽니다
      ${last?` · 구글 캘린더에서 <b>${last}</b> 확인함 (2분마다 자동)`:''}</div>
    <div class="row" style="margin-bottom:14px;flex-wrap:wrap">
      <button class="btn" id="cprev">←</button>
      <button class="btn" id="ctoday">오늘</button>
      <button class="btn" id="cnext">→</button>
      <b style="font-size:16px;margin:0 8px">${esc(title)}</b>
      <div class="chips" style="margin:0 0 0 auto">
        ${MODES.map(([k,l])=>`<button class="chip${CAL.mode===k?' on':''}" data-mode="${k}">${l}</button>`).join('')}
      </div>
    </div>
    ${CAL.mode==='month' ? monthHtml(s0,e0,evs,done) : listHtml(s0,e0,evs,done)}`;

  $('#cprev').onclick=()=>{ shiftCal(-1); renderCal(); };
  $('#cnext').onclick=()=>{ shiftCal(1);  renderCal(); };
  $('#ctoday').onclick=()=>{ CAL.anchor=new Date(); renderCal(); };
  el.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ CAL.mode=b.dataset.mode; renderCal(); });
  el.querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>{
    const mid=b.dataset.mid;
    if(mid) return openMeeting(mid);
    REC.cal={uid:b.dataset.ev, title:b.dataset.title, room:b.dataset.room};
    REC.preTitle=b.dataset.title;
    go('rec');
  });
}

function shiftCal(n){
  const a=new Date(CAL.anchor);
  if(CAL.mode==='month') a.setMonth(a.getMonth()+n);
  else if(CAL.mode==='week') a.setDate(a.getDate()+7*n);
  else a.setDate(a.getDate()+n);
  CAL.anchor=a;
}

const hmOf = t => new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',
  hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(t));

function evBtn(e, done, cls){
  const mid=done.get(e.uid)||'';
  const k = mid ? 'done' : (new Date(e.ends_at)<new Date() ? 'miss' : '');
  return `<button class="${cls} ${k}" data-ev="${esc(e.uid)}" data-mid="${mid}"
    data-title="${esc(e.title)}" data-room="${esc(e.room||'')}"
    title="${esc(e.title)}">${hmOf(e.starts_at)} ${esc(e.title)}</button>`;
}

function monthHtml(s0,e0,evs,done){
  const first=new Date(s0); const start=new Date(first); start.setDate(1-first.getDay());
  const days=[]; const cur=new Date(start);
  for(let i=0;i<42;i++){ days.push(new Date(cur)); cur.setDate(cur.getDate()+1); }
  const byDay={};
  evs.forEach(e=>{ (byDay[ymd(new Date(e.starts_at))] ||= []).push(e); });
  const today=ymd(new Date());
  const W=['일','월','화','수','목','금','토'];
  return `<div class="cgrid">
    ${W.map(w=>`<div class="cgh">${w}</div>`).join('')}
    ${days.map(d=>{
      const key=ymd(d);
      const out = d.getMonth()!==s0.getMonth();
      const list=(byDay[key]||[]);
      return `<div class="cday${out?' out':''}${key===today?' today':''}">
        <div class="dn">${d.getDate()}</div>
        ${list.slice(0,4).map(e=>evBtn(e,done,'cev')).join('')}
        ${list.length>4?`<div class="dn">+${list.length-4}건</div>`:''}
      </div>`;}).join('')}
  </div>`;
}

function listHtml(s0,e0,evs,done){
  const inRange=evs.filter(e=>{
    const t=new Date(e.starts_at); return t>=s0 && t<=e0; });
  if(!inRange.length) return '<div class="empty">이 기간에 잡힌 회의실 예약이 없습니다.</div>';
  const byDay={};
  inRange.forEach(e=>{ (byDay[ymd(new Date(e.starts_at))] ||= []).push(e); });
  return '<div class="clist">' + Object.keys(byDay).sort().map(k=>`
    <h1 style="font-size:16px;margin:18px 0 8px">${k}</h1>
    ${byDay[k].map(e=>{
      const mid=done.get(e.uid)||'';
      const past=new Date(e.ends_at)<new Date();
      return `<div class="card" style="display:flex;align-items:center;gap:12px">
        <div style="min-width:0;flex:1">
          <div class="ct">${esc(e.title)}</div>
          <div class="cm"><span>${hmOf(e.starts_at)} ~ ${hmOf(e.ends_at)}</span>
            ${e.room?`<span>${esc(e.room)}</span>`:''}
            ${mid?'<span style="color:#1E7A46">회의록 있음</span>'
                 :(past?'<span style="color:#C0392B">회의록 없음</span>':'')}</div>
        </div>
        <button class="btn${mid?'':' p'}" data-ev="${esc(e.uid)}" data-mid="${mid}"
          data-title="${esc(e.title)}" data-room="${esc(e.room||'')}"
          style="flex:none">${mid?'회의록 열기':(past?'지금 올리기':'녹음 시작')}</button>
      </div>`;}).join('')}`).join('') + '</div>';
}

// 오늘 회의실 예약 — 예약해 두면 여기 떠서, 누르면 바로 녹음으로 갑니다
async function drawTodayCal(){
  const box=$('#h-cal'); if(!box) return;
  const now=new Date();
  const kd=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(now);
  const from=new Date(kd+'T00:00:00+09:00').toISOString();
  const to  =new Date(kd+'T23:59:59+09:00').toISOString();
  const [cal, mtg] = await Promise.all([
    SB.from('hd_cal_event').select('uid,title,room,starts_at,ends_at,all_day')
      .gte('starts_at',from).lte('starts_at',to).order('starts_at'),
    SB.from('hd_meeting').select('cal_uid').gte('held_on',kd)]);
  const evs=(cal.data||[]).filter(e=>!e.all_day);
  const done=new Set((mtg.data||[]).map(x=>x.cal_uid).filter(Boolean));
  const hm=t=>new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',
    hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(t));
  if(cal.error){
    box.innerHTML=`<h1 style="font-size:17px">오늘 회의실 예약</h1>
      <div class="empty">예약을 불러오지 못했습니다 · ${esc(cal.error.message)}</div>`;
    return;
  }
  if(!evs.length){
    box.innerHTML=`<h1 style="font-size:17px">오늘 회의실 예약 0건</h1>
      <div class="empty">오늘 잡힌 우리 그룹 회의실 예약이 없습니다.<br>
        구글 캘린더에 예약하실 때 제목에 회사명을 넣어주세요
        (예: [B1, 소회의실] 더올마이티 주간회의)</div>`;
    return;
  }
  box.innerHTML=`<h1 style="font-size:17px">오늘 회의실 예약 ${evs.length}건</h1>
    <div class="sub">예약된 회의는 녹음해 두시면 회의록이 자동으로 남습니다</div>
    ${evs.map(e=>{
      const past=new Date(e.ends_at) < now;
      const ok=done.has(e.uid);
      return `<div class="card" style="display:flex;align-items:center;gap:12px">
        <div style="min-width:0;flex:1">
          <div class="ct">${esc(e.title)}</div>
          <div class="cm"><span>${hm(e.starts_at)} ~ ${hm(e.ends_at)}</span>
            ${e.room?`<span>${esc(e.room)}</span>`:''}
            ${ok?'<span style="color:#1E7A46">회의록 있음</span>'
               :(past?'<span style="color:#C0392B">회의록 없음</span>':'')}</div>
        </div>
        ${ok?'':`<button class="btn p" data-cal="${esc(e.uid)}"
            data-title="${esc(e.title)}" data-room="${esc(e.room||'')}"
            style="flex:none">${past?'지금 올리기':'녹음 시작'}</button>`}
      </div>`;}).join('')}`;
  box.querySelectorAll('[data-cal]').forEach(b=>b.onclick=()=>{
    // 고른 예약을 기억해 두고 녹음 화면으로 갑니다
    REC.cal={uid:b.dataset.cal, title:b.dataset.title, room:b.dataset.room};
    REC.preTitle=b.dataset.title;
    go('rec');
  });
}

// ─────────────────────────── 회의 목록
async function renderList(){
  const el=$('#p-list'); el.innerHTML='<div class="sub">불러오는 중…</div>';
  const showArch = sessionStorage.getItem('hd_show_arch')==='1';
  let q = SB.from('hd_meeting')
      .select('id,title,held_on,status,duration_sec,company,dept,summary_md,'
              + 'project_id,source,visibility,owner_id')
      .order('held_on',{ascending:false}).limit(200);
  if(!showArch) q = q.neq('status','archived');
  const [mres, pres, att] = await Promise.all([q,
    SB.from('hd_project').select('id,name,color'),
    SB.from('hd_attendee').select('meeting_id').eq('member_id', me.id)]);
  const {data,error} = mres;
  if(error) return el.innerHTML=`<div class="empty">${esc(error.message)}</div>`;
  const PJ = Object.fromEntries((pres.data||[]).map(p=>[p.id,p]));
  const canArch = ['admin','ceo','exec'].includes(me.role);
  const mfil = sessionStorage.getItem('hd_mfil') || 'all';
  let locked = 0;
  if(me.role==='dev'){
    const {data:lc} = await SB.rpc('hd_locked_count');
    locked = lc||0;
  }
  // 보기 범위 — 전체 / 내가 들어간 회의 / 나만 보는 노트
  const mine = new Set((att.data||[]).map(a=>a.meeting_id));
  const pick = m => mfil==='note' ? m.visibility==='private'
              : mfil==='mine' ? (mine.has(m.id) || m.owner_id===me.id)
              : true;
  const shown = data.filter(pick);
  const FILS = [['all','전체'],['mine','내 회의'],['note','내 노트']];

  el.innerHTML = `<h1>회의록</h1><div class="sub">${shown.length}건 · ${ROLE[me.role]} 권한으로 보이는 것만 표시됩니다
    ${canArch?`<label style="margin-left:12px;cursor:pointer"><input type="checkbox" id="sharch"
      ${showArch?'checked':''} style="width:14px;height:14px;vertical-align:-2px"> 보관된 회의 보기</label>`:''}</div>
    <div class="chips" style="margin:0 0 14px">
      ${FILS.map(([k,l])=>`<button class="chip${mfil===k?' on':''}" data-fil="${k}">${l}</button>`).join('')}
    </div>`
   + (locked?`<div class="card locked"><div class="ct">■■■■■■■■■■</div>
        <div class="cm"><span class="tag" style="background:#EEF1F5;color:#5B6472">열람 권한 없음</span>
          <span>그룹 · 전사 경영진 회의 ${locked}건</span>
          <span>개발자 권한으로는 열 수 없습니다</span></div></div>`:'')
   + (shown.length? shown.map(m=>`<div class="card" data-id="${m.id}">
        <div class="ct">${esc(m.title)}</div>
        <div class="cm"><span class="tag t-${m.status}">${STATUS[m.status]}</span>
          ${m.source?`<span class="tag" style="background:#FFF0E0;color:#B36B00">${esc(m.source)}</span>`:''}
          ${PJ[m.project_id]?`<span class="tag" style="background:#EEF2F7;color:#3A424F">${esc(PJ[m.project_id].name)}</span>`:''}
          <span>${m.held_on}</span>${m.duration_sec?`<span>${hms(m.duration_sec)}</span>`:''}
          ${m.company?`<span>${esc(m.company)}${m.dept?' '+esc(m.dept):''}</span>`:''}
          ${m.visibility==='private'?'<span style="color:#C2620F">나만 보기</span>':''}
          ${m.summary_md?'':'<span>요약 없음</span>'}</div></div>`).join('')
     : '<div class="empty">아직 올라온 회의가 없습니다.<br><br>대표님 맥에서 <b>./heimdall push</b> 를 실행하세요.</div>');
  el.querySelectorAll('.card').forEach(c=>c.onclick=()=>{
    if(c.classList.contains('locked'))
      return toast('전사 경영진 회의는 개발자 권한으로 열 수 없습니다.');
    openMeeting(c.dataset.id);});
  el.querySelectorAll('[data-fil]').forEach(b=>b.onclick=()=>{
    sessionStorage.setItem('hd_mfil', b.dataset.fil); renderList();});
  const sa=$('#sharch');
  if(sa) sa.onchange=()=>{sessionStorage.setItem('hd_show_arch', sa.checked?'1':'0'); renderList();};
}

// ─────────────────────────── 회의 상세
async function openMeeting(id){
  editing=false;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  const el=$('#p-meeting'); el.classList.add('on'); el.innerHTML='<div class="sub">불러오는 중…</div>';
  const [m,segs,hls,acts,edits,att] = await Promise.all([
    SB.from('hd_meeting').select('*').eq('id',id).single(),
    SB.from('hd_segment').select('*').eq('meeting_id',id).order('idx'),
    SB.from('hd_highlight').select('*').eq('meeting_id',id).order('idx'),
    SB.from('hd_action').select('*').eq('meeting_id',id).order('idx'),
    SB.from('hd_edit').select('*').eq('meeting_id',id).order('at',{ascending:false}).limit(30),
    SB.from('hd_attendee').select('name').eq('meeting_id',id),
  ]);
  if(m.error) return el.innerHTML=`<div class="empty">${esc(m.error.message)}</div>`;
  cur = {m:m.data, segs:segs.data||[], hls:hls.data||[], acts:acts.data||[],
         edits:edits.data||[], att:(att.data||[]).map(a=>a.name)};
  drawMeeting();
}

function drawMeeting(){
  const {m,segs,hls,acts,edits,att} = cur;
  const names=[...new Set(segs.map(s=>s.speaker).filter(Boolean))];
  const si=n=>'s'+(names.indexOf(n)%6);
  const canReport = ['manager','admin','ceo','dev'].includes(me.role);
  const el=$('#p-meeting');
  el.innerHTML = `
  <div class="row" style="margin-bottom:12px"><button class="btn" id="back">← 목록</button>
    <span class="tag t-${m.status}">${STATUS[m.status]}</span>
    ${m.reported_at?`<span class="sub" style="margin:0">보고 ${m.reported_at.slice(0,10)}</span>`:''}</div>
  <h1 id="mtitle">${esc(m.title)}</h1>
  <div class="sub">${m.source?`<span class="tag" style="background:#FFF0E0;color:#B36B00;margin-right:6px">${esc(m.source)} 사용 회의</span>`:''}${m.held_on} · ${hms(m.duration_sec)} · ${att.length?esc(att.join(', ')):'참석자 미기재'}
    ${(m.company||m.dept)?` · ${esc(m.company||'')} ${esc(m.dept||'')}`:''}
    ${m.visibility==='private'?' · <b style="color:#C2620F">나만 보기</b>':''}</div>
  <div class="row" style="margin-bottom:6px">
    <span style="font-size:13px;color:#5C6672">프로젝트</span>
    <button class="pjbtn none" id="pjsel">분류 안 됨</button>
  </div>
  <div class="tabs">
    <button class="tab" aria-selected="true">하이라이트</button>
    <button class="tab">전사</button><button class="tab">요약</button>
    <button class="tab">마인드맵</button>
    <button class="tab">액션아이템 ${acts.length?`(${acts.filter(a=>a.state==='open').length})`:''}</button>
    <button class="btn" id="cpy" style="margin-left:auto;align-self:center;flex:none">전체 복사</button>
  </div>
  <div class="pane on">${hls.length? hls.map((h,i)=>`<div class="hl" data-i="${i}">
      <div class="ts">${hms(h.start_sec)}</div><h3>${esc(h.headline)}</h3>
      ${(h.points||[]).length?`<ul>${h.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:''}</div>`).join('')
    : '<div class="empty">하이라이트가 없습니다.</div>'}</div>
  <div class="pane"><input class="full" id="q2" placeholder="이 회의에서 찾기" style="margin-bottom:14px">
    <div id="segs">${segs.map(s=>`<div class="seg"><div class="ts">${hms(s.start_sec)}</div>
      <div>${s.speaker?`<span class="spk ${si(s.speaker)}">${esc(s.speaker)}</span><br>`:''}
      <p data-i="${s.idx}">${esc(s.text)}</p></div></div>`).join('')}</div></div>
  <div class="pane"><div class="md" id="smview">${mdHtml(m.summary_md||'')}</div>
    <textarea id="smedit" class="full" style="display:none;min-height:520px;font-family:ui-monospace,Menlo,monospace;font-size:13.5px"></textarea></div>
  <div class="pane" id="mmpane">${(m.mindmap_md||'').trim()
    ? '<div class="sub" style="margin-bottom:8px">가지를 누르면 접었다 폈다 할 수 있습니다 · 마우스 휠로 확대</div><svg id="mmv" style="width:100%;height:600px;background:#fff;border:1px solid #E3E6EB;border-radius:12px"></svg>'
    : '<div class="empty">마인드맵이 없습니다.<br>이 기능이 생기기 전에 만들어진 회의입니다.</div>'}
    <textarea id="mmedit" class="full" style="display:none;min-height:520px;font-family:ui-monospace,Menlo,monospace;font-size:13.5px"></textarea></div>
  <div class="pane">${acts.length? acts.map(a=>`<div class="act ${a.state!=='open'?'done':''}" data-id="${a.id}">
      <input type="checkbox" ${a.state==='done'?'checked':''}>
      <div><div class="task">${esc(a.task)}</div>
        <div class="meta">${esc(a.owner_name||'담당 미정')}${a.due?' · '+esc(a.due):''}
        ${a.done_at?' · 완료 '+a.done_at.slice(0,10):''}</div></div>
      <div class="row" style="gap:4px;align-items:center">
        <span class="tag ${a.state==='done'?'t-reported':'t-review'}">${a.state==='done'?'완료':'진행'}</span>
        ${['admin','ceo','exec','manager','dev'].includes(me.role)?`<button class="delx" data-adel="${a.id}" title="잘못 만들어진 항목 지우기">×</button>`:''}
      </div>
    </div>`).join('') : '<div class="empty">액션아이템이 없습니다.</div>'}</div>
  ${edits.length?`<div class="hist"><b>편집 이력</b>${edits.map(e=>
     `<div>${kst(e.at)} · ${esc(e.editor)} · ${e.kind}</div>`).join('')}</div>`:''}
  <div class="bar">
    ${['admin','ceo','exec'].includes(me.role) ? (m.status==='archived'
       ? '<button class="btn" id="arch">보관 해제</button>'
       : '<button class="btn" id="arch">보관</button>') : ''}
    ${canReport && m.status!=='reported' ? '<button class="btn g" id="rep">경영진 보고</button>':''}
    ${canReport && m.status==='reported' ? '<button class="btn" id="unrep">보고 취소</button>':''}
    ${(m.visibility==='private' && m.owner_id===me.id)
        ? '<button class="btn" id="shr">공유 대상 바꾸기</button>'
          + '<button class="btn g" id="pub">팀에 공개</button>' : ''}
    ${(m.visibility!=='private' && m.source==='플라우드' && ['admin','ceo'].includes(me.role))
        ? '<button class="btn" id="unpub">다시 비공개로</button>' : ''}
    ${(m.visibility!=='private' && SLACK_COS.includes(m.company||''))
      ?`<button class="btn" id="mslack">슬랙에 공유${m.slack_at?' (보냄)':''}</button>`:''}
    ${((m.visibility==='private'&&m.owner_id===me.id)
       ||(m.visibility!=='private'&&(['admin','ceo'].includes(me.role)
           ||(me.role==='exec'&&m.company===me.company))))
      ?'<button class="btn" id="mdel" style="color:#C0392B">삭제</button>':''}
    <button class="btn" id="expdoc">워드로 내보내기</button>
    <button class="btn" id="cancel" style="display:none">취소</button>
    <button class="btn p" id="edit">편집</button></div>`;

  const tabs=[...el.querySelectorAll('.tab')], panes=[...el.querySelectorAll('.pane')];
  tabs.forEach((t,i)=>t.onclick=()=>{tabs.forEach(x=>x.setAttribute('aria-selected','false'));
    panes.forEach(p=>p.classList.remove('on'));t.setAttribute('aria-selected','true');panes[i].classList.add('on');
    if(t.textContent.trim()==='마인드맵') drawMindmap(m);});
  $('#back').onclick=()=>go('list');

  // 지금 보고 있는 탭의 글 전체를 복사합니다
  const cp=$('#cpy');
  if(cp) cp.onclick=async()=>{
    const i=tabs.findIndex(t=>t.getAttribute('aria-selected')==='true');
    let text='';
    if(i===0)      text=hls.map(h=>`[${hms(h.start_sec)}] ${h.headline}\n`
                     +(h.points||[]).map(p=>`  - ${p}`).join('\n')).join('\n\n');
    else if(i===1) text=segs.map(x=>`[${hms(x.start_sec)}]${x.speaker?' '+x.speaker+':':''} ${x.text}`).join('\n');
    else if(i===2) text=m.summary_md||'';
    else if(i===3) text=m.mindmap_md||'';
    else           text=acts.map(a=>`${a.state==='done'?'[완료]':'[진행]'} ${a.task}`
                     +(a.owner_name?` — ${a.owner_name}`:'')+(a.due?` (${a.due})`:'')).join('\n');
    text=(text||'').trim();
    if(!text) return toast('복사할 내용이 없습니다');
    const head=`${m.title} (${m.held_on})\n\n`;
    try{ await navigator.clipboard.writeText(head+text); }
    catch(e){
      const ta=document.createElement('textarea');
      ta.value=head+text; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); ta.remove();
    }
    toast('복사했습니다. 붙여넣기 하시면 됩니다');
  };

  // 슬랙에 공유 — 회사에 맞는 채널로 보냅니다 (처리 서버가 실제 발송)
  const ms=$('#mslack');
  if(ms) ms.onclick=async()=>{
    if(m.slack_at && !confirm('이 회의는 이미 슬랙에 보냈습니다.\n한 번 더 보낼까요?')) return;
    ms.disabled=true; ms.textContent='보내는 중…';
    const {data:d,error}=await SB.from('hd_cmd').insert({kind:'slack_share',
      args:{meeting:m.id}, asked_by:me.id, asked_name:me.name}).select('id').single();
    if(error){ ms.disabled=false; ms.textContent='슬랙에 공유';
      return toast('보내지 못했습니다: '+esc(error.message), 6000); }
    for(let i=0;i<40;i++){
      await new Promise(r=>setTimeout(r,2000));
      const {data:x}=await SB.from('hd_cmd').select('status,result').eq('id',d.id).maybeSingle();
      if(x&&(x.status==='done'||x.status==='failed')){
        ms.disabled=false; ms.textContent='슬랙에 공유';
        return toast((x.status==='failed'?'실패: ':'')+esc(x.result||'보냈습니다'), 6000);
      }
    }
    ms.disabled=false; ms.textContent='슬랙에 공유';
    toast('처리 서버가 응답하지 않습니다. 잠시 뒤 다시 시도해주세요', 6000);
  };

  // 내 노트(아이디어 노트·지시사항)는 주인이 직접 지울 수 있습니다
  const md=$('#mdel');
  if(md) md.onclick=async()=>{
    const what=m.visibility==='private'?'노트':'회의록';
    if(!confirm(`이 ${what}을(를) 완전히 삭제합니다.\n전사·요약·액션아이템이 모두 지워지고 되돌릴 수 없습니다.\n계속할까요?`)) return;
    md.disabled=true;
    const {error}=await SB.from('hd_meeting').delete().eq('id',m.id);
    md.disabled=false;
    if(error) return toast('삭제하지 못했습니다: '+esc(error.message));
    toast('삭제했습니다');
    SDATA=null; loadSideTree(true);
    go('list');
  };

  // 개인 노트의 공유 대상 바꾸기 — 사람 · 회사 전체 · 부서
  const sb2=$('#shr');
  if(sb2) sb2.onclick=async()=>{
    let box=$('#shrbox');
    if(box){ box.remove(); return; }
    box=document.createElement('div');
    box.id='shrbox'; box.className='box';
    box.style.cssText='margin:14px 0;max-height:340px;overflow:auto';
    box.innerHTML='<div class="sub" style="margin:0">불러오는 중…</div>';
    $('#p-meeting').querySelector('.tabs').before(box);

    const [mem, shr] = await Promise.all([
      SB.from('hd_member').select('id,name,company,dept')
        .eq('approved',true).neq('id',me.id).order('name'),
      SB.from('hd_meeting_share').select('member_id').eq('meeting_id', m.id)]);
    const people=mem.data||[];
    const has=new Set((shr.data||[]).map(x=>x.member_id));
    const cos=[...new Set(people.map(x=>x.company).concat([me.company]).filter(Boolean))].sort();
    const dps=[...new Set(people.concat([me]).filter(x=>x.company&&x.dept)
                .map(x=>x.company+'|'+x.dept))].sort();
    const hc=new Set(m.share_companies||[]), hd=new Set(m.share_depts||[]);

    box.innerHTML=`
      <div class="sub" style="margin:0 0 8px">아무것도 체크하지 않으면 <b>나만</b> 볼 수 있습니다</div>
      <div class="shsec">사람</div>
      <div class="row" style="flex-wrap:wrap;gap:6px 16px">
        ${people.map(x=>`<label class="shlb"><input type="checkbox" class="sp" value="${x.id}"
          ${has.has(x.id)?'checked':''}> ${esc(x.name)}
          <span class="sub" style="margin:0;font-size:11.5px">${esc(x.company||'')}</span></label>`).join('')
          || '구성원이 없습니다'}
      </div>
      <div class="shsec">회사 전체</div>
      <div class="row" style="flex-wrap:wrap;gap:6px 16px">
        ${cos.map(c=>`<label class="shlb"><input type="checkbox" class="sc" value="${esc(c)}"
          ${hc.has(c)?'checked':''}> ${esc(c)} 전체</label>`).join('')}
      </div>
      <div class="shsec">부서</div>
      <div class="row" style="flex-wrap:wrap;gap:6px 16px">
        ${dps.map(k=>{const [c,d]=k.split('|');
          return `<label class="shlb"><input type="checkbox" class="sd" value="${esc(k)}"
            ${hd.has(k)?'checked':''}> ${esc(d)}
            <span class="sub" style="margin:0;font-size:11.5px">${esc(c)}</span></label>`;}).join('')}
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn p" id="shrsave">저장</button>
        <button class="btn" id="shrclose">닫기</button>
        <span class="sub" style="margin:0">저장하면 체크한 대상에게만 보입니다</span>
      </div>`;

    $('#shrclose').onclick=()=>box.remove();
    $('#shrsave').onclick=async()=>{
      const ids=[...box.querySelectorAll('.sp:checked')].map(x=>x.value);
      const co =[...box.querySelectorAll('.sc:checked')].map(x=>x.value);
      const dp =[...box.querySelectorAll('.sd:checked')].map(x=>x.value);
      const btn=$('#shrsave'); btn.disabled=true;
      const up=await SB.from('hd_meeting')
        .update({share_companies:co, share_depts:dp}).eq('id',m.id);
      if(up.error){ btn.disabled=false; return toast('저장하지 못했습니다: '+esc(up.error.message)); }
      await SB.from('hd_meeting_share').delete().eq('meeting_id', m.id);
      if(ids.length)
        await SB.from('hd_meeting_share')

    const {error}=await SB.from('hd_meeting')

    if(error){toast('변경 실패: '+esc(error.message));cb.checked=!cb.checked;return;}

    delAction(b.dataset.adel, ()=>openMeeting(m.id)));

  const arch=$('#arch');
  if(arch) arch.onclick=async()=>{
    const undo = m.status==='archived';
    if(!undo && !confirm('이 회의를 보관합니다.\n목록에서 사라지지만 서버에는 남고, 「보관된 회의 보기」로 다시 볼 수 있습니다.')) return;

    if(!confirm('이 회의록을 경영진께 보고합니다. 보고 후에는 부서 관리자만 수정할 수 있습니다.')) return;

    toast('경영진 보고 완료');openMeeting(m.id);};
  if(unrep) unrep.onclick=async()=>{
    const {error}=await SB.rpc('hd_unreport',{mid:m.id});
    if(error) return toast('실패: '+esc(error.message));
    toast('보고를 취소했습니다');openMeeting(m.id);};

  $('#edit').onclick=()=>editing?saveMeeting():startEdit();

  // 프로젝트 고르기 — 수가 많아도 검색으로 찾습니다
  (async()=>{
    const btn=$('#pjsel'); if(!btn) return;
    const {data}=await SB.from('hd_project').select('id,name,color,description')
      .eq('archived',false).order('name');

      btn.textContent=p?p.name:'분류 안 됨'; btn.classList.toggle('none',!p); };
    paint();

      const to=await pickProject(list, curId, '어느 프로젝트에 넣을까요?');

        .update({project_id:to||null}).eq('id',m.id).select('id');

      if(!(d2||[]).length)

    };

}

function startEdit(){
  const el=$('#p-meeting');
  const nm = s => (s||'').replace(/\s/g,'');
  const same = (a,b) => nm(a).length>1 && nm(b).length>1 && (nm(a).includes(nm(b)) || nm(b).includes(nm(a)));
  const allowed = ['manager','admin','ceo','dev'].includes(me.role) || cur.att.some(a=>same(a, me.name));
  if(!allowed) return toast('이 회의 참석자만 수정할 수 있습니다.<br>참석자: '+esc(cur.att.join(', ')||'미기재'),5000);
  if(cur.m.status==='reported' && !['manager','admin','ceo','dev'].includes(me.role))
    return toast('경영진께 보고된 회의는 부서 관리자만 수정할 수 있습니다.',5000);
  editing=true;
  el.querySelectorAll('#segs p, .hl h3, .hl li').forEach(e=>{e.contentEditable='true';e.spellcheck=false;});
  const mt=$('#mtitle'); if(mt){ mt.contentEditable='true'; mt.spellcheck=false; }
  $('#smview').style.display='none';
  const ta=$('#smedit'); ta.style.display='block'; ta.value=cur.m.summary_md||'';
  // 마인드맵 — 그림 대신 글상자를 보여줍니다. # 은 큰 가지, ## 는 작은 가지입니다
  const pane=$('#mmpane');
  if(pane){
    pane.querySelectorAll('svg,.sub,.empty,.md').forEach(x=>x.style.display='none');

    if(!mmta){ mmta=document.createElement('textarea'); mmta.id='mmedit'; mmta.className='full';
      mmta.style.cssText='min-height:520px;font-family:ui-monospace,Menlo,monospace;font-size:13.5px';
      pane.appendChild(mmta); }

  }
  $('#edit').textContent='저장'; $('#cancel').style.display='';
  toast('편집 중입니다. 글자를 눌러 바로 고치세요.');
}

async function saveMeeting(){
  const el=$('#p-meeting'), btn=$('#edit');
  btn.disabled=true; btn.textContent='저장 중…';
  const id=cur.m.id, msg=[];

  const changed=[];
  el.querySelectorAll('#segs p').forEach(p=>{
    const i=+p.dataset.i, t=p.innerText.trim(), o=cur.segs.find(s=>s.idx===i);
    if(o && t!==o.text) changed.push({old:o.text,neu:t,row:o});
  });
  for(const c of changed) await SB.from('hd_segment').update({text:c.neu}).eq('id',c.row.id);
  if(changed.length){
    msg.push(`전사 ${changed.length}곳 수정`);
    const rules = learn(changed);
    if(rules.length){
      await SB.from('hd_rule').upsert(rules.map(r=>({wrong:r.a,right_:r.b,reason:r.why,
        approved:r.ok,by_name:me.name})),{onConflict:'wrong'});
      const ok=rules.filter(r=>r.ok);
      if(ok.length) msg.push('교정 규칙 <b>'+ok.map(r=>r.a+'→'+r.b).join(', ')+'</b> 등록');
    }
  }

  const hls=[...el.querySelectorAll('.hl')];
  for(const h of hls){
    const i=+h.dataset.i, o=cur.hls[i]; if(!o) continue;
    const head=h.querySelector('h3').innerText.trim();
    const pts=[...h.querySelectorAll('li')].map(li=>li.innerText.trim()).filter(Boolean);
    if(head!==o.headline || JSON.stringify(pts)!==JSON.stringify(o.points))
      await SB.from('hd_highlight').update({headline:head,points:pts}).eq('id',o.id);
  }
  const mt2=$('#mtitle');
  if(mt2){
    const t=mt2.innerText.trim();
    if(t && t!==cur.m.title){
      await SB.from('hd_meeting').update({title:t.slice(0,300)}).eq('id',id);
      msg.push('제목 수정');
    }
  }
  const sm=$('#smedit').value;
  if(sm!==(cur.m.summary_md||'')){
    await SB.from('hd_meeting').update({summary_md:sm}).eq('id',id);
    msg.push('요약 수정');
  }
  const mmta=$('#mmedit');
  if(mmta && mmta.value!==(cur.m.mindmap_md||'')){
    await SB.from('hd_meeting').update({mindmap_md:mmta.value}).eq('id',id);
    MM_DRAWN=null;                       // 다시 열 때 새로 그립니다
    msg.push('마인드맵 수정');
  }
  await SB.from('hd_edit').insert({meeting_id:id, editor:me.name, kind:'web',
    detail:{문장:changed.length}});
  toast(msg.join('<br>')||'변경 사항이 없습니다', 3000);
  setTimeout(()=>openMeeting(id), 900);
}

// 낱말 하나가 낱말 하나로 바뀐 것만 규칙 후보로 봅니다 (맥 쪽 rules.py 와 같은 기준)
const COMMON=new Set('그거 그건 그게 지금 아직 오늘 내일 어제 이후 이전 대상 상태 상황 내용 부분 경우 정도 문제 방법 생각 사람 시간 다음 이번 나중 우리 저희'.split(' '));
function learn(changed){
  const out=[];
  for(const c of changed){
    const A=c.old.match(/[가-힣]+|[A-Za-z][A-Za-z0-9]*/g)||[], B=c.neu.match(/[가-힣]+|[A-Za-z][A-Za-z0-9]*/g)||[];
    if(A.length!==B.length) continue;
    for(let i=0;i<A.length;i++){
      if(A[i]===B[i]) continue;
      const a=A[i], b=B[i];
      const ok = a.length>=3 && !COMMON.has(a) && !COMMON.has(b) && a.length<=12;
      out.push({a,b,ok,why: ok?'웹 편집에서 학습':'검토 필요 (짧거나 흔한 낱말)'});
    }
  }
  return out;
}

    <div class="box">${open.length?open.map(card).join(''):'<div style="color:#98A0AC">진행 중인 항목이 없습니다.</div>'}</div>
    ${done.length?`<h1 style="font-size:17px;margin-top:26px">완료</h1><div class="box">${done.map(card).join('')}</div>`:''}`;

          <div class="meta">${esc(m.email)} · ${esc(m.company||'')} ${esc(m.dept||'')} · 모든 권한 없음 · 남긴 자료는 보존됩니다</div></div>
        <div class="row">
          <button class="btn bk" data-id="${m.id}">복직</button>

  bindOrgSelects('iv-co','iv-dept','');
  el.querySelectorAll('.mco').forEach(x=>x.onchange=()=>{

      if(error){ btn.disabled=false; return out.textContent='실패: '+error.message; }
      for(let i=0;i<45;i++){
        await new Promise(r=>setTimeout(r,2000));
        const {data:x}=await SB.from('hd_cmd').select('status,result').eq('id',d.id).maybeSingle();
        if(x&&(x.status==='done'||x.status==='failed')){
          out.textContent=(x.status==='failed'?'실패: ':'')+(x.result||'');
          btn.disabled=false; return;
        }
      }
      out.textContent='응답이 없습니다. 처리 서버가 켜져 있는지 확인해주세요.';
      btn.disabled=false;
    };

    const gl=$('#mdet-glsave');
    if(gl) gl.onclick=async()=>{
      gl.disabled=true;
      const v=($('#mdet-gl').value||'').trim().toLowerCase();

    const sv2=$('#mdet-save');

      box.querySelectorAll('.mdp2').forEach(c=>{
        const p=pjs.find(x=>x.id===c.value); if(!p) return;
        if(c.checked===rule(p)) dels.push(p.id);
        else rows.push({project_id:p.id, member_id:id, allow:c.checked});
      });
      if(dels.length)
        await SB.from('hd_project_acl').delete().eq('member_id',id).in('project_id',dels);

      if(rows.length){
        const r=await SB.from('hd_project_acl')
          .upsert(rows,{onConflict:'project_id,member_id'});
        err=r.error;
      }
      sv2.disabled=false;
      if(err) return toast('저장하지 못했습니다: '+esc(err.message));
      toast('폴더 권한을 저장했습니다');

  el.querySelectorAll('.alld').forEach(c=>c.onchange=async()=>{
    const {error}=await SB.from('hd_member')

  el.querySelectorAll('.sv').forEach(b=>b.onclick=async()=>{
    const {error}=await SB.rpc('hd_set_role',{uid:b.dataset.id, new_role:roleOf(b.dataset.id)});
