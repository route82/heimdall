const AUTH_MSG = {
  'Invalid login credentials':'이메일 또는 비밀번호가 맞지 않습니다.',
  'User already registered':'이미 가입된 이메일입니다. 로그인해주세요.',
  'Password should be at least 6 characters.':'비밀번호는 6자 이상이어야 합니다.',
  'Email not confirmed':'메일 확인이 필요한 설정입니다. 관리자에게 문의해주세요.',
};
const authErr = m => AUTH_MSG[m] || m;

function loginPage(mode='in', msg=''){
  const isUp = mode==='up';
  $('#app').innerHTML = `<div class="login">
    <div class="mark"><svg class="bolt" viewBox="0 0 742 262" fill="currentColor" aria-hidden="true"><polygon points="0,112 52,112 53,147 440,147 524,53 741,1 741,227 565,185 334,262 56,188 53,188 51,221 0,220"/></svg><span>HEIMDALL</span></div>
    <div class="tabs" style="margin:4px 0 20px">
      <button class="tab" data-m="in" ${!isUp?'aria-selected="true"':''}>로그인</button>
      <button class="tab" data-m="up" ${isUp?'aria-selected="true"':''}>가입</button>
    </div>
    <input class="full" id="em" type="email" placeholder="회사 이메일" autocomplete="username"
           value="${esc(localStorage.getItem('hd_email')||'')}" style="margin-bottom:10px">
    <input class="full" id="pw" type="password" placeholder="비밀번호 (6자 이상)"
           autocomplete="current-password" style="margin-bottom:10px">
    ${isUp?`
      <input class="full" id="nm" placeholder="이름 (예: 김현우)" style="margin-bottom:10px">
      <select class="full" id="co" style="margin-bottom:10px">
        <option value="">소속 회사 선택</option>
        ${COMPANIES.map(c=>`<option>${c}</option>`).join('')}
      </select>
      <input class="full" id="dp" placeholder="부서 (예: 글로벌커머스팀)" style="margin-bottom:10px">`:''}
    ${!isUp?`<div class="opts">
      <label><input type="checkbox" id="rem" ${localStorage.getItem('hd_email')?'checked':''}> 아이디 저장</label>
      <label><input type="checkbox" id="auto" ${localStorage.getItem('hd_auto')==='1'?'checked':''}> 자동 로그인</label>
    </div>`:''}
    <button class="btn p full" id="go">${isUp?'가입하고 시작하기':'로그인'}</button>
    ${!isUp?'<button class="btn full" id="reset" style="margin-top:9px;border:0;color:#8A93A1;font-size:13px">비밀번호를 잊으셨나요?</button>':''}
    <p style="margin-top:14px;font-size:13px;color:${msg.startsWith('!')?'#C0392B':'#98A0AC'}">${esc(msg.replace(/^!/,''))}</p>
    ${isUp?'<p style="font-size:12.5px;color:#98A0AC;margin:0">가입 신청 후 관리자 승인이 있어야 이용하실 수 있습니다.</p>':''}
  </div>`;

  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>loginPage(t.dataset.m));

  const email=()=>$('#em').value.trim(), pw=()=>$('#pw').value;
  $('#go').onclick = async () => {
    if(!email()||!pw()) return loginPage(mode,'!이메일과 비밀번호를 입력해주세요.');
    $('#go').disabled=true; $('#go').textContent='잠시만요…';
    if(isUp){
      const nm=$('#nm').value.trim(), co=$('#co').value, dp=$('#dp').value.trim();
      if(!nm||!co) { return loginPage('up','!이름과 소속 회사는 반드시 입력해주세요.'); }
      const {data,error} = await SB.auth.signUp({email:email(), password:pw(),
        options:{data:{name:nm, company:co, dept:dp}}});
      if(error) return loginPage('up','!'+authErr(error.message));
      if(!data.session)
        return loginPage('in','가입되었습니다. 메일 확인이 필요한 설정이라면 메일함을 확인해주세요.');
      // 트리거가 못 채운 경우를 대비해 한 번 더 저장합니다
      await SB.from('hd_member').update({name:nm, company:co, dept:dp}).eq('id',data.user.id);
      localStorage.setItem('hd_email', email());
      localStorage.setItem('hd_auto', '1');
      sessionStorage.setItem('hd_live','1');
      boot();
    } else {
      const {error} = await SB.auth.signInWithPassword({email:email(), password:pw()});
      if(error) return loginPage('in','!'+authErr(error.message));
      const rem=$('#rem')?.checked, auto=$('#auto')?.checked;
      if(rem) localStorage.setItem('hd_email', email()); else localStorage.removeItem('hd_email');
      localStorage.setItem('hd_auto', auto?'1':'0');
      sessionStorage.setItem('hd_live','1');
      boot();
    }
  };
  $('#em')?.addEventListener('keydown',e=>{if(e.key==='Enter')$('#pw').focus();});
  $('#pw')?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!isUp)$('#go').click();});
  const rs=$('#reset');
  if(rs) rs.onclick = async () => {
    if(!email()) return loginPage('in','!이메일을 먼저 입력해주세요.');
    const {error} = await SB.auth.resetPasswordForEmail(email(), {redirectTo:location.href});
    loginPage('in', error? '!'+authErr(error.message) : '재설정 메일을 보냈습니다.');
  };
}

// 가입 정보가 비어 있으면 채우게 합니다 (예전 계정 대응)
function profilePage(row, msg=''){
  $('#app').innerHTML = `<div class="login">
    <div class="mark"><svg class="bolt" viewBox="0 0 742 262" fill="currentColor" aria-hidden="true"><polygon points="0,112 52,112 53,147 440,147 524,53 741,1 741,227 565,185 334,262 56,188 53,188 51,221 0,220"/></svg><span>HEIMDALL</span></div>
    <h2>프로필 확인</h2>

    <input class="full" id="nm" placeholder="이름 (예: 김현우)" value="${esc(row.name||'')}" style="margin-bottom:10px">
    <select class="full" id="co" style="margin-bottom:10px">
      <option value="">소속 회사 선택</option>
      ${COMPANIES.map(c=>`<option ${row.company===c?'selected':''}>${c}</option>`).join('')}
    </select>
    <input class="full" id="dp" placeholder="부서" value="${esc(row.dept||'')}" style="margin-bottom:12px">
    <button class="btn p full" id="save">저장하고 시작하기</button>
    <p style="margin-top:12px;font-size:13px;color:#C0392B">${esc(msg)}</p>

  $('#save').onclick = async () => {

    if(error) return profilePage(row, error.message);

function go(v){
  view=v; cur=null;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.nav').forEach(b=>b.setAttribute('aria-current', b.dataset.v===v));
  const el=$('#p-'+v); if(el) el.classList.add('on');
  ({list:renderList, search:renderSearch, actions:renderActions, brief:renderBrief,
    members:renderMembers, chat:renderChat, projects:renderProjects,
    upload:renderUpload, rec:renderRec, server:renderServer,
    guide:renderGuide, usage:renderUsage}[v]||(()=>{}))();
}

// ─────────────────────────── 회의 목록
async function renderList(){
  const el=$('#p-list'); el.innerHTML='<div class="sub">불러오는 중…</div>';
  const showArch = sessionStorage.getItem('hd_show_arch')==='1';
  let q = SB.from('hd_meeting')
      .select('id,title,held_on,status,duration_sec,company,dept,summary_md,project_id,source')
      .order('held_on',{ascending:false}).limit(200);
  if(!showArch) q = q.neq('status','archived');
  const [mres, pres] = await Promise.all([q,
    SB.from('hd_project').select('id,name,color')]);
  const {data,error} = mres;
  if(error) return el.innerHTML=`<div class="empty">${esc(error.message)}</div>`;
  const PJ = Object.fromEntries((pres.data||[]).map(p=>[p.id,p]));
  const canArch = ['admin','exec'].includes(me.role);
  el.innerHTML = `<h1>회의</h1><div class="sub">${data.length}건 · ${ROLE[me.role]} 권한으로 보이는 것만 표시됩니다
    ${canArch?`<label style="margin-left:12px;cursor:pointer"><input type="checkbox" id="sharch"
      ${showArch?'checked':''} style="width:14px;height:14px;vertical-align:-2px"> 보관된 회의 보기</label>`:''}</div>`
   + (data.length? data.map(m=>`<div class="card" data-id="${m.id}">
        <div class="ct">${esc(m.title)}</div>
        <div class="cm"><span class="tag t-${m.status}">${STATUS[m.status]}</span>
          ${m.source?`<span class="tag" style="background:#FFF0E0;color:#B36B00">${esc(m.source)}</span>`:''}
          ${PJ[m.project_id]?`<span class="tag" style="background:#EEF2F7;color:#3A424F">${esc(PJ[m.project_id].name)}</span>`:''}
          <span>${m.held_on}</span>${m.duration_sec?`<span>${hms(m.duration_sec)}</span>`:''}
          ${m.company?`<span>${esc(m.company)}${m.dept?' '+esc(m.dept):''}</span>`:''}
          ${m.summary_md?'':'<span>요약 없음</span>'}</div></div>`).join('')
     : '<div class="empty">아직 올라온 회의가 없습니다.<br><br>대표님 맥에서 <b>./heimdall push</b> 를 실행하세요.</div>');
  el.querySelectorAll('.card').forEach(c=>c.onclick=()=>openMeeting(c.dataset.id));
  const sa=$('#sharch');
  if(sa) sa.onchange=()=>{sessionStorage.setItem('hd_show_arch', sa.checked?'1':'0'); renderList();};
}

// ─────────────────────────── 회의 상세
async function openMeeting(id){
  editing=false;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  const el=$('#p-meeting'); el.classList.add('on'); el.innerHTML='<div class="sub">불러오는 중…</div>';
  const [m,segs,hls,acts,edits,att] = await Promise.all([
    SB.from('hd_meeting').select('*').eq('id',id).single(),
    SB.from('hd_segment').select('*').eq('meeting_id',id).order('idx'),
    SB.from('hd_highlight').select('*').eq('meeting_id',id).order('idx'),
    SB.from('hd_action').select('*').eq('meeting_id',id).order('idx'),
    SB.from('hd_edit').select('*').eq('meeting_id',id).order('at',{ascending:false}).limit(30),
    SB.from('hd_attendee').select('name').eq('meeting_id',id),
  ]);
  if(m.error) return el.innerHTML=`<div class="empty">${esc(m.error.message)}</div>`;
  cur = {m:m.data, segs:segs.data||[], hls:hls.data||[], acts:acts.data||[],
         edits:edits.data||[], att:(att.data||[]).map(a=>a.name)};
  drawMeeting();
}

function startEdit(){
  const el=$('#p-meeting');
  const nm = s => (s||'').replace(/\s/g,'');
  const same = (a,b) => nm(a).length>1 && nm(b).length>1 && (nm(a).includes(nm(b)) || nm(b).includes(nm(a)));
  const allowed = ['manager','admin'].includes(me.role) || cur.att.some(a=>same(a, me.name));
  if(!allowed) return toast('이 회의 참석자만 수정할 수 있습니다.<br>참석자: '+esc(cur.att.join(', ')||'미기재'),5000);
  if(cur.m.status==='reported' && !['manager','admin'].includes(me.role))
    return toast('경영진께 보고된 회의는 부서 관리자만 수정할 수 있습니다.',5000);
  editing=true;
  el.querySelectorAll('#segs p, .hl h3, .hl li').forEach(e=>{e.contentEditable='true';e.spellcheck=false;});
  $('#smview').style.display='none';
  const ta=$('#smedit'); ta.style.display='block'; ta.value=cur.m.summary_md||'';
  $('#edit').textContent='저장'; $('#cancel').style.display='';
  toast('편집 중입니다. 글자를 눌러 바로 고치세요.');
}

async function saveMeeting(){
  const el=$('#p-meeting'), btn=$('#edit');
  btn.disabled=true; btn.textContent='저장 중…';
  const id=cur.m.id, msg=[];

  const changed=[];
  el.querySelectorAll('#segs p').forEach(p=>{
    const i=+p.dataset.i, t=p.innerText.trim(), o=cur.segs.find(s=>s.idx===i);
    if(o && t!==o.text) changed.push({old:o.text,neu:t,row:o});
  });
  for(const c of changed) await SB.from('hd_segment').update({text:c.neu}).eq('id',c.row.id);
  if(changed.length){
    msg.push(`전사 ${changed.length}곳 수정`);
    const rules = learn(changed);
    if(rules.length){
      await SB.from('hd_rule').upsert(rules.map(r=>({wrong:r.a,right_:r.b,reason:r.why,
        approved:r.ok,by_name:me.name})),{onConflict:'wrong'});
      const ok=rules.filter(r=>r.ok);
      if(ok.length) msg.push('교정 규칙 <b>'+ok.map(r=>r.a+'→'+r.b).join(', ')+'</b> 등록');
    }
  }

  const hls=[...el.querySelectorAll('.hl')];
  for(const h of hls){
    const i=+h.dataset.i, o=cur.hls[i]; if(!o) continue;
    const head=h.querySelector('h3').innerText.trim();
    const pts=[...h.querySelectorAll('li')].map(li=>li.innerText.trim()).filter(Boolean);
    if(head!==o.headline || JSON.stringify(pts)!==JSON.stringify(o.points))
      await SB.from('hd_highlight').update({headline:head,points:pts}).eq('id',o.id);
  }
  const sm=$('#smedit').value;
  if(sm!==(cur.m.summary_md||'')){
    await SB.from('hd_meeting').update({summary_md:sm}).eq('id',id);
    msg.push('요약 수정');
  }
  await SB.from('hd_edit').insert({meeting_id:id, editor:me.name, kind:'web',
    detail:{문장:changed.length}});
  toast(msg.join('<br>')||'변경 사항이 없습니다', 3000);
  setTimeout(()=>openMeeting(id), 900);
}

// 낱말 하나가 낱말 하나로 바뀐 것만 규칙 후보로 봅니다 (맥 쪽 rules.py 와 같은 기준)
const COMMON=new Set('그거 그건 그게 지금 아직 오늘 내일 어제 이후 이전 대상 상태 상황 내용 부분 경우 정도 문제 방법 생각 사람 시간 다음 이번 나중 우리 저희'.split(' '));
function learn(changed){
  const out=[];
  for(const c of changed){
    const A=c.old.match(/[가-힣]+|[A-Za-z][A-Za-z0-9]*/g)||[], B=c.neu.match(/[가-힣]+|[A-Za-z][A-Za-z0-9]*/g)||[];
    if(A.length!==B.length) continue;
    for(let i=0;i<A.length;i++){
      if(A[i]===B[i]) continue;
      const a=A[i], b=B[i];
      const ok = a.length>=3 && !COMMON.has(a) && !COMMON.has(b) && a.length<=12;
      out.push({a,b,ok,why: ok?'웹 편집에서 학습':'검토 필요 (짧거나 흔한 낱말)'});
    }
  }
  return out;
}

  const run=async()=>{

    $('#res').innerHTML='<div class="sub">찾는 중…</div>';
    const {data,error}=await SB.rpc('hd_search',{q, lim:80});

    if(!data.length) return $('#res').innerHTML='<div class="empty">결과가 없습니다.</div>';
    const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');

      `<div class="hit" data-id="${r.meeting_id}"><div class="h">${esc(r.title)} · ${r.held_on} · ${hms(r.start_sec)}${r.speaker?' · '+esc(r.speaker):''}</div>

// ─────────────────────────── 물어보기 (챗봇 · 대화방)
const SUGGEST = ['어제 무슨 회의를 했나요?', '이번 주 회의 핵심만 간략하게 정리해주세요',
  '아직 안 끝난 할 일을 담당자별로 알려주세요', '경영진이 결정해야 할 것이 있나요?'];
let chatBusy=false, rooms=[], curRoom=null;

async function renderChat(){
  const el=$('#p-chat');
  el.innerHTML=`<h1>물어보기</h1>
    <div class="sub">회의 기록을 근거로 답합니다. 대화는 방마다 이어집니다.</div>
    <div class="chatwrap">
      <div class="rooms" id="rooms"></div>
      <div class="chatmain">
        <div class="chips" id="chatchips">${SUGGEST.map(q=>`<button class="chip sg">${esc(q)}</button>`).join('')}</div>
        <div class="chat" id="chatlog"></div>
        <div class="ask">
          <textarea id="qq" placeholder="예: 어제 더올마이티 회의 핵심만 간략하게 보고해주세요"></textarea>
          <button class="btn p" id="send">보내기</button>
        </div>
      </div>
    </div>`;
  el.querySelectorAll('.sg').forEach(b=>b.onclick=()=>{$('#qq').value=b.textContent;$('#qq').focus();});
  $('#send').onclick=ask;
  $('#qq').onkeydown=e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey))ask();};
  await loadRooms();
}

async function loadRooms(){
  const {data}=await SB.from('hd_chat_room').select('*')
    .order('pinned',{ascending:false}).order('updated_at',{ascending:false}).limit(60);
  rooms=data||[];
  if(curRoom && !rooms.some(r=>r.id===curRoom)) curRoom=null;
  if(!curRoom && rooms.length) curRoom=rooms[0].id;
  drawRooms();
  await loadMsgs();
}

function drawRooms(){
  const box=$('#rooms'); if(!box) return;
  box.innerHTML=`<button class="btn newbtn" id="newroom">+ 새 대화</button>`+
    (rooms.length? rooms.map(r=>{
      return `<div class="room ${r.id===curRoom?'on':''}" data-id="${r.id}">
      <span class="nm">${r.pinned?'★ ':''}${esc(r.title)}</span>
      <button class="ic ren" data-id="${r.id}" title="이름 바꾸기">✎</button>
      <button class="ic pin ${r.pinned?'on':''}" data-id="${r.id}" title="${r.pinned?'고정 해제':'위에 고정'}">${r.pinned?'★':'☆'}</button>
      <button class="ic del" data-id="${r.id}" title="삭제">×</button>
    </div>`;}).join('')
    :'<div style="padding:12px;font-size:12.5px;color:#98A0AC">질문을 보내면 대화가 여기에 쌓입니다</div>');

  $('#newroom').onclick=()=>{curRoom=null; drawRooms(); $('#chatlog').innerHTML=''; $('#qq').focus();};
  box.querySelectorAll('.room').forEach(r=>r.onclick=e=>{
    if(e.target.closest('.ic')) return;
    curRoom=r.dataset.id; drawRooms(); loadMsgs();});
  box.querySelectorAll('.ren').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    const r=rooms.find(x=>x.id===b.dataset.id);
    const name=prompt('대화 이름을 입력하세요', r.title);
    if(name===null) return;
    const t=name.trim();
    if(!t) return toast('이름을 입력해주세요');
    const {error}=await SB.from('hd_chat_room').update({title:t.slice(0,60)}).eq('id',r.id);
    if(error) return toast('실패: '+esc(error.message));
    loadRooms();});

  box.querySelectorAll('.pin').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    const r=rooms.find(x=>x.id===b.dataset.id);
    const {error}=await SB.from('hd_chat_room').update({pinned:!r.pinned}).eq('id',r.id);
    if(error) return toast('실패: '+esc(error.message));
    loadRooms();});
  box.querySelectorAll('.del').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    const r=rooms.find(x=>x.id===b.dataset.id);
    if(!confirm(`「${r.title}」 대화를 삭제합니다.\n안의 질문·답변이 모두 지워지며 되돌릴 수 없습니다.`)) return;
    const {error}=await SB.from('hd_chat_room').delete().eq('id',r.id);
    if(error) return toast('삭제 실패: '+esc(error.message));
    if(curRoom===r.id) curRoom=null;
    toast('삭제했습니다'); loadRooms();});
}

async function loadMsgs(){
  const log=$('#chatlog'); if(!log) return;
  log.innerHTML='';
  if(!curRoom) return;
  const {data}=await SB.from('hd_chat').select('*').eq('room_id',curRoom)
    .order('created_at').limit(50);
  (data||[]).forEach(drawMsg);
  scrollChat();
  (data||[]).filter(c=>c.status==='queued'||c.status==='working').forEach(c=>watch(c.id));
}

function drawMsg(c){
  const log=$('#chatlog'); if(!log) return;
  let q=log.querySelector(`[data-q="${c.id}"]`);
  if(!q){
    q=document.createElement('div'); q.className='msg q'; q.dataset.q=c.id;
    q.textContent=c.question; log.appendChild(q);
  }
  let a=log.querySelector(`[data-a="${c.id}"]`);
  if(!a){ a=document.createElement('div'); a.dataset.a=c.id; log.appendChild(a); }
  if(c.status==='done'){
    const src=(c.used||[]).length?`<div class="src">근거 ${c.used.length}건 · `
      + c.used.slice(0,4).map(u=>esc(u.title)).join(', ') + (c.used.length>4?' 외':'') + '</div>':'';
    a.className='msg a'; a.innerHTML=`<div class="md">${mdHtml(c.answer)}</div>${src}`;
  }else if(c.status==='failed'){
    a.className='msg a'; a.innerHTML=`<div class="md"><p>답을 만들지 못했습니다.</p>
      <p style="color:#98A0AC;font-size:13px">${esc(c.error||'')}</p></div>`;
  }else{
    a.className='msg wait'; a.textContent='회의 기록을 찾아보고 있습니다…';
  }
}

function scrollChat(){ window.scrollTo(0,document.body.scrollHeight); }

async function watch(id){
  for(let i=0;i<90;i++){
    await new Promise(r=>setTimeout(r,2000));
    const {data:c}=await SB.from('hd_chat').select('*').eq('id',id).single();
    if(!c) return;
    drawMsg(c);
    if(c.status==='done'||c.status==='failed') return;
  }
  const a=$('#chatlog')?.querySelector(`[data-a="${id}"]`);
  if(a && a.classList.contains('wait'))
    a.textContent='답이 오지 않습니다. 사무실 처리 컴퓨터가 켜져 있는지 확인해주세요.';
}

async function ask(){
  if(chatBusy) return;
  const t=$('#qq'); const q=t.value.trim(); if(!q) return;
  chatBusy=true; t.value=''; $('#send').disabled=true;

  try{
    if(!curRoom){
      const title=q.length>28? q.slice(0,28)+'…' : q;
      const {data:r,error:e1}=await SB.from('hd_chat_room')
        .insert({owner_id:me.id, title}).select().single();
      if(e1) throw e1;
      curRoom=r.id;
    }
    const {data,error}=await SB.from('hd_chat')
      .insert({asker_id:me.id, asker_name:me.name, question:q, room_id:curRoom})
      .select().single();
    if(error) throw error;
    await SB.from('hd_chat_room').update({updated_at:new Date().toISOString()}).eq('id',curRoom);
    await loadRooms();
    drawMsg(data); scrollChat();
    chatBusy=false; $('#send').disabled=false;
    await watch(data.id);
    scrollChat();
  }catch(e){
    chatBusy=false; $('#send').disabled=false;
    toast('보내지 못했습니다: '+esc(e.message||e));
  }
}

// ─────────────────────────── 프로젝트 고르는 창
// 프로젝트가 수백·수천 개가 되어도 찾을 수 있도록 검색으로 고릅니다.
// 이름·설명은 물론 초성(ㅇㅅㅌㄴㅇ)으로도 찾습니다.
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const chosung = t => [...t].map(ch=>{const c=ch.charCodeAt(0);
  return (c>=0xAC00&&c<=0xD7A3)?CHO[Math.floor((c-0xAC00)/588)]:ch;}).join('');
function pjMatch(p, q){
  const t=q.replace(/\s/g,'').toLowerCase();
  if(!t) return true;
  const n=(p.name+' '+(p.description||'')).replace(/\s/g,'').toLowerCase();
  if(n.includes(t)) return true;
  if(/^[ㄱ-ㅎ]+$/.test(t)) return chosung(n).includes(t);
  return false;
}
const recentPj = () => { try{return JSON.parse(localStorage.getItem('hd_pj_recent')||'[]');}catch(e){return [];} };
const pushRecent = id => { if(!id) return;
  const r=[id, ...recentPj().filter(x=>x!==id)].slice(0,5);
  localStorage.setItem('hd_pj_recent', JSON.stringify(r)); };

function pickProject(projects, curId, title='프로젝트 고르기'){
  return new Promise(resolve=>{
    const canMake=['admin','manager'].includes(me.role);
    const mask=document.createElement('div'); mask.className='mask';
    mask.innerHTML=`<div class="pick">
      <div class="hd"><h3>${esc(title)}</h3>
        <input id="pkq" placeholder="이름으로 찾기 (초성도 됩니다)" autocomplete="off"></div>
      <div class="bd" id="pkb"></div>
      <div class="ft">
        ${canMake?'<button class="btn" id="pknew">새 프로젝트</button>':''}
        <button class="btn" id="pkc" style="margin-left:auto">닫기</button></div></div>`;
    document.body.appendChild(mask);
    const q=mask.querySelector('#pkq'), bd=mask.querySelector('#pkb');
    let rows=[], sel=0;

    const draw=()=>{
      const t=q.value.trim();
      const hit=projects.filter(p=>pjMatch(p,t));
      const rec=t?[]:recentPj().map(id=>projects.find(p=>p.id===id)).filter(Boolean);
      const rest=hit.filter(p=>!rec.some(r=>r.id===p.id)).slice(0,60);
      rows=[{id:'',name:'분류 안 됨',color:'gray'}, ...rec, ...rest];
      let html=`<div class="it ${curId===''?'cur':''}" data-i="0">
        <span class="dot" style="background:#C9D0DA"></span><span class="nm">분류 안 됨</span></div>`;
      let i=1;
      if(rec.length){ html+=`<div class="sec">최근 사용</div>`;
        rec.forEach(p=>{html+=item(p,i++);}); html+=`<div class="sec">전체</div>`; }
      rest.forEach(p=>{html+=item(p,i++);});
      if(!hit.length) html+=`<div class="none">「${esc(t)}」 에 맞는 프로젝트가 없습니다.
        ${canMake?'<br>아래 「새 프로젝트」 로 만드실 수 있습니다.':''}</div>`;
      bd.innerHTML=html; sel=0; mark();
      bd.querySelectorAll('.it').forEach(el=>el.onclick=()=>done(rows[+el.dataset.i]));
    };
    const item=(p,i)=>`<div class="it ${p.id===curId?'cur':''}" data-i="${i}">
      <span class="dot c-${p.color||'blue'}"></span><span class="nm">${esc(p.name)}</span>
      ${p.meeting_count!=null?`<span class="cnt">${p.meeting_count}건</span>`:''}</div>`;
    const mark=()=>bd.querySelectorAll('.it').forEach((el,i)=>el.classList.toggle('on',i===sel));
    const done=p=>{ close(); pushRecent(p.id); resolve(p.id); };
    const close=()=>{ mask.remove(); document.removeEventListener('keydown', key); };
    const key=e=>{
      if(e.key==='Escape'){ close(); resolve(undefined); }
      else if(e.key==='ArrowDown'){ e.preventDefault(); sel=Math.min(sel+1,rows.length-1); mark();
        bd.querySelectorAll('.it')[sel]?.scrollIntoView({block:'nearest'}); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); sel=Math.max(sel-1,0); mark();
        bd.querySelectorAll('.it')[sel]?.scrollIntoView({block:'nearest'}); }
      else if(e.key==='Enter'){ e.preventDefault(); if(rows[sel]) done(rows[sel]); }
    };
    q.oninput=draw;
    document.addEventListener('keydown', key);
    mask.onclick=e=>{ if(e.target===mask){ close(); resolve(undefined); } };
    mask.querySelector('#pkc').onclick=()=>{ close(); resolve(undefined); };
    const nb=mask.querySelector('#pknew');
    if(nb) nb.onclick=async()=>{
      const name=(q.value.trim()||prompt('새 프로젝트 이름')||'').trim();
      if(!name) return;
      const {data,error}=await SB.from('hd_project').insert({
        name, company:me.company||'', dept:me.dept||'',
        created_by:me.id, created_name:me.name}).select().single();
      if(error) return toast('만들지 못했습니다: '+esc(error.message));
      toast(`<b>${esc(name)}</b> 만들었습니다`);
      done(data);
    };
    draw(); q.focus();
  });
}

// ─────────────────────────── 프로젝트
const COLORS=['blue','green','orange','purple','red','teal'];
// 슈퍼홀릭 그룹사 — 프로젝트 소속 선택지
const GROUP_COMPANIES=['더올마이티','라피스인터내셔널','슈퍼홀릭','슈퍼홀릭인베스트먼트','루트82'];
// ─────────────────────────── 프로젝트 (팀 폴더식)
// 회사 폴더 → 부서 폴더 → 프로젝트 폴더 순으로 열고 들어갑니다.
//   회사를 누르면   그 회사 회의 전체
//   부서를 누르면   그 부서 회의 전체
//   프로젝트를 누르면 그 프로젝트 회의만
// 보이는 범위는 서버(RLS)가 정합니다. 부서 관리자·부서원에게는
// 본인 회사·부서 것만 내려오므로, 남의 회사 폴더는 애초에 생기지 않습니다.
let PJNAV = {co:'', dept:'', pid:''};
const PJ_NOCO = '⚠ 소속 없음';
const PJ_NODEPT = '회사 공용';
const FOLDER_ICO = '<svg class="fi" width="17" height="17" viewBox="0 0 24 24" fill="none" '
  + 'stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">'
  + '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';

async function renderProjects(){
  const el=$('#p-projects'); el.innerHTML='<div class="sub">불러오는 중…</div>';
  const [pj,ms]=await Promise.all([
    SB.from('hd_project_board').select('*').eq('archived',false).order('created_at'),
    SB.from('hd_meeting').select('id,title,held_on,project_id,company,dept')
      .neq('status','archived')                       // 보관한 회의는 빼고 봅니다
      .order('held_on',{ascending:false})]);
  if(pj.error) return el.innerHTML=`<div class="empty">${esc(pj.error.message)}</div>`;
  const projects=pj.data||[], meetings=ms.data||[];
  const canMake=['admin','manager'].includes(me.role);

  const pcos=p=>(p.companies&&p.companies.length)?p.companies:(p.company?[p.company]:[PJ_NOCO]);
  const pdp=p=>p.dept||PJ_NODEPT;
  const mco=m=>m.company||PJ_NOCO, mdp=m=>m.dept||PJ_NODEPT;
  const {co,dept,pid}=PJNAV;
  const curPj=projects.find(x=>x.id===pid);
  if(pid && !curPj){ PJNAV.pid=''; return renderProjects(); }

  // ── 지금 위치에서 보여줄 회의
  let list=[];
  if(pid)        list=meetings.filter(m=>m.project_id===pid);
  else if(dept)  list=meetings.filter(m=>mco(m)===co && mdp(m)===dept);
  else if(co)    list=meetings.filter(m=>mco(m)===co);

  // ── 지금 위치에서 보여줄 폴더
  let folders=[];
  if(!co){
    const cos=[...new Set([...meetings.map(mco), ...projects.flatMap(pcos)])].sort();
    folders=cos.map(c=>{
      const mine=meetings.filter(m=>mco(m)===c);
      const nd=new Set(mine.map(mdp)); projects.filter(p=>pcos(p).includes(c)).forEach(p=>nd.add(pdp(p)));
      return {kind:'co', key:c, name:c, n:mine.length, sub:`부서 ${nd.size}개`};
    });
  }else if(!dept){
    const dps=new Set(meetings.filter(m=>mco(m)===co).map(mdp));
    projects.filter(p=>pcos(p).includes(co)).forEach(p=>dps.add(pdp(p)));
    folders=[...dps].sort().map(d=>({kind:'dept', key:d, name:d,
      n:meetings.filter(m=>mco(m)===co && mdp(m)===d).length,
      sub:`프로젝트 ${projects.filter(p=>pcos(p).includes(co)&&pdp(p)===d).length}개`}));
  }else if(!pid){
    folders=projects.filter(p=>pcos(p).includes(co)&&pdp(p)===dept).map(p=>({
      kind:'pj', key:p.id, name:p.name, color:p.color||'blue', p,
      n:meetings.filter(m=>m.project_id===p.id).length,
      sub:p.description||(p.last_held_on?'최근 '+p.last_held_on:'')}));
    const un=list.filter(m=>!m.project_id).length;
    folders.push({kind:'none', key:'', name:'분류 안 됨', n:un,
      sub:un?'눌러서 프로젝트로 옮기세요':''});
  }

  const crumbs=[['root','전체']];
  if(co)   crumbs.push(['co', co]);
  if(dept) crumbs.push(['dept', dept]);
  if(pid)  crumbs.push(['pj', curPj?curPj.name:'프로젝트']);

  el.innerHTML=`<h1>프로젝트</h1>
    <div class="sub">회사 → 부서 → 프로젝트 순으로 폴더를 열어보세요.

      (i?'<span class="sep">›</span>':'')+
      (i===crumbs.length-1?`<b>${esc(c[1])}</b>`

      const isPj=f.kind==='pj';
      return `<div class="pjc ${isPj?'':'fld'}" data-kind="${f.kind}" data-key="${esc(String(f.key))}">
        ${isPj?`<div class="pjbar c-${f.color}"></div>`
              :`<div class="fico ${f.kind==='none'?'gray':''}">${FOLDER_ICO}</div>`}
        <div class="n">${esc(f.name)}
          ${isPj&&canMake?`<span style="float:right;white-space:nowrap">
            <button class="pjop" data-ed="${f.key}" title="이름·설명 수정">✎</button>
            <button class="pjop" data-del="${f.key}" title="삭제">×</button></span>`:''}</div>
        <div class="d">회의 ${f.n}건${f.sub?' · '+esc(f.sub):''}</div></div>`;
    }).join('')}</div>`:''}

    ${canMake&&co?`<div class="box" style="margin-top:16px">
      <h1 style="font-size:16px;margin-bottom:12px">여기에 프로젝트 만들기</h1>
      <div class="row">
        <input id="pj-name" placeholder="프로젝트 이름 (예: 에스토니아 법인 설립)" style="flex:2;min-width:220px">
        <input id="pj-desc" placeholder="한 줄 설명 (선택)" style="flex:2;min-width:180px">
        <select id="pj-color" style="min-width:110px">
          ${COLORS.map(c=>`<option value="${c}">${({blue:'파랑',green:'초록',orange:'주황',purple:'보라',red:'빨강',teal:'청록'})[c]}</option>`).join('')}
        </select>
        <button class="btn p" id="pj-add">만들기</button>
      </div>
      <div class="row" style="margin-top:10px;flex-wrap:wrap;gap:6px 14px">
        <span style="font-size:13px;color:#8A93A1">함께하는 회사</span>
        ${GROUP_COMPANIES.map(c=>`<label style="display:flex;align-items:center;gap:5px;font-size:13.5px">
          <input type="checkbox" class="pj-cos" value="${c}"
            ${c===co?'checked':''}
            ${c===co&&me.role!=='admin'?'disabled':''}> ${c}</label>`).join('')}
      </div>
      ${me.role==='admin'?`<div class="row" style="margin-top:8px">
        <input id="pj-dp" placeholder="부서 (비우면 회사 전체 공개)"
          value="${esc(dept===PJ_NODEPT?'':(dept||''))}" style="flex:1;min-width:140px;max-width:260px">
      </div>`:''}
      <div class="sub" style="margin:8px 0 0">체크한 회사의 구성원에게 보입니다. 여러 회사가 함께하면 모두 체크하세요</div>
    </div>`:''}

    <div id="pjlist" style="margin-top:22px"></div>`;

  // ── 폴더 열기
  el.querySelectorAll('.pjc').forEach(c=>c.onclick=e=>{
    if(e.target.closest('.pjop')) return;

    else if(k==='dept') PJNAV={co, dept:v, pid:''};
    else if(k==='pj')   PJNAV={co, dept, pid:v};
    else if(k==='none'){ PJNAV={co, dept, pid:''}; renderProjects(); 
      return setTimeout(()=>{const b=$('#pjlist'); if(b) b.scrollIntoView({behavior:'smooth'});},60); }
    renderProjects();
  });

  el.querySelectorAll('[data-crumb]').forEach(a=>a.onclick=()=>{
    const to=a.dataset.crumb;
    if(to==='root')      PJNAV={co:'', dept:'', pid:''};
    else if(to==='co')   PJNAV={co, dept:'', pid:''};
    else if(to==='dept') PJNAV={co, dept, pid:''};

  });

  // ── 만들기
  const add=$('#pj-add');

    const name=$('#pj-name').value.trim();
    if(!name) return toast('이름을 입력해주세요');
    let cos=[...el.querySelectorAll('.pj-cos:checked')].map(x=>x.value);
    if(me.role!=='admin' && me.company && !cos.includes(me.company)) cos.unshift(me.company);
    if(!cos.length) return toast('함께하는 회사를 하나 이상 체크해주세요.');

      : (me.dept||'');

  el.querySelectorAll('[data-ed]').forEach(b=>b.onclick=async()=>{
    const p=projects.find(x=>x.id===b.dataset.ed); if(!p) return;

    const cos=cotxt.split(',').map(x=>x.trim()).filter(Boolean);
    if(!cos.length) return toast('회사는 하나 이상 있어야 합니다.');
    const bad=cos.filter(c=>!GROUP_COMPANIES.includes(c));

  });

  // ── 삭제 — 회의는 지워지지 않고 「분류 안 됨」으로 돌아갑니다
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    const p=projects.find(x=>x.id===b.dataset.del); if(!p) return;
    if(!confirm(`「${p.name}」 프로젝트를 삭제합니다.\n\n묶여 있던 회의 ${p.meeting_count}건은 지워지지 않고\n「분류 안 됨」으로 돌아갑니다.`)) return;

  drawPjList(list, projects, meetings, here, !!co);

// 지금 위치의 회의 목록 — 체크해서 한꺼번에 프로젝트로 옮길 수 있습니다
function drawPjList(list, projects, meetings, here, opened){
  const box=$('#pjlist'); if(!box) return;
  if(!opened){
    box.innerHTML='<div class="empty">위에서 회사 폴더를 눌러 들어가세요.</div>';
    return;
  }
  const pjName=id=>{const p=projects.find(x=>x.id===id); return p?p.name:'분류 안 됨';};

  box.innerHTML=`<h1 style="font-size:18px">${esc(here)} · 회의 ${list.length}건</h1>
    <div class="sub">오른쪽 이름을 누르면 그 회의를 다른 프로젝트로 옮깁니다
      ${['admin','manager'].includes(me.role)?'':'<br>참석하신 회의만 옮기실 수 있습니다'}</div>
    ${list.length?`<div class="box" style="padding:14px 16px;margin-bottom:12px">
      <div class="row">
        <label style="display:flex;align-items:center;gap:8px;font-size:14px">
          <input type="checkbox" id="pj-all" style="width:19px;height:19px"> 전체 선택</label>
        <button class="btn p" id="pj-move">선택한 회의 옮기기…</button>
      </div></div>`:''}
    ${list.length?list.map(m=>`<div class="card" data-id="${m.id}" style="display:flex;
        align-items:center;gap:12px;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:11px;min-width:0;flex:1">
          <input type="checkbox" class="pjchk" data-id="${m.id}" style="width:19px;height:19px;flex:none">
          <div style="min-width:0">
            <div class="ct">${esc(m.title)}</div>
            <div class="cm"><span>${m.held_on}</span>
              <span>${esc(m.company||'')}${m.dept?' '+esc(m.dept):''}</span></div></div>
        </div>
        <button class="pjbtn pjone ${m.project_id?'':'none'}"
          data-id="${m.id}" data-cur="${m.project_id||''}">${esc(pjName(m.project_id||''))}</button>
      </div>`).join('')
      :'<div class="empty">여기에 해당하는 회의가 없습니다.</div>'}`;

  box.querySelectorAll('.card').forEach(c=>c.onclick=e=>{
    if(e.target.closest('button') || e.target.closest('input')) return;
    openMeeting(c.dataset.id);});

  const move=async(ids, to)=>{
    if(!ids.length) return toast('옮길 회의를 골라주세요');
    const {data,error}=await SB.from('hd_meeting')
      .update({project_id:to||null}).in('id',ids).select('id');
    if(error) return toast('옮기지 못했습니다: '+esc(error.message));
    const moved=(data||[]).length;
    const name=to?(projects.find(x=>x.id===to)||{}).name:'분류 안 됨';
    if(moved===0)
      return toast('옮기지 못했습니다.<br>참석하신 회의만 옮기실 수 있습니다.', 5000);
    if(moved<ids.length) toast(`${moved}건만 옮겼습니다. 나머지는 참석하지 않으신 회의입니다.`, 5000);
    else toast(`${moved}건을 <b>${esc(name)}</b> 으로 옮겼습니다`);
    renderProjects();
  };

  box.querySelectorAll('.pjone').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    const to=await pickProject(projects, b.dataset.cur, '어느 프로젝트로 옮길까요?');
    if(to===undefined) return;
    move([b.dataset.id], to);
  });
  const all=$('#pj-all');
  if(all) all.onchange=()=>box.querySelectorAll('.pjchk').forEach(c=>c.checked=all.checked);
  const mv=$('#pj-move');
  if(mv) mv.onclick=async()=>{
    const ids=[...box.querySelectorAll('.pjchk')].filter(c=>c.checked).map(c=>c.dataset.id);
    if(!ids.length) return toast('옮길 회의를 골라주세요');
    const to=await pickProject(projects, PJNAV.pid, `${ids.length}건을 어디로 옮길까요?`);
    if(to===undefined) return;
    move(ids, to);
  };
}

// ─────────────────────────── 업로드
const AUDIO_EXT = ['m4a','mp3','wav','caf','mp4','aac','ogg','flac','wma','webm'];
const DOC_EXT = ['docx','txt','md','pdf','pptx','hwpx'];

// ─────────────────────────── 웹에서 바로 녹음
// 브라우저 마이크를 씁니다. 이미 마이크를 쓰는 브라우저라면
// 따로 설치할 것도, 권한을 새로 받을 것도 없습니다.
let REC = {mr:null, chunks:[], t0:0, timer:null, stream:null, lock:null};

async function keepAwake(on){
  // 녹음 중에는 화면이 꺼지지 않게 잡아둡니다.
  // 폰은 화면이 꺼지면 녹음이 멈추는 경우가 있습니다.
  try{
    if(on){
      if('wakeLock' in navigator && !REC.lock)
        REC.lock = await navigator.wakeLock.request('screen');
    }else if(REC.lock){
      await REC.lock.release(); REC.lock=null;
    }
  }catch(e){ REC.lock=null; }
}

// 화면을 잠깐 봤다가 돌아오면 잠금이 풀려 있으므로 다시 겁니다
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && REC.mr && REC.mr.state==='recording')
    keepAwake(true);
});

function recFmt(s){
  const m=Math.floor(s/60), x=s%60;
  return (m<60? `${m}:${String(x).padStart(2,'0')}`
              : `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}:${String(x).padStart(2,'0')}`);
}

async function renderRec(){
  const el=$('#p-rec');
  const on = !!(REC.mr && REC.mr.state==='recording');
  el.innerHTML=`<h1>녹음</h1>
    <div class="sub">이 기기의 마이크로 회의를 녹음합니다.
      끝내면 자동으로 올라가고, 전사·요약·하이라이트가 만들어집니다</div>
    <div class="box">
      <div class="row" style="margin-bottom:9px">
        <input id="rc-title" placeholder="회의명" style="flex:2;min-width:220px" ${on?'disabled':''}>
        <input id="rc-parts" placeholder="참석자 (쉼표로 구분 · 선택)" style="flex:2;min-width:180px" ${on?'disabled':''}>

        <select id="rc-type" style="min-width:230px" ${on?'disabled':''}>

        </select>
        <button class="btn" id="rc-share-btn" style="display:none" ${on?'disabled':''}>공유 대상 선택 (<span id="rc-share-n">0</span>명)</button>
      </div>
      <div class="box" id="rc-share-box" style="display:none;margin-bottom:9px;max-height:220px;overflow:auto">
        <div class="sub" style="margin:0 0 8px">체크한 사람도 이 녹음을 볼 수 있습니다</div>
        <div id="rc-share-list" class="row" style="flex-wrap:wrap;gap:6px 16px">불러오는 중…</div>
      </div>
      ${me.role==='admin'?`<div class="row" style="margin-bottom:9px" id="rc-scope-row">
        <select id="rc-scope" style="min-width:230px" ${on?'disabled':''}>
          <option value="mine">내 소속 (${esc(me.company||'')} ${esc(me.dept||'')})</option>
          <option value="exec">그룹 · 전사 경영진 — 관리자·경영진만 열람</option>
        </select>
        <span class="sub" style="margin:0">민감한 회의는 「전사 경영진」으로 — 일반 직원에게 보이지 않습니다</span>
      </div>`:''}
      <div class="row" style="align-items:center">
        <button class="btn p" id="rc-go" style="min-width:150px">${on?'■ 녹음 종료':'● 회의 녹음 시작'}</button>
        <span id="rc-time" style="font-size:22px;font-weight:700;letter-spacing:1px">0:00</span>
        <span id="rc-lv" class="sub" style="margin:0"></span>
      </div>
      <div class="sub" style="margin:12px 0 0">
        녹음 중에는 화면이 꺼지지 않게 잡아둡니다. 다른 탭으로 옮겨도 계속 녹음됩니다.<br>
        폰으로 녹음하실 때는 <b>다른 앱으로 나가지 마세요</b> (녹음이 멈출 수 있습니다).<br>
        <span style="color:#B36B00">브라우저가 마이크 사용을 물어보면 「허용」 을 눌러주세요.</span>
      </div>
    </div>
    <h1 style="font-size:16px;margin-top:24px">최근 올린 것</h1>
    <div id="up-list" class="box" style="color:#98A0AC">불러오는 중…</div>`;
  $('#rc-go').onclick = on ? recStop : recStart;
  const ty=$('#rc-type'), shb=$('#rc-share-btn'), box=$('#rc-share-box');
  ty.onchange=()=>{
    const p=ty.value!=='meeting';
    shb.style.display=p?'':'none';
    if(!p) box.style.display='none';
    const sr=$('#rc-scope-row'); if(sr) sr.style.display=p?'none':'';
  };
  shb.onclick=async()=>{
    if(box.style.display==='none'){
      box.style.display='';
      const list=$('#rc-share-list');
      if(!list.dataset.loaded){
        const {data}=await SB.from('hd_member').select('id,name,company,dept')
          .eq('approved',true).neq('id',me.id).order('name');
        list.innerHTML=(data||[]).map(m=>`<label style="display:flex;align-items:center;gap:5px;font-size:13.5px">
          <input type="checkbox" class="rc-share" value="${m.id}"> ${esc(m.name)}
          <span class="sub" style="margin:0;font-size:11.5px">${esc(m.company||'')}</span></label>`).join('')
          || '구성원이 없습니다';
        list.dataset.loaded='1';
      }
    } else box.style.display='none';
  };
  document.addEventListener('change', e=>{
    if(e.target.classList&&e.target.classList.contains('rc-share')){
      const n=document.querySelectorAll('.rc-share:checked').length;
      const el2=$('#rc-share-n'); if(el2) el2.textContent=n;
    }
  });
  if(on) recTick();
  loadUploads();
}

function recTick(){
  const t=$('#rc-time'); if(!t) return;
  t.textContent = recFmt(Math.floor((Date.now()-REC.t0)/1000));
}

async function recStart(){
  const t0=($('#rc-type')||{value:'meeting'}).value;
  if(t0!=='meeting' && !($('#rc-title').value||'').trim()){
    $('#rc-title').value = new Date().toISOString().slice(2,10).replace(/-/g,'')
      + (t0==='idea' ? ' 아이디어 노트' : ' 지시사항');
  }
  if(!(me.company||'').trim())
    return toast('계정에 소속(회사)이 등록되어 있지 않습니다.<br>관리자에게 소속 등록을 요청해주세요.', 7000);
  const title=($('#rc-title').value||'').trim()
    || new Date().toISOString().slice(2,10).replace(/-/g,'')+' 회의';
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
  }catch(e){
    return toast('마이크를 쓸 수 없습니다.<br>브라우저 주소창 왼쪽의 자물쇠를 눌러 마이크를 허용해주세요.', 7000);
  }
  // 브라우저마다 되는 형식이 다릅니다. 되는 것을 골라 씁니다.
  let mime='';
  for(const m of ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg']){
    if(window.MediaRecorder && MediaRecorder.isTypeSupported(m)){ mime=m; break; }
  }
  REC.chunks=[]; REC.stream=stream; REC.title=title;
  REC.parts=($('#rc-parts').value||'').trim();
  REC.scope=($('#rc-scope')||{value:'mine'}).value;
  REC.type=($('#rc-type')||{value:'meeting'}).value;
  REC.shares=[...document.querySelectorAll('.rc-share:checked')].map(x=>x.value);
  REC.mr = mime? new MediaRecorder(stream,{mimeType:mime, audioBitsPerSecond:64000})
                : new MediaRecorder(stream);
  REC.mr.ondataavailable = e=>{ if(e.data && e.data.size) REC.chunks.push(e.data); };
  REC.mr.onstop = recDone;
  REC.mr.start(5000);            // 5초마다 조각으로 모읍니다 (길게 녹음해도 안전)
  keepAwake(true);               // 화면이 꺼지지 않게 잡아둡니다
  REC.t0 = Date.now();
  REC.timer = setInterval(recTick, 1000);
  recWatchLevel(stream);
  renderRec();
  toast('녹음을 시작했습니다: <b>'+esc(title)+'</b>');
}

function recWatchLevel(stream){
  // 소리가 안 들어오면 알려줍니다 (권한은 있는데 마이크가 꺼진 경우)
  try{
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const an=ac.createAnalyser(); an.fftSize=512;
    ac.createMediaStreamSource(stream).connect(an);
    const buf=new Uint8Array(an.fftSize); let peak=0, n=0;
    const iv=setInterval(()=>{
      if(!REC.mr || REC.mr.state!=='recording'){ clearInterval(iv); ac.close(); return; }
      an.getByteTimeDomainData(buf);
      let m=0; for(const v of buf) m=Math.max(m, Math.abs(v-128));
      peak=Math.max(peak,m); n++;
      const lv=$('#rc-lv');
      if(lv) lv.textContent = m>2? '● 소리 들어오는 중' : '';
      if(n===12 && peak<=2)
        toast('소리가 들어오지 않습니다.<br>마이크가 켜져 있는지 확인해주세요.', 7000);
    }, 1000);
  }catch(e){}
}

function recStop(){
  if(!REC.mr || REC.mr.state!=='recording') return;
  clearInterval(REC.timer); REC.timer=null;
  keepAwake(false);
  REC.dur = Math.floor((Date.now()-REC.t0)/1000);
  REC.mr.stop();
  (REC.stream.getTracks()||[]).forEach(t=>t.stop());
  toast('올리는 중입니다…');
}

async function recDone(){
  const type = REC.mr.mimeType || 'audio/webm';
  const ext = type.includes('mp4')? 'mp4' : type.includes('ogg')? 'ogg' : 'webm';
  const blob = new Blob(REC.chunks, {type});
  REC.mr=null; REC.chunks=[];
  if(blob.size < 4000){ renderRec(); return toast('녹음이 비어 있습니다.', 6000); }
  try{
    const name=`jobs/${Date.now()}_web.${ext}`;   // 이름은 영문·숫자만 (한글 불가)
    const {error:e1}=await SB.storage.from('hd-audio').upload(name, blob, {upsert:true, contentType:type});
    if(e1) throw e1;
    const priv = REC.type && REC.type!=='meeting';
    const sc=(me.role==='admin' && !priv && REC.scope==='exec')
      ? {company:'그룹', dept:'전사 경영진'} : {company:me.company||'', dept:me.dept||''};
    const extra = priv ? {visibility:'private',
      note_label: REC.type==='idea' ? '아이디어 노트' : '지시사항',
      share_ids: REC.shares||[]} : {};
    const {error:e2}=await SB.from('hd_job').insert({
      title:REC.title, participants:REC.parts||'',
      audio_path:name, kind:'audio', orig_name:`${REC.title}.${ext}`,
      device:'웹 녹음', created_by:me.id, created_name:me.name, ...sc, ...extra});
    if(e2) throw e2;
    toast(`<b>${esc(REC.title)}</b> (${recFmt(REC.dur||0)}) 올렸습니다.<br>처리가 끝나면 회의 목록에 나타납니다.`);
  }catch(e){
    toast('올리지 못했습니다: '+esc(e.message||e), 8000);
  }
  renderRec();
}

async function loadUploads(){
  const box=$('#up-list'); if(!box) return;
  const {data,error}=await SB.from('hd_job').select('id,title,orig_name,status,error,created_at,kind')
    .order('created_at',{ascending:false}).limit(10);
  if(error){ box.textContent=error.message; return; }
  const L={queued:'대기 중',working:'처리 중',done:'완료',failed:'실패'};
  const C={queued:'t-review',working:'t-review',done:'t-reported',failed:'t-draft'};
  box.innerHTML=(data&&data.length)? data.map(j=>`
    <div class="act" style="grid-template-columns:1fr auto">
      <div><div class="task">${esc(j.title||j.orig_name||'?')}</div>
        <div class="meta">${j.created_at.slice(0,16).replace('T',' ')}
          ${j.kind==='doc'?' · 문서':''}${j.status==='failed'?' · '+esc((j.error||'').slice(0,90)):''}</div></div>
      <div class="row" style="gap:6px;align-items:center">
        ${j.status==='failed'?`<button class="btn" data-retry="${j.id}">다시 시도</button>`:''}
        <span class="tag ${C[j.status]}">${L[j.status]}</span></div>
    </div>`).join('')
    : '아직 올린 것이 없습니다.';
  box.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>retryJob(b.dataset.retry, b));
  if((data||[]).some(j=>j.status==='queued'||j.status==='working'))
    setTimeout(loadUploads, 5000);
}

async function retryJob(id, btn){
  // 실패한 파일을 버리지 않고 다시 줄 세웁니다. 올린 음성·문서는 그대로 남아 있습니다.
  btn.disabled=true; btn.textContent='다시 넣는 중…';
  const {error}=await SB.rpc('hd_retry',{jid:id});
  if(error){ btn.disabled=false; btn.textContent='다시 시도';
    return toast('다시 시도하지 못했습니다: '+esc(error.message), 6000); }
  toast('다시 줄 세웠습니다. 처리 서버가 곧 가져갑니다.');
  loadUploads();
}

async function doUpload(){
  if(!(me.company||'').trim())
    return toast('계정에 소속(회사)이 등록되어 있지 않습니다.<br>관리자에게 소속 등록을 요청해주세요.', 7000);
  const f=$('#up-file').files[0];
  if(!f) return toast('파일을 골라주세요');
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  if(ext==='hwp')
    return toast('옛 한글(.hwp)은 읽지 못합니다.<br>한글에서 「hwpx」 로 저장해 올려주세요.', 6000);
  const isAudio=AUDIO_EXT.includes(ext);
  if(!isAudio && !DOC_EXT.includes(ext))
    return toast('지원하지 않는 형식입니다: .'+esc(ext), 5000);
  if(f.size > 900*1024*1024) return toast('900MB 를 넘는 파일은 올릴 수 없습니다');

  const btn=$('#up-go'); btn.disabled=true; btn.textContent='올리는 중…';
  try{
    // 저장소 파일 이름에는 영문·숫자만 쓸 수 있습니다.
    // 원래 이름(한글 포함)은 orig_name 에 그대로 남겨둡니다.
    // 확장자는 반드시 붙입니다 — 처리 서버가 형식을 그걸로 알아봅니다.
    const base=f.name.replace(/\.[^.]+$/,'').replace(/[^0-9A-Za-z_-]/g,'').slice(0,40);
    const name=`jobs/${Date.now()}_${base||'file'}.${ext}`;
    const {error:e1}=await SB.storage.from('hd-audio').upload(name, f, {upsert:true});
    if(e1) throw e1;
    const title=$('#up-title').value.trim()
      || f.name.replace(/\.[^.]+$/,'');
    const usc=(me.role==='admin' && ($('#up-scope')||{value:'mine'}).value==='exec')
      ? {company:'그룹', dept:'전사 경영진'} : {company:me.company||'', dept:me.dept||''};
    const {error:e2}=await SB.from('hd_job').insert({
      title, participants:$('#up-parts').value.trim(),
      audio_path:name, kind:isAudio?'audio':'doc', orig_name:f.name,
      device:'웹 업로드', created_by:me.id, created_name:me.name, ...usc});
    if(e2) throw e2;
    toast(`<b>${esc(title)}</b> 올렸습니다.<br>처리가 끝나면 회의 목록에 나타납니다.`);
    $('#up-file').value=''; $('#up-title').value='';
    loadUploads();
  }catch(e){
    toast('올리지 못했습니다: '+esc(e.message||e), 6000);
  }finally{
    btn.disabled=false; btn.textContent='올리기';
  }
}

    <div class="sub">사무실 컴퓨터에서 도는 전사·회의록 처리기입니다.
      여기서 상태를 보고 조작할 수 있습니다</div>
    <div class="box" id="sv-state">상태 확인 중…</div>
    <div class="box">
      <div class="row" style="flex-wrap:wrap;gap:8px">
        ${CMDS.map(([k,l,d])=>`<button class="btn" data-cmd="${k}" title="${d}">${l}</button>`).join('')}
      </div>
      <div class="sub" style="margin:12px 0 0">
        설정 바꾸기 — 바꾼 뒤에는 「다시 시작」을 눌러야 적용됩니다</div>
      <div class="row" style="margin-top:8px">
        <select id="sv-key" style="min-width:170px">
          <option value="WHISPER_MODEL">전사 모델</option>
          <option value="CLAUDE_MODEL">회의록 모델</option>
          <option value="BRIEF_HOUR">브리핑 시각</option>
          <option value="DIARIZE">화자 분리 (1=켬 · 0=끔)</option>
          <option value="MAIL_TO">알림 받을 메일 주소</option>
          <option value="BACKUP_DAY">백업 요일 (0=월 … 6=일)</option>
        </select>
        <input id="sv-val" placeholder="예: large-v3 · claude-sonnet-5 · 7" style="flex:1;min-width:200px">
        <button class="btn p" id="sv-set">바꾸기</button>
      </div>
    </div>
    <h1 style="font-size:16px;margin-top:22px">결과</h1>
    <div class="box"><pre id="sv-out" style="margin:0;white-space:pre-wrap;
      font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:#3A424F">명령을 눌러주세요.</pre></div>`;

async function loadAgent(){
  const box=$('#sv-state'); if(!box) return;
  const {data,error}=await SB.from('hd_agent').select('*').eq('id','worker').maybeSingle();
  if(error||!data) return box.innerHTML='<span style="color:#B36B00">아직 상태를 받지 못했습니다. '
    +'처리 서버가 최신 버전인지 확인해주세요.</span>';
  const age=(Date.now()-new Date(data.beat_at).getTime())/1000;
  const live=age<180;
  const i=data.info||{};
  box.innerHTML=`<div class="row" style="align-items:center;gap:10px">
      <span class="tag ${live?'t-reported':'t-draft'}">${live?'정상 작동 중':'응답 없음'}</span>
      <b>버전 ${esc(data.version||'?')}</b>
      <span class="sub" style="margin:0">전사 ${esc(i.model||'?')} · 회의록 ${esc(i.claude||'?')}
        · 브리핑 ${esc(String(i.brief_hour||'7'))}시</span>
    </div>
    <div class="sub" style="margin:8px 0 0">마지막 신호 ${Math.round(age)}초 전
      ${live?'':'· 3분 넘게 소식이 없습니다. 사무실 컴퓨터가 꺼져 있을 수 있습니다'}</div>`;
}

async function sendCmd(kind, args, btn){
  const out=$('#sv-out');
  const old=btn?btn.textContent:'';
  if(btn){ btn.disabled=true; btn.textContent='보내는 중…'; }
  out.textContent='처리 서버에 명령을 보냈습니다. 기다리는 중…';
  const {data,error}=await SB.from('hd_cmd').insert({
    kind, args, asked_by:me.id, asked_name:me.name}).select('id').single();
  if(error){ if(btn){btn.disabled=false;btn.textContent=old;}
    return out.textContent='보내지 못했습니다: '+error.message; }

  // 결과가 적힐 때까지 기다립니다 (최대 3분)
  for(let i=0;i<90;i++){
    await new Promise(r=>setTimeout(r,2000));
    const {data:d}=await SB.from('hd_cmd').select('status,result').eq('id',data.id).maybeSingle();
    if(!d) continue;
    if(d.status==='done'||d.status==='failed'){
      out.textContent=(d.status==='failed'?'실패: ':'')+(d.result||'(내용 없음)');
      if(btn){ btn.disabled=false; btn.textContent=old; }
      loadAgent();
      return;
    }
  }
  out.textContent='응답이 없습니다. 처리 서버가 꺼져 있거나 처리 중일 수 있습니다.';
  if(btn){ btn.disabled=false; btn.textContent=old; }
}

// ─────────────────────────── 워드로 내보내기
// 하이라이트·전사·요약·액션아이템을 한 파일에 담아 내려받습니다.
// 워드가 읽을 수 있는 HTML 형식(.doc)이라 워드·한글에서 바로 열립니다.
function exportDoc(){
  if(!cur) return;
  const {m,segs,hls,acts,att}=cur;
  const S=`body{font-family:'맑은 고딕',sans-serif;font-size:10.5pt;line-height:1.7;color:#1B1F26}
    h1{font-size:18pt;margin:0 0 6pt} h2{font-size:13pt;color:#0B65D8;border-bottom:1.5pt solid #0B65D8;
    padding-bottom:3pt;margin:18pt 0 8pt} table{border-collapse:collapse;width:100%;font-size:9.5pt}
    td,th{border:1pt solid #C9D1DC;padding:4pt 7pt;vertical-align:top} th{background:#EEF2F7}
    .ts{color:#8A93A1;font-size:8.5pt} .spk{font-weight:bold;color:#0B65D8}
    .hl{margin:0 0 10pt} .hl h3{font-size:11pt;margin:0 0 3pt} .hl ul{margin:2pt 0 0 14pt}
    .meta{color:#5A6472;font-size:9.5pt;margin-bottom:14pt}`;
  const esc2=t=>String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let h='<h1>'+esc2(m.title)+'</h1>';
  h+='<div class="meta">'+m.held_on+' · '+hms(m.duration_sec)
    +(att.length?' · 참석: '+esc2(att.join(', ')):'')
    +(m.source?' · '+esc2(m.source)+' 사용 회의':'')
    +'<br>HEIMDALL 자동 생성 · 내보낸 날짜 '+new Date().toISOString().slice(0,10)+'</div>';

  h+='<h2>하이라이트</h2>';
  h+=hls.length? hls.map(x=>'<div class="hl"><div class="ts">'+hms(x.start_sec)+'</div><h3>'
      +esc2(x.headline)+'</h3>'
      +((x.points||[]).length?'<ul>'+x.points.map(p=>'<li>'+esc2(p)+'</li>').join('')+'</ul>':'')
      +'</div>').join('') : '<p>하이라이트가 없습니다.</p>';

  h+='<h2>요약</h2>'+mdHtml(m.summary_md||'(요약 없음)');

  h+='<h2>액션아이템</h2>';
  h+=acts.length? '<table><tr><th>할 일</th><th>담당</th><th>기한</th><th>상태</th></tr>'
      +acts.map(a=>'<tr><td>'+esc2(a.task)+'</td><td>'+esc2(a.owner_name||'미정')
      +'</td><td>'+esc2(a.due||'')+'</td><td>'+(a.state==='done'?'완료':'진행')+'</td></tr>').join('')
      +'</table>' : '<p>액션아이템이 없습니다.</p>';

  h+='<h2>전사 전문</h2>';
  h+=segs.map(sg=>'<p><span class="ts">['+hms(sg.start_sec)+']</span> '
      +(sg.speaker?'<span class="spk">'+esc2(sg.speaker)+'</span> · ':'')
      +esc2(sg.text)+'</p>').join('');

  const doc='<html xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8">'
      +'<title>'+esc2(m.title)+'</title><style>'+S+'</style></head><body>'+h+'</body></html>';
  const blob=new Blob(['\ufeff', doc], {type:'application/msword'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(m.held_on||'')+'_'+(m.title||'회의').replace(/[\\/:*?"<>|]/g,'_')+'.doc';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast('워드 파일로 내려받았습니다.<br>워드·한글에서 바로 열립니다.');
}

// ─────────────────────────── 마인드맵
// 회의록의 계층 구조를 가지 그림으로 그립니다 (markmap 사용).
let MM_LOADED=false, MM_DRAWN=null;
function loadScript(u){return new Promise((ok,no)=>{
  const t=document.createElement('script'); t.src=u; t.onload=ok; t.onerror=no;
  document.head.appendChild(t);});}

async function drawMindmap(m){
  const md=(m.mindmap_md||'').trim();
  const svg=document.getElementById('mmv');
  if(!md || !svg) return;
  if(MM_DRAWN===m.id && svg.childElementCount) return;   // 이미 그려져 있으면 그대로
  try{
    if(!MM_LOADED){
      await loadScript('https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js');
      await loadScript('https://cdn.jsdelivr.net/npm/markmap-lib@0.18.12/dist/browser/index.js');
      await loadScript('https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.js');
      MM_LOADED=true;
    }
    const {Transformer}=window.markmap, {Markmap}=window.markmap;
    const {root}=new Transformer().transform(md);
    svg.innerHTML='';
    Markmap.create(svg,{autoFit:true, initialExpandLevel:3, duration:300}, root);
    MM_DRAWN=m.id;
  }catch(e){
    // 인터넷 차단 등으로 그림을 못 그리면 목록으로라도 보여줍니다
    const pane=document.getElementById('mmpane');
    if(pane) pane.innerHTML='<div class="md">'+mdHtml(md)+'</div>';
    MM_DRAWN=m.id;
  }
}

// ─────────────────────────── 마크다운
function mdHtml(md){
  const out=[]; let tbl=false, list=false;
  const closeL=()=>{if(list){out.push('</ul>');list=false;}};
  for(const raw of (md||'').split('\n')){
    const s=raw.trimEnd();
    if(s.startsWith('|')){
      closeL();
      const c=s.replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
      if([...c.join('')].every(ch=>'-: '.includes(ch))) continue;
      if(!tbl){out.push('<table>','<tr>'+c.map(x=>`<th>${esc(x)}</th>`).join('')+'</tr>');tbl=true;}
      else out.push('<tr>'+c.map(x=>`<td>${esc(x)}</td>`).join('')+'</tr>');
      continue;}
    if(tbl){out.push('</table>');tbl=false;}
    if(s.startsWith('### ')){closeL();out.push(`<h3>${esc(s.slice(4))}</h3>`);}
    else if(s.startsWith('## ')){closeL();out.push(`<h2>${esc(s.slice(3))}</h2>`);}
    else if(s.startsWith('# ')){closeL();out.push(`<h1>${esc(s.slice(2))}</h1>`);}
    else if(/^\s*[-*] /.test(s)){if(!list){out.push('<ul>');list=true;}out.push(`<li>${esc(s.trim().slice(2))}</li>`);}
    else if(/^\s*\d+\. /.test(s)){if(!list){out.push('<ul>');list=true;}out.push(`<li>${esc(s.replace(/^\s*\d+\. /,''))}</li>`);}
    else if(s){closeL();out.push(`<p>${esc(s)}</p>`);}
  }
  closeL(); if(tbl) out.push('</table>');
  return out.join('\n').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}

// ─────────────────────────── 앱 설치 · 업데이트
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e; wireInstall();
});
function wireInstall(){
  const b = $('#inst'); if(!b) return;
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if(standalone) return;                       // 이미 앱으로 열려 있습니다
  b.style.display='';
  b.onclick = async () => {
    if(deferredPrompt){                        // 크롬·엣지 — 바로 설치
      b.disabled = true;
      deferredPrompt.prompt();
      const {outcome} = await deferredPrompt.userChoice;
      deferredPrompt = null; b.disabled = false;
      if(outcome==='accepted'){ b.style.display='none';
        toast('설치했습니다. 바탕화면·독의 <b>HEIMDALL</b> 아이콘으로 바로 여실 수 있습니다.', 7000); }
      return;
    }
    // 사파리 등 — 브라우저마다 방법이 달라 안내만 합니다
    const ua = navigator.userAgent;
    const msg = /iPhone|iPad/.test(ua)
      ? '사파리 아래쪽 <b>공유</b> 버튼 → <b>홈 화면에 추가</b>'
      : /Android/.test(ua)
      ? '크롬 오른쪽 위 <b>⋮</b> → <b>홈 화면에 추가</b><br>(또는 「앱 설치」)'
      : /Safari/.test(ua) && !/Chrome/.test(ua)
      ? '사파리 메뉴의 <b>파일 → Dock에 추가</b><br>(또는 크롬으로 열면 설치 버튼이 바로 뜹니다)'
      : '크롬 오른쪽 위 <b>⋮</b> → <b>전송, 저장 및 공유</b> → <b>페이지를 앱으로 설치</b>';
    toast('홈 화면에 앱으로 두려면<br>' + msg, 9000);
  };
}
window.addEventListener('appinstalled', ()=>{ const b=$('#inst'); if(b) b.style.display='none'; });

if('serviceWorker' in navigator){
  addEventListener('load', async () => {
    try{
      const reg = await navigator.serviceWorker.register('./sw.js');
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        w && w.addEventListener('statechange', () => {
          if(w.state==='installed' && navigator.serviceWorker.controller){
            const u=document.createElement('div'); u.className='upd';
            u.textContent='새 버전이 있습니다. 눌러서 새로고침';
            u.onclick=()=>{w.postMessage({type:'SKIP_WAITING'});location.reload();};
            document.body.appendChild(u);
          }
        });
      });
    }catch(e){ /* 로컬 파일로 열면 등록되지 않습니다. 정상입니다. */ }
  });
}

// ─────────────────────────── 시작
async function boot(){
  const {data:{session}} = await SB.auth.getSession();
  if(!session) return loginPage();
  // 자동 로그인을 끄셨으면, 브라우저를 닫았다 연 경우 다시 로그인하게 합니다.
  // (같은 창에서 새로고침한 것은 그대로 유지합니다)
  if(localStorage.getItem('hd_auto')!=='1' && !sessionStorage.getItem('hd_live')){
    await SB.auth.signOut();
    return loginPage('in','자동 로그인이 꺼져 있어 다시 로그인해주세요.');
  }
  sessionStorage.setItem('hd_live','1');
  let {data,error} = await SB.from('hd_member').select('*').eq('id',session.user.id).single();
  if(error||!data){
    // 트리거가 아직 안 돌았거나 실패한 경우 직접 만들어 봅니다
    const meta = session.user.user_metadata||{};
    const ins = await SB.from('hd_member').insert({id:session.user.id, email:session.user.email,
      name:meta.name||'', company:meta.company||'', dept:meta.dept||''}).select().single();
    if(ins.error){
      $('#app').innerHTML=`<div class="login"><h2>등록에 실패했습니다</h2>
        <p>${esc(session.user.email)}<br><br>${esc(ins.error.message)}</p>
        <button class="btn p full" onclick="location.reload()">다시 시도</button></div>`;
      return;}
    data = ins.data;
  }
  if(!data.name || !data.company) return profilePage(data);
  if(!data.approved) return pendingPage(data);
  me=data; shell(); go('list'); checkPending();
}
SB.auth.onAuthStateChange((e)=>{ if(e==='SIGNED_IN'||e==='SIGNED_OUT') boot(); });
boot();
