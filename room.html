<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>HEIMDALL 회의실</title>
<meta name="theme-color" content="#080808">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="./icons/favicon.ico?v=3" sizes="any">
<link rel="manifest" href="./heimdall.webmanifest?v=2">
<!-- 글꼴 — 파일을 저장소에 넣지 않고 CDN 으로만 부릅니다 (라이선스 안전) -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HEIMDALL">
<meta name="application-name" content="HEIMDALL">
<style>
/* ─────────────────────────────────────────────────────────────
   회의실 태블릿 화면 (키오스크)

   설계 기준
   · 서서 2~3걸음 떨어져 보는 화면입니다. 글자를 크게, 위계를 분명하게.
   · 하루 종일 켜져 있습니다. 채도를 낮추고 움직임을 줄였습니다.
   · 화면은 절대 스크롤하지 않습니다. 머리·본문·발 세 칸으로 못 박고,
     넘치는 것은 각 칸 안에서만 스크롤합니다. (잘림 사고 방지)
   · 태블릿은 가로가 넓습니다. 녹음 중에는 좌우 두 단으로 나눕니다.
   ───────────────────────────────────────────────────────────── */
:root{
  --bg:#080808; --s1:#0E0E0E; --s2:#161616; --line:#212121; --line2:#2C2C2C;
  --tx:#F2F2F0; --mut:#B0B0AC; --dim:#848482;
  /* 글꼴 — 한글은 Pretendard, 영문·숫자는 Oswald.
     CDN 이 막히면 기기 기본 글꼴로 자동으로 내려갑니다. */
  --f-body:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  --f-disp:'Oswald','Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;
  --blue:#F2F2F0; --blue-s:#F2F2F0; --red:#F07570; --green:#4ADE80; --amber:#E0B341;
  /* 밝은 바탕 위에 올리는 글자색. 흰 버튼에 흰 글자가 되는 것을 막습니다. */
  --on-acc:#0A0A0A;
  /* 밝은 바탕 위의 보조 글자 — 조금 흐리되 읽히는 선까지만 */
  --on-acc2:#4A4A48;
  --r1:14px; --r2:20px; --r3:26px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;max-width:100vw;margin:0;overflow:hidden;
 overscroll-behavior:none;touch-action:manipulation}
body{background:var(--bg);color:var(--tx);
 font-family:var(--f-body);
 user-select:none;-webkit-user-select:none;
 font-size:clamp(15px,1.35vh,18px);line-height:1.5;
 -webkit-font-smoothing:antialiased}
button{font-family:inherit}

/* ── 뼈대: 머리 · 본문 · 발 */
.wrap{height:100%;width:100%;max-width:100vw;overflow:hidden;
 display:grid;grid-template-rows:auto minmax(0,1fr) auto;
 gap:clamp(10px,1.8vh,20px);padding:clamp(14px,2.2vh,22px) clamp(18px,2.2vw,30px)}
.mid{min-height:0;display:flex;flex-direction:column;justify-content:center;
 align-items:center;text-align:center;gap:clamp(12px,2vh,20px);
 overflow:auto;-webkit-overflow-scrolling:touch}

/* ── 머리 */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
 gap:clamp(10px,1.6vw,20px);min-height:0}
.top .tl{min-width:0}
.top .tc{justify-self:center;display:flex;align-items:center}
.top .clock{justify-self:end;text-align:right}
.room{font-size:clamp(20px,2.6vh,27px);font-weight:800;letter-spacing:-.4px;
 display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.today{font-size:clamp(13px,1.5vh,16px);color:var(--mut);margin-top:5px;
 display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.clock{text-align:right;flex:none}
.clock .hm{font-size:clamp(34px,5.4vh,52px);font-weight:600;line-height:1;
 letter-spacing:-.5px;font-variant-numeric:tabular-nums;font-family:var(--f-disp)}
.clock .sec{font-size:clamp(12px,1.4vh,14px);color:var(--dim);margin-top:6px;font-family:var(--f-disp)}
.today,.next .lb,.tflag{font-family:var(--f-disp)}
.tflag{background:rgba(224,179,65,.14);color:var(--amber);
 border:1px solid rgba(224,179,65,.30);border-radius:999px;
 font-size:clamp(11px,1.25vh,13px);font-weight:700;padding:4px 11px;white-space:nowrap}

/* ── 대기 화면 예약 카드 */
.next{position:relative;background:var(--s1);border:1px solid var(--line);
 width:min(620px,100%);
 border-radius:var(--r3);padding:clamp(16px,2.4vh,24px) clamp(26px,3vw,40px) clamp(16px,2.2vh,22px);
 max-width:100%;
 transition:border-color .35s ease, box-shadow .35s ease, background .35s ease}
.next.on{background:#141414;border-color:var(--blue);animation:halo 3.6s ease-in-out infinite}
@keyframes halo{
  0%,100%{box-shadow:0 0 0 0 rgba(242,242,240,.22), 0 12px 34px rgba(0,0,0,.34)}
  50%    {box-shadow:0 0 0 9px rgba(242,242,240,.035), 0 12px 34px rgba(0,0,0,.34)}}
.next .lb{display:inline-flex;align-items:center;gap:8px;
 font-size:clamp(12px,1.45vh,14px);color:var(--blue-s);font-weight:700;letter-spacing:.05em}
.next .lb i{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none;
 animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.next .tt{font-size:clamp(22px,3.4vh,32px);font-weight:800;margin:10px 0 6px;
 line-height:1.28;letter-spacing:-.5px}
.next .tm{font-size:clamp(14px,1.75vh,17px);color:var(--mut);font-variant-numeric:tabular-nums}
.bar{margin-top:14px;height:4px;border-radius:4px;background:var(--s2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--blue);
 width:0;transition:width .9s ease}
.barlb{margin-top:7px;font-size:clamp(11px,1.35vh,13px);color:var(--dim)}
.tether{position:relative;width:2px;height:clamp(24px,4vh,44px);border-radius:2px;
 background:linear-gradient(rgba(242,242,240,.20),rgba(242,242,240,.045));overflow:hidden;flex:none}
.tether i{position:absolute;left:-2px;width:6px;height:6px;border-radius:50%;
 background:var(--blue);box-shadow:0 0 10px rgba(242,242,240,.62);
 animation:flow 2.4s cubic-bezier(.4,0,.6,1) infinite}
@keyframes flow{0%{top:-8px;opacity:0}18%{opacity:1}82%{opacity:1}100%{top:100%;opacity:0}}

/* ── 헤임달 로고 — PC 화면 왼쪽 위와 같은 파일을 씁니다.
   그림 안의 색이 검정이라 어두운 바탕에서는 뒤집어서 밝게 만듭니다. */
.lgh{height:clamp(26px,4vh,44px);width:auto;display:block;
 filter:invert(1);opacity:.92}

/* ── 큰 버튼 */
.big{position:relative;overflow:hidden;border:0;border-radius:var(--r3);cursor:pointer;
 font-size:clamp(24px,3.6vh,34px);font-weight:800;letter-spacing:-.5px;
 padding:clamp(20px,3.2vh,32px) clamp(38px,4.4vw,62px);
 display:inline-flex;align-items:center;gap:16px;
 box-shadow:0 10px 30px rgba(0,0,0,.34);transition:transform .12s ease}
.big:active{transform:scale(.985)}
.big>*{position:relative;z-index:1}

/* 「지금 누르면 됩니다」 를 보여주는 유리 느낌 —
   위에서 아래로 밝기가 떨어지는 바탕 + 3.4초마다 한 번 지나가는 빛줄기.
   깜빡이지 않습니다. 하루 종일 켜져 있는 화면이라 켜졌다 꺼지는 움직임은 쓰지 않습니다. */
.go{background:linear-gradient(163deg,#FAFAF8 0%,#EAEAE7 42%,#D2D2CE 100%);
 background-color:#D2D2CE;color:var(--on-acc);
 animation:gohalo 3.4s ease-in-out infinite}
.go .dot{background:var(--on-acc);animation:godot 3.4s ease-in-out infinite}
.go::after{content:'';position:absolute;top:0;bottom:0;left:0;width:46%;z-index:0;
 pointer-events:none;transform:translateX(-160%) skewX(-14deg);
 background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.95) 50%,
   rgba(255,255,255,0) 100%);
 animation:sheen 3.4s cubic-bezier(.36,0,.24,1) infinite}
@keyframes sheen{0%{transform:translateX(-160%) skewX(-14deg)}
                 62%,100%{transform:translateX(340%) skewX(-14deg)}}
@keyframes gohalo{
  0%,100%{box-shadow:0 10px 30px rgba(0,0,0,.34), 0 0 0 0 rgba(242,242,240,.24)}
  50%    {box-shadow:0 10px 30px rgba(0,0,0,.34), 0 0 0 12px rgba(242,242,240,.045)}}
@keyframes godot{0%,100%{opacity:1}50%{opacity:.45}}

.stop{background:var(--red);color:var(--on-acc)}
.stop .dot{background:var(--on-acc)}
.dot{width:18px;height:18px;border-radius:50%;background:var(--on-acc);flex:none}
.rec .dot{animation:bl 1.4s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
.lbwrap{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;min-width:0}
.sub2{display:block;font-size:clamp(13px,1.6vh,16px);font-weight:600;
 color:var(--on-acc2);   /* 밝은 버튼 안이라 어두운 색이어야 합니다 */
 
 margin-top:6px;letter-spacing:0;max-width:min(460px,42vw);
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:clamp(13px,1.6vh,16px);color:var(--mut);line-height:1.65}
.ghost{background:transparent;border:1px solid var(--line2);color:var(--tx);
 border-radius:var(--r1);font-size:clamp(14px,1.7vh,17px);
 padding:14px 26px;cursor:pointer}
.ghost:active{background:var(--s2)}
.pillbtn{background:transparent;border:1px solid var(--line2);color:var(--mut);
 border-radius:999px;font-size:clamp(11px,1.35vh,13px);padding:5px 13px;cursor:pointer}
.pillbtn:active{background:var(--s2)}

/* ── 발: 다른 예약 목록 */
.list{border-top:1px solid var(--line);padding-top:clamp(8px,1.4vh,14px);min-height:0}
.list .h{font-size:clamp(11px,1.3vh,13px);color:var(--dim);margin-bottom:8px;letter-spacing:.04em}
.picks{display:flex;flex-direction:column;gap:7px;max-height:clamp(120px,22vh,210px);overflow:auto}
.pick{display:flex;align-items:center;gap:16px;width:100%;text-align:left;
 background:var(--s1);border:1px solid var(--line);border-radius:var(--r1);color:var(--tx);
 font-size:clamp(14px,1.75vh,18px);padding:13px 18px;cursor:pointer}
.pick:active{background:var(--s2)}
.pick b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .tm{color:var(--mut);font-size:clamp(13px,1.6vh,16px);flex:none;min-width:120px;
 font-variant-numeric:tabular-nums}
.rmtag{margin-left:auto;font-size:clamp(11px,1.35vh,14px);color:var(--blue-s);
 border:1px solid var(--line2);border-radius:999px;padding:4px 12px;flex:none}

/* ── 녹음 화면: 좌우 두 단 */
.rec2{display:grid;gap:clamp(12px,1.6vw,18px);min-height:0;height:100%;
 grid-template-columns:1.05fr .95fr}
.rec2.solo{grid-template-columns:1fr;max-width:900px;margin:0 auto;width:100%}
/* 안건 없는 회의도 가로 화면에서는 왼쪽 시간 · 오른쪽 참석자 — 참석자 칸이 화면 높이를 다 씀 (2026-10-26) */
@media (min-width:901px){
 .rec2.solo{grid-template-columns:minmax(190px,.42fr) 1.58fr;max-width:none}
 .rec2.solo .timer{flex:1;justify-content:center}
}
.col{display:flex;flex-direction:column;gap:clamp(10px,1.5vh,16px);min-height:0}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r2);
 padding:clamp(14px,2vh,20px) clamp(16px,1.8vw,22px);min-height:0;
 display:flex;flex-direction:column}
.card > .h{font-size:clamp(12px,1.45vh,14px);font-weight:700;color:var(--blue-s);
 letter-spacing:.05em;margin-bottom:10px;flex:none}
.card .body{min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}

.timer{align-items:center;text-align:center;gap:4px;flex:none}
.mtitle{font-size:clamp(15px,1.9vh,20px);font-weight:700;color:var(--mut);
 max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.elapsed{font-size:clamp(46px,8.4vh,84px);font-weight:600;line-height:1;font-family:var(--f-disp);
 font-variant-numeric:tabular-nums;letter-spacing:-2px;margin:6px 0 4px}
.lv{font-size:clamp(12px,1.5vh,15px);color:var(--green);height:20px;
 display:flex;align-items:center;justify-content:center;gap:7px}
.lv i{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}

.agn pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:inherit;
 font-size:clamp(14px,1.85vh,18px);line-height:1.75;color:var(--tx)}
.cnt{font-size:clamp(14px,1.75vh,17px);font-weight:700;color:var(--blue-s);
 margin-bottom:10px;flex:none;min-height:20px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;
 max-height:24vh;overflow:auto;-webkit-overflow-scrolling:touch}
.cntn{margin-right:4px}
.selp{display:inline-flex;align-items:center;gap:7px;background:var(--blue);color:var(--on-acc);
 border:0;border-radius:999px;padding:7px 8px 7px 14px;font-weight:700;cursor:pointer;
 font-size:clamp(15px,1.8vh,17px)}   /* 2026-10-26 글씨가 작다는 의견 — 14→15px (보일 정도로만) */
.selp .w{font-size:.8em;font-weight:600;color:var(--on-acc2)}
.selp .x{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
 border-radius:50%;background:rgba(0,0,0,.12);font-size:16px;line-height:1}
.who .cnt{justify-content:center}
/* 녹음 화면: 고른 사람은 테두리 상자 안에, 고르는 곳은 그 아래 안내 줄부터 — 두 곳이 섞여 보인다는 의견 (2026-10-26) */
.card .cnt{background:var(--s2);border:1px solid var(--line2);border-radius:var(--r1);
 padding:10px 12px;margin-bottom:14px;min-height:52px;max-height:40vh}
.card .cnt:not(:has(.selp)){font-size:clamp(14px,1.7vh,16px);font-weight:600;color:var(--dim)}
.grid{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.nm{background:var(--s2);border:2px solid var(--line);color:var(--tx);border-radius:var(--r1);
 font-size:clamp(15px,2vh,20px);font-weight:700;padding:12px 18px;cursor:pointer;
 min-width:104px;transition:background .15s ease,border-color .15s ease,color .15s ease}
.nm.on{background:var(--blue);border-color:var(--blue);color:var(--on-acc)}
.nm .co{display:block;font-size:clamp(10px,1.15vh,12px);font-weight:500;opacity:.62;margin-top:3px}
/* 참석자 고르기 — 회사 탭 · 팀 칩 · 팀원 (2026-10-20) */
.pk{display:flex;flex-direction:column;gap:10px;min-height:0;flex:1}
.pkco,.pkdp{display:flex;flex-wrap:wrap;gap:8px;flex:none}
.pkc,.pkd{background:transparent;border:1px solid var(--line2);color:var(--mut);cursor:pointer;
 border-radius:999px;font-weight:700;display:inline-flex;align-items:center;gap:8px;
 transition:background .15s ease,border-color .15s ease,color .15s ease}
.pkc{font-size:clamp(14px,1.8vh,18px);padding:9px 18px}
.pkd{font-size:clamp(14px,1.75vh,17px);padding:8px 16px;background:var(--s2);border-color:var(--line);color:var(--tx)}
.pkc.on,.pkd.on{background:var(--blue);border-color:var(--blue);color:var(--on-acc)}
.pkd.has:not(.on){border-color:var(--blue)}
.pkn{font-size:.78em;font-weight:700;opacity:.75;font-variant-numeric:tabular-nums}
.pkms{min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;flex:1;
 border-top:1px solid var(--line);padding-top:10px}
.nm.all{border-style:dashed}
.nm.all.on{border-style:solid}
.who .pk{max-height:52vh;width:min(100%,980px);text-align:left}

/* ── 발: 종료 버튼 줄 */
.ftr{display:flex;align-items:center;gap:14px;justify-content:center}
.ftr .hint{font-size:clamp(12px,1.45vh,14px);color:var(--dim)}

/* ── 회의실 고르기 */
.sheet{position:fixed;inset:0;background:rgba(6,6,6,.74);display:flex;
 align-items:center;justify-content:center;z-index:50;padding:24px;
 backdrop-filter:blur(3px)}
.sheetcard{background:var(--s1);border:1px solid var(--line2);border-radius:var(--r3);
 padding:clamp(20px,3vh,30px) clamp(20px,2.4vw,30px);width:100%;max-width:640px;
 max-height:86vh;overflow:auto;text-align:center}
.sheetcard .h{font-size:clamp(18px,2.6vh,23px);font-weight:800;margin-bottom:18px}
.rmopt{display:block;width:100%;margin-bottom:9px;background:var(--s2);
 border:1px solid var(--line);color:var(--tx);border-radius:var(--r1);
 font-size:clamp(16px,2.2vh,21px);font-weight:700;padding:16px 20px;cursor:pointer}
.rmopt:active{background:#242424}
.rmopt.on{border-color:var(--blue);color:var(--blue-s);background:#141414}

/* ── 끝났습니다 */
.done{font-size:clamp(24px,3.6vh,34px);font-weight:800;letter-spacing:-.5px}
.done .ok{display:flex;align-items:center;justify-content:center;
 width:clamp(58px,9vh,84px);height:clamp(58px,9vh,84px);margin:0 auto 16px;
 border-radius:50%;background:rgba(61,214,140,.12);color:var(--green);
 border:1px solid rgba(61,214,140,.32);font-size:clamp(30px,4.6vh,44px)}

/* ── 설정 */
.setup{max-width:540px;margin:0 auto;width:100%;text-align:left}
.setup h1{font-size:clamp(20px,2.8vh,25px);margin:0 0 6px;letter-spacing:-.4px}
.setup input,.setup select{width:100%;background:var(--s2);border:1px solid var(--line2);
 color:var(--tx);border-radius:var(--r1);font-family:inherit;
 font-size:clamp(16px,2vh,19px);padding:15px 17px;margin-bottom:11px}
.setup .btn{width:100%;background:var(--blue);border:0;color:var(--on-acc);border-radius:var(--r1);
 font-family:inherit;font-size:clamp(17px,2.2vh,20px);font-weight:700;padding:17px;cursor:pointer}
.err{color:var(--red);font-size:clamp(13px,1.6vh,15px);min-height:22px;margin-top:8px}
.chk{display:flex;align-items:center;gap:11px;font-size:clamp(14px,1.7vh,16px);color:var(--tx);
 background:var(--s2);border:1px solid var(--line2);border-radius:var(--r1);
 padding:15px 17px;margin-bottom:6px}
.chk input{width:21px;height:21px;margin:0;flex:none}
.gear{position:fixed;right:0;top:0;width:76px;height:76px;opacity:0}

@media (prefers-reduced-motion: reduce){
  .next.on,.next .lb i,.tether i,.rec .dot,
  .go,.go .dot,.go::after{animation:none}
  .tether i{top:40%}
  .go::after{display:none}}
/* 세로로 세운 태블릿 · 좁은 화면에서는 한 단으로 */
@media (max-width:900px){ .rec2{grid-template-columns:1fr} }
</style>
</head>
<body>

<script type="module">

const PK={co:'', dp:null};       // 참석자 고르기 — 지금 펼친 회사·팀
let PICKED=null;                 // 사람이 아래 목록에서 고른 회의
// 예약에 없는 회의를 녹음할 때 켭니다. 켜지면 예약 카드를 무시합니다.

let ADHOC=false;

// 시험 모드는 이 계정만 켤 수 있습니다.

const TEST_EMAIL='khw@jhhds.co.kr';

// 시각은 한국 기준으로 고정합니다
const KST = o => new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',...o});
const hm  = t => KST({hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(t));
const ymd6 = d => {
  const t=new Date((d?new Date(d):new Date()).getTime()+9*3600*1000);
  return t.toISOString().slice(2,10).replace(/-/g,'');
};
const clk = () => {
  const n=new Date();
  return { hm:hm(n), day:KST({month:'long',day:'numeric',weekday:'long'}).format(n) };
};
function el(sec){
  sec=Math.floor(sec);
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  const p=x=>String(x).padStart(2,'0');
  return h? h+':'+p(m)+':'+p(s) : m+':'+p(s);
}
// 제목 규칙은 헤임달과 같게 — 「날짜 회사 내용」
function mkTitle(body, co){
  let t=(body||'').trim().replace(/^\d{6}\s*/,'');
  co=(co||'').trim();
  if(co && t.startsWith(co)) t=t.slice(co.length).trim();
  return [ymd6(), co, t||'회의'].filter(Boolean).join(' ');
}

// 화면이 꺼지지 않게 잡아둡니다
let wake=null;
async function keepAwake(){
  try{
    if(!('wakeLock' in navigator) || wake) return;
    wake = await navigator.wakeLock.request('screen');
    wake.addEventListener('release', ()=>{ wake=null; });
  }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible'){ wake=null; keepAwake(); }
});

// ─────────────────────────── 설정 화면

        '<input id="em" type="email" placeholder="회의실 계정 이메일" value="'+esc(cfg.email||'')+'">'

          + '<div class="sub" style="margin:6px 0 16px;font-size:14px">'

// ─────────────────────────── 자료 읽기
// 이름·회의실 이름을 견주기 좋게 다듬습니다 (띄어쓰기·기호 차이 무시)
const flat = t => String(t||'').replace(/[^0-9A-Za-z가-힣]/g,'').toLowerCase();

// 우리 건물 회의실 — 순서대로 보여줍니다. 늘어나면 여기에 한 줄 더하면 됩니다.
const ROOMS = ['5F 대회의실','5F 홍석진 대표님 사무실','1F 대회의실',
               'B1 소회의실','B1 간이 회의실','B1 대회의실',
               '슈퍼홀릭 회의실','외부 미팅'];

// 로그인한 계정이 「회의실 전용 계정」 일 때만 이름 목록에서 뺍니다.
// 개인 계정으로 로그인해도 그 사람이 사라지지 않게 하려는 것입니다.
const isRoomAcct = m => {
  const a=flat(m && m.name), b=flat(cfg.room);
  if(!a) return false;
  if(b && (a.indexOf(b)>=0 || b.indexOf(a)>=0)) return true;
  return /회의실|미팅룸|회의룸|room/i.test(m.name||'');
};
async function loadMembers(){
  // 겸직(extra_scopes)도 함께 읽습니다. 칸이 없는 예전 서버면 빼고 다시 읽습니다.
  let {data,error}=await SB.from('hd_member')
    .select('id,name,company,dept,status,approved,extra_scopes').eq('approved',true).order('name');
  if(error) ({data}=await SB.from('hd_member')
    .select('id,name,company,dept,status,approved').eq('approved',true).order('name'));
  MEMBERS=(data||[]).filter(m=>(m.status||'active')==='active'
                            && (m.name||'').trim()
                            && !(m.id===me.id && isRoomAcct(m)));
  // 회사별로 묶어 보여줍니다 (사람이 늘어도 자기 이름을 빨리 찾게)
  MEMBERS.sort((x,y)=> (x.company||'').localeCompare(y.company||'')
                    || (x.name||'').localeCompare(y.name||''));
  // 회사·팀 순서는 웹 화면과 같은 명부(hd_org)를 따릅니다. 못 읽으면 가나다순.
  try{
    const {data:o}=await SB.from('hd_org').select('company,dept,sort').order('sort');
    ORDER={}; (o||[]).forEach((r,i)=>{ const k=r.company+'|'+r.dept;
      if(!(k in ORDER)) ORDER[k]=i; if(!(r.company in ORDER)) ORDER[r.company]=i; });
  }catch(e){ ORDER={}; }
}
async function loadEvents(){
  const now=Date.now();
  const from=new Date(now-2*3600*1000).toISOString();
  const to  =new Date(now+16*3600*1000).toISOString();
  const {data}=await SB.from('hd_cal_event')
    .select('uid,title,room,starts_at,ends_at,all_day,note')
    .gte('starts_at',from).lte('starts_at',to).order('starts_at');
  EVENTS=(data||[]).filter(e=>!e.all_day);
}
// 회의실 이름이 비슷하면 같은 곳으로 봅니다 (띄어쓰기·기호 차이 무시)
function mine(){
  const r=flat(cfg.room);
  if(!r) return EVENTS;
  return EVENTS.filter(e=>{
    const x=flat(e.room);
    return x && (x.indexOf(r)>=0 || r.indexOf(x)>=0);
  });
}
// 지금 하고 있거나 곧 시작할 예약 (앞뒤 20분 여유)
function current(){
  const now=Date.now();
  return mine().find(e=>{
    const s=new Date(e.starts_at).getTime(), t=new Date(e.ends_at).getTime();
    return now >= s-20*60*1000 && now <= t+20*60*1000;
  }) || null;
}
// 예약 제목에서 회사를 알아봅니다 (참석자를 아무도 안 누르셨을 때 씁니다)
function coFromTitle(t){
  const x=flat(t);
  const cos=[...new Set(MEMBERS.map(m=>m.company).filter(Boolean))];
  return cos.find(c=>x.indexOf(flat(c))>=0) || '';
}

// ─────────────────────────── 대기 화면
function idlePage(){
  clearInterval(tick);
  const ev=ADHOC ? null : (PICKED || current());

    '<div class="top">'
    + '<div class="tl"><div class="room">'+esc(cfg.room||'회의실')

    + '<div class="today" id="dy">'+esc(c.day)+'</div></div>'
    + '<div class="tc"><img src="./assets/logo-horizontal.svg" alt="HEIMDALL" class="lgh"></div>'
    + '<div class="clock"><div class="hm" id="ck">'+c.hm+'</div>'
    + '<div class="sec">회의가 끝나면 회의록이 자동으로 만들어집니다</div></div></div>'
    + '<div class="mid">'
    + (ev ? '<div class="next on" id="card"><div class="lb"><i></i>이 회의로 녹음됩니다</div>'
          + '<div class="tt">'+esc(ev.title||'회의')+'</div>'
          + '<div class="tm">'+hm(ev.starts_at)+' ~ '+hm(ev.ends_at)
          + (PICKED ? ' · '+esc(ev.room||'')  : '')+'</div>'
          + '<div class="bar"><i id="bari"></i></div>'
          + '<div class="barlb" id="barlb"></div></div>'
          + '<div class="tether"><i></i></div>'
          : '<div class="sub">'
          + (ADHOC ? '예약에 없는 회의를 녹음합니다' : '지금 잡힌 예약이 없습니다') + '<br>'
          + '<span style="font-size:14px">아래 버튼을 누르면 제목 없이 녹음을 시작합니다 · '
          + '회사는 녹음 중에 참석자를 누르시면 정해집니다</span></div>')
    + '<button class="big go" id="start"><span class="dot"></span>'
    + '<span class="lbwrap"><span>회의 녹음 시작</span>'
    + (ev ? '<span class="sub2">'+esc(ev.title||'회의')+'</span>' : '')
    + '</span></button>'
    + '<div class="sub" style="font-size:14px">'
    + (ev ? '위 회의로 녹음됩니다 · 다른 회의면 아래에서 골라주세요'
          : '누르면 바로 녹음이 시작됩니다')
    + ' · 참석자는 녹음 중에 이름을 누르시면 됩니다</div>'
    // 예약이 떠 있어도 예약에 없는 회의를 녹음할 수 있게 합니다.
    + (ev    ? '<button class="ghost" id="adhoc">예약에 없는 회의 녹음하기</button>' : '')
    + (ADHOC && current()
             ? '<button class="ghost" id="unadhoc">예약된 회의로 돌아가기</button>' : '')
    + '</div>'
    + (rest.length ? '<div class="list"><div class="h">다른 회의 고르기 — 누르면 위 카드가 바뀝니다 · '
        + '다른 회의실 예약도 여기 있습니다</div><div class="picks">'
        + rest.slice(0,6).map((e,i)=>'<button class="pick" data-ev="'+i+'">'
          + '<span class="tm">'+hm(e.starts_at)+' ~ '+hm(e.ends_at)+'</span>'
          + '<b>'+esc(e.title||'회의')+'</b>'
          + (mineRest.indexOf(e)<0 && e.room
              ? '<span class="rmtag">'+esc(e.room)+'</span>' : '')
          + '</button>').join('') + '</div></div>' : '<div></div>');

  let ticks=0;
  tick=setInterval(()=>{
    const c2=clk();
    const a=$('#ck'), b=$('#dy');
    if(a) a.textContent=c2.hm;
    if(b) b.textContent=c2.day;
    if(++ticks % 60 === 0) drawBar(ev);      // 1분마다 진행 바 갱신
  }, 1000);

  drawBar(ev);
  $('#start').onclick=()=>startRec(ev);
  // 예약 카드를 끄고 제목 없는 회의로 녹음합니다.
  const ah=$('#adhoc');   if(ah) ah.onclick=()=>{ ADHOC=true;  PICKED=null; idlePage(); };
  const uh=$('#unadhoc'); if(uh) uh.onclick=()=>{ ADHOC=false; PICKED=null; idlePage(); };
  // 다른 회의를 누르면 바로 녹음하지 않고 위 카드만 바꿉니다.
  // 지나가다 잘못 눌러 진짜 회의가 시작되는 일을 막습니다.
  app.querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>{
    ADHOC=false;                       // 예약을 고르면 「예약 없음」 상태를 풉니다
    PICKED = rest[+b.dataset.ev] || null;
    idlePage();
  });
}

// 예약 시간 안에서 지금이 어디쯤인지 — 1분마다 갱신됩니다
function drawBar(ev){
  const fill=$('#bari'), lb=$('#barlb');
  if(!ev || !fill) return;
  const draw=()=>{
    const s=new Date(ev.starts_at).getTime(), e=new Date(ev.ends_at).getTime(), n=Date.now();
    const all=Math.max(1, e-s);
    const p=Math.max(0, Math.min(1, (n-s)/all));
    fill.style.width=(p*100).toFixed(1)+'%';
    if(!lb) return;
    if(n < s){
      const m=Math.round((s-n)/60000);
      lb.textContent = m>=60 ? '시작까지 '+Math.floor(m/60)+'시간 '+(m%60)+'분'
                             : '시작까지 '+m+'분';
    }else if(n > e){
      lb.textContent='예정된 시간이 지났습니다 — 그래도 녹음할 수 있습니다';
    }else{
      const m=Math.round((e-n)/60000);
      lb.textContent = m>=60 ? '끝나기까지 '+Math.floor(m/60)+'시간 '+(m%60)+'분'
                             : '끝나기까지 '+m+'분';
    }
  };
  draw();
}

// ─────────────────────────── 녹음
const REC={};
async function startRec(ev){
  let stream;
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
  }catch(e){
    alert('마이크를 쓸 수 없습니다.\n태블릿 설정에서 이 페이지의 마이크 사용을 허용해주세요.');
    return;
  }
  let mime='';
  for(const m of ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'])
    if(window.MediaRecorder && MediaRecorder.isTypeSupported(m)){ mime=m; break; }

  REC.stream=stream; REC.chunks=[]; REC.t0=Date.now(); REC.ev=ev||null;
  REC.title=(ev&&ev.title)||''; REC.who=new Set(); REC.via=new Map();
  PICKED=null; ADHOC=false;
  REC.agenda=((ev&&ev.note)||'').trim();
  REC.room=cfg.room||'';
  REC.mr = mime ? new MediaRecorder(stream,{mimeType:mime, audioBitsPerSecond:64000})
                : new MediaRecorder(stream);
  REC.mr.ondataavailable=e=>{ if(e.data&&e.data.size) REC.chunks.push(e.data); };
  REC.mr.onstop=finish;
  REC.mr.start(5000);          // 5초씩 나눠 모읍니다 (길게 녹음해도 안전)
  keepAwake();
  meter(stream);
  recPage();
}

// ── 참석자 고르기 — 회사 → 팀 → 팀원 (2026-10-20)
// 예전에는 전 직원 이름을 한 판에 늘어놓아, 사람이 많아지자 찾기가 어려웠습니다.
// 팀을 누르면 그 팀 사람만 보이고, 이름을 누른 사람만 참석자가 됩니다.
// 「팀 전체」 는 그 팀을 한 번에 넣고 뺍니다. 고른 사람은 다른 팀을 봐도 그대로 남습니다.
const NO_DEPT='소속 팀 없음';
// 겸직 — 「회사|부서」 면 그 팀에, 「회사|」(회사 전체) 면 그 회사의 「겸직」 칸에 함께 나옵니다 (2026-10-20)
const EXTRA_ALL='겸직';
const EXTRA=new Set();           // 「회사|팀|사람」 — 이 팀에는 겸직으로 들어간 사람
// 대표님 세 분은 회사와 상관없이 각 회사의 「CEO」 칸에만 나옵니다 (2026-10-20 김현우)
//   값 = 나오지 않을 회사. 정원하 대표님은 슈퍼홀릭에서만 뺍니다.
//   태블릿에서 고르는 자리만 바꿉니다 — 헤임달 권한(볼 수 있는 회의)은 그대로입니다.
const CEO_DP='CEO';
const CEOS={'홍석진':[], '김윤회':[], '정원하':['슈퍼홀릭']};
const isCeo=m=>Object.prototype.hasOwnProperty.call(CEOS,(m&&m.name||'').trim());
function teams(){
  const t={};
  EXTRA.clear();
  const put=(co,dp,m)=>{ const l=((t[co]=t[co]||{})[dp]=t[co][dp]||[]);
    if(!l.includes(m)) { l.push(m); return true; } return false; };
  MEMBERS.forEach(m=>{ if(!isCeo(m)) put(m.company||'회사 미지정', m.dept||NO_DEPT, m); });
  MEMBERS.forEach(m=>{ if(!isCeo(m)) (m.extra_scopes||[]).forEach(s=>{
    const i=String(s).indexOf('|');
    const co=(i<0?s:s.slice(0,i)).trim(), dp=(i<0?'':s.slice(i+1)).trim();
    if(!co || (co===m.company && (!dp || dp===m.dept))) return;   // 본 소속과 같으면 건너뜀
    const d=dp||EXTRA_ALL;
    if(put(co,d,m)) EXTRA.add(co+'|'+d+'|'+m.id);
  }); });
  // 대표님 — 화면에 나오는 모든 회사(본 소속·겸직 회사 포함)의 「CEO」 칸
  const ceos=MEMBERS.filter(isCeo);
  const cos=new Set(Object.keys(t).filter(c=>c!=='회사 미지정'));
  ceos.forEach(m=>{ if(m.company) cos.add(m.company);
    (m.extra_scopes||[]).forEach(s=>{ const c=String(s).split('|')[0].trim(); if(c) cos.add(c); }); });
  cos.forEach(co=>ceos.forEach(m=>{ if(!CEOS[m.name.trim()].includes(co)) put(co,CEO_DP,m); }));
  Object.values(t).forEach(c=>Object.values(c).forEach(l=>
    l.sort((a,b)=>(a.name||'').localeCompare(b.name||''))));
  return t;
}
// 어느 회사·팀 칸에서 골랐는지 기억합니다 — 회의의 회사·부서를 정할 때 씁니다
function pickIn(id,co,dp){ REC.who.add(id); (REC.via=REC.via||new Map()).set(id,{co,dp}); }
function unpick(id){ REC.who.delete(id); if(REC.via) REC.via.delete(id); }
function ord(k){ return (k in ORDER) ? ORDER[k] : 9999; }
function coList(t){
  return Object.keys(t).sort((a,b)=>ord(a)-ord(b) || a.localeCompare(b));
}
function dpList(t,co){
  const last=d=>d===CEO_DP?-1:d===NO_DEPT?2:d===EXTRA_ALL?1:0;   // CEO 칸은 맨 앞
  return Object.keys(t[co]||{}).sort((a,b)=>last(a)-last(b)
    || ord(co+'|'+a)-ord(co+'|'+b) || a.localeCompare(b));
}
function picker(){
  if(!MEMBERS.length) return '<span class="sub">구성원 명단을 불러오지 못했습니다</span>';
  return '<div class="pk" id="pk">'+pkInner()+'</div>';
}
function pkInner(){
  const t=teams(), cos=coList(t), sel=REC.who||new Set();
  if(!t[PK.co]){                       // 처음 — 예약 제목의 회사, 없으면 맨 앞 회사
    const g=coFromTitle(REC.title);
    PK.co = t[g] ? g : cos[0]; PK.dp=null;
  }
  const dps=dpList(t,PK.co);
  // 팀이 하나뿐이면 바로 펼칩니다. 「CEO」·「겸직」 칸은 팀 수에 넣지 않습니다 —
  // CEO 칸이 생기면서 AX팀처럼 팀이 하나인 회사도 두 번 눌러야 했습니다 (2026-10-20)
  const real=dps.filter(d=>d!==CEO_DP && d!==EXTRA_ALL);
  if(PK.dp===null && (dps.length===1 || real.length===1)) PK.dp = dps.length===1 ? dps[0] : real[0];
  // 숫자는 「그 회사·팀 칸에서 고른 사람」 만 셉니다. 겸직으로 여러 칸에 나오는 사람이
  // 다른 탭의 숫자까지 올리면, 어느 회사 회의로 잡힐지 헷갈립니다. (단추는 어디서든 켜져 보임)
  const via=REC.via||new Map();
  const at=(m,co,dp)=>{ const v=via.get(m.id); return sel.has(m.id) && (!v || (v.co===co && (dp===undefined || v.dp===dp))); };
  const n=(ms,dp)=>ms.filter(m=>at(m,PK.co,dp)).length;
  const coCnt=co=>new Set([].concat(...Object.values(t[co])).filter(m=>at(m,co)).map(m=>m.id)).size;
  let h='<div class="pkco">'+cos.map(co=>{
      const c=coCnt(co);
      return '<button class="pkc'+(co===PK.co?' on':'')+'" data-co="'+esc(co)+'">'+esc(co)
        +(c?'<span class="pkn">'+c+'</span>':'')+'</button>';
    }).join('')+'</div>';
  h+='<div class="pkdp">'+dps.map(dp=>{
      const ms=t[PK.co][dp], c=n(ms,dp);
      return '<button class="pkd'+(dp===PK.dp?' on':'')+(c?' has':'')+'" data-dp="'+esc(dp)+'">'
        +esc(dp)+'<span class="pkn">'+(c?c+'/':'')+ms.length+'</span></button>';
    }).join('')+'</div>';
  if(PK.dp===null || !t[PK.co][PK.dp]){
    h+='<div class="pkms"><span class="sub">위에서 팀을 누르시면 팀원이 나옵니다</span></div>';
    return h;
  }
  const ms=t[PK.co][PK.dp], all=ms.length && ms.every(m=>sel.has(m.id));
  h+='<div class="pkms"><div class="grid">'
    +'<button class="nm all'+(all?' on':'')+'" data-all="1">'+(all?'팀 전체 빼기':'팀 전체')
    +'<span class="co">'+esc(PK.dp)+' '+ms.length+'명</span></button>'
    +ms.map(m=>{
      const ex=EXTRA.has(PK.co+'|'+PK.dp+'|'+m.id);
      return '<button class="nm'+(sel.has(m.id)?' on':'')+'" data-id="'+m.id+'">'+esc(m.name)
        +(ex?'<span class="co">겸직 · '+esc([m.company,m.dept].filter(Boolean).join(' '))+'</span>':'')
        +'</button>'; }).join('')
    +'</div></div>';
  return h;
}
// 고른 사람 카드 줄 — 다른 회사·팀으로 넘어가도 누가 골렸는지 늘 보이게 (2026-10-20)
// 예전에는 「참석 N명 · 이름…」 한 줄 글자뿐이라, 팀을 옮기면 앞서 고른 사람이 잘 안 보였습니다.
// × 를 누르면 그 사람만 뺍니다 (고른 팀을 찾아갈 필요 없음).
function paintWho(){
  const c=$('#cnt');
  if(c){
    const via=REC.via||new Map();
    const byId=new Map(MEMBERS.map(m=>[m.id,m]));
    const ids=[...via.keys()].filter(id=>REC.who.has(id))
      .concat([...REC.who].filter(id=>!via.has(id)));          // 고른 순서대로
    const picked=ids.map(id=>byId.get(id)).filter(Boolean);
    c.innerHTML = picked.length
      ? '<span class="cntn">참석 '+picked.length+'명</span>'
        + picked.map(m=>{ const v=via.get(m.id)||{co:m.company,dp:m.dept};
            const where=[v.co, v.dp && v.dp!==NO_DEPT ? v.dp : ''].filter(Boolean).join(' ');
            return '<button class="selp" data-un="'+m.id+'">'+esc(m.name)
              +(where?'<span class="w">'+esc(where)+'</span>':'')+'<span class="x">×</span></button>'; }).join('')
      : '아직 아무도 누르지 않았습니다';
  }
  paintUp();          // 참석자 확인 화면일 때만 동작합니다
}
function bindPicker(){
  const box=$('#pk'); if(!box) return;
  const c=$('#cnt');
  if(c) c.onclick=e=>{
    const b=e.target.closest('[data-un]'); if(!b) return;
    unpick(b.dataset.un);
    const keep=(box.querySelector('.pkms')||{}).scrollTop||0;
    box.innerHTML=pkInner();
    const ms=box.querySelector('.pkms'); if(ms) ms.scrollTop=keep;
    paintWho();
  };
  box.onclick=e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.co!==undefined){ PK.co=b.dataset.co; PK.dp=null; }
    else if(b.dataset.dp!==undefined){ PK.dp=b.dataset.dp; }
    else if(b.dataset.all){
      const ms=(teams()[PK.co]||{})[PK.dp]||[];
      const all=ms.every(m=>REC.who.has(m.id));
      ms.forEach(m=> all ? unpick(m.id) : (REC.who.has(m.id) || pickIn(m.id,PK.co,PK.dp)));
    }
    else if(b.dataset.id){
      const id=b.dataset.id;
      REC.who.has(id) ? unpick(id) : pickIn(id,PK.co,PK.dp);
    }
    else return;
    const keep=(box.querySelector('.pkms')||{}).scrollTop||0;
    box.innerHTML=pkInner();
    const ms=box.querySelector('.pkms'); if(ms && b.dataset.id) ms.scrollTop=keep;
    paintWho();
  };
  paintWho();
}

// 소리가 들어오는지 눈으로 보여줍니다 (마이크가 꺼져 있으면 바로 압니다)
function meter(stream){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    const ac=new AC();
    const an=ac.createAnalyser(); an.fftSize=512;
    ac.createMediaStreamSource(stream).connect(an);
    const buf=new Uint8Array(an.frequencyBinCount);
    REC.meter=setInterval(()=>{
      an.getByteFrequencyData(buf);
      let sum=0; for(let i=0;i<buf.length;i++) sum+=buf[i];
      const lv=$('#lv');
      if(lv) lv.innerHTML = (sum/buf.length)>2 ? '<i></i>소리 들어오는 중' : '';
    }, 700);
    REC.ac=ac;
  }catch(e){}
}

function stopRec(){
  if(!REC.mr || REC.mr.state!=='recording') return;
  const sec=(Date.now()-REC.t0)/1000;
  // 실수로 눌렀을 때를 걸러냅니다
  if(sec<60 && !confirm('아직 '+Math.round(sec)+'초밖에 안 됐습니다.\n회의를 끝내고 올릴까요?')) return;
  clearInterval(REC.meter); clearInterval(tick);
  REC.dur=Math.floor(sec);
  REC.mr.stop();
  (REC.stream.getTracks()||[]).forEach(t=>t.stop());
  try{ if(REC.ac) REC.ac.close(); }catch(e){}
  app.innerHTML='<div class="mid"><div class="done"><span class="ok">⏳</span>정리하는 중입니다…</div></div>';
}

function finish(){
  const type=REC.mr.mimeType||'audio/webm';
  const ext=type.indexOf('mp4')>=0?'mp4':type.indexOf('ogg')>=0?'ogg':'webm';
  REC.blob=new Blob(REC.chunks,{type}); REC.ext=ext; REC.type=type;
  REC.mr=null; REC.chunks=[];
  if(REC.blob.size<4000){ msg('녹음이 비어 있습니다','마이크가 연결되어 있는지 확인해주세요'); return; }
  // 아무도 이름을 누르지 않았으면 한 번 더 여쭙니다.
  // 참석자가 곧 열람 권한이라 비워두면 팀장·관리자만 보게 됩니다.
  if(!REC.who.size) return askWho();
  upload();
}

// 이 회의의 회사·부서를 정합니다 (올리기 전에)
function meetingCoDept(){
  // 이름을 누르신 분들이 참석자입니다. 그분들의 회사를 이 회의의 회사로 씁니다.
  const picked=MEMBERS.filter(m=>REC.who.has(m.id));
  // 2026-10-20 — 본 소속이 아니라 「어느 회사·팀 칸에서 골랐는지」 로 셉니다.
  //   겸직으로 슈퍼홀릭 칸에서 고른 김윤회 대표님(본 소속 더올마이티)은 슈퍼홀릭으로 셉니다.
  const via=REC.via||new Map();
  const coOf=m=>((via.get(m.id)||{}).co)||m.company||'';
  // 대표님은 여러 팀 회의에 들어오시므로 부서를 정하는 데는 빼고 셉니다
  const dpOf=m=>{ if(isCeo(m)) return ''; const v=via.get(m.id); return v && v.co===coOf(m) ? v.dp : m.dept; };
  const cos={};
  picked.forEach(m=>{ const c=coOf(m); if(c) cos[c]=(cos[c]||0)+1; });
  let company=Object.keys(cos).sort((a,b)=>cos[b]-cos[a])[0] || '';
  if(!company) company=coFromTitle(REC.title);          // 예약 제목에서 찾아보고
  // 2026-09-14 — 「명단에서 가장 많은 회사」 로 찍는 폴백을 뺐습니다.
  //   회의실은 여러 회사가 같이 씁니다. 참석자를 안 누르고 예약도 없으면
  //   엉뚱한 회사로 잡혀 **다른 회사 슬랙으로 회의록이 새어 나갑니다.**
  //   모르면 비워 둡니다. 회사가 비면 슬랙이 나가지 않고, 헤임달에서 사람이 채웁니다.
  const dps=[...new Set(picked.filter(m=>coOf(m)===company).map(dpOf)
    .filter(d=>d && d!==NO_DEPT && d!==EXTRA_ALL))];
  const dept = dps.length===1 ? dps[0] : '';
  return {company, dept};
}

async function upload(){
  app.innerHTML='<div class="mid"><div class="done"><span class="ok">⏳</span>올리는 중입니다…</div></div>';

  const picked=MEMBERS.filter(m=>REC.who.has(m.id));
  const {company, dept}=meetingCoDept();

  // 시험 모드 — 올리기는 하되 「나만 보기」로 넣습니다.
  // 계정을 여기서 한 번 더 확인합니다 (설정만 켜둔 채 계정이 바뀌었을 수 있습니다).
  const testMode = cfg.test && canTest();
  const testFields = testMode
    ? {visibility:'private', note_label:'시험 녹음'} : {};

  try{
    const name='jobs/'+Date.now()+'_room.'+REC.ext;   // 저장소 파일 이름은 영문·숫자만
    const up=await SB.storage.from('hd-audio')
      .upload(name, REC.blob, {upsert:true, contentType:REC.type});
    if(up.error){ msg('올리지 못했습니다', up.error.message); return; }

    const ins=await SB.from('hd_job').insert({
      title: mkTitle(REC.title, company),
      participants: picked.map(m=>m.name).join(', '),
      audio_path:name, kind:'audio', orig_name:(REC.title||'회의')+'.'+REC.ext,
      device:'회의실 태블릿', created_by:me.id, created_name:cfg.room||'회의실',
      company:company, dept:dept,
      cal_uid:(REC.ev&&REC.ev.uid)||'', room:REC.room||cfg.room||'',
      agenda_md:(REC.agenda||''),
      started_at:new Date(REC.t0).toISOString(),
      ended_at:new Date(REC.t0+(REC.dur||0)*1000).toISOString(),
      ...testFields,
    });
    if(ins.error){ msg('기록을 남기지 못했습니다', ins.error.message); return; }

    msg(testMode ? '시험 녹음을 올렸습니다' : '회의가 끝났습니다',
      testMode
        ? '회의록은 김현우님만 보이게 저장됩니다 · 슬랙 알림은 나가지 않습니다'
        : (picked.length
            ? picked.map(m=>m.name).join(', ')+' 님께 회의록이 슬랙으로 갑니다'
            : (company
                ? '참석자를 누르지 않으셔서 팀장님과 관리자에게만 보입니다'
                : '참석자를 누르지 않아 어느 회사 회의인지 모릅니다 · '
                  + '슬랙 알림 없이 저장했고, 헤임달에서 회사를 정하면 됩니다')));
  }catch(e){
    msg('올리지 못했습니다', e.message||String(e));
  }
}

function msg(head, sub){
  clearInterval(tick);
  app.innerHTML='<div></div><div class="mid">'
    + '<div class="done"><span class="ok">✓</span>'+esc(head)+'</div>'
    + '<div class="sub" style="max-width:620px">'+esc(sub||'')
    + '<br><br>회의록은 몇 분 뒤 헤임달에 올라옵니다.</div>'
    + '<button class="ghost" id="ok">확인</button></div><div></div>';
  const back=()=>{ loadEvents().catch(()=>{}).then(idlePage); };
  $('#ok').onclick=back;
  setTimeout(back, 12000);
}

// 설정 손잡이 — 오른쪽 위 구석을 3초 길게 눌러야 열립니다
(function(){
  let t=null;
  const g=$('#gear');
  const down=()=>{ t=setTimeout(()=>{ if(!REC.mr) setupPage(''); }, 3000); };
  const up=()=>{ clearTimeout(t); };
  g.addEventListener('touchstart',down); g.addEventListener('touchend',up);
  g.addEventListener('mousedown',down);  g.addEventListener('mouseup',up);
})();

// ─────────────────────────── 시작
// 이 화면에는 서비스 워커를 쓰지 않습니다.
// 예전에 등록된 것이 남아 있으면 화면이 안 뜰 수 있어 지웁니다.
(async()=>{
  try{
    if(!navigator.serviceWorker) return;
    const rs=await navigator.serviceWorker.getRegistrations();
    for(const r of rs){
      if((r.scope||'').indexOf(location.pathname.replace(/room\.html$/,''))>=0)
        await r.unregister();
    }
  }catch(e){}
})();

async function boot(){
  const ses=await SB.auth.getSession();
  const session=ses.data && ses.data.session;
  if(session){
    const {data}=await SB.from('hd_member').select('*').eq('id',session.user.id).maybeSingle();
    if(data && data.approved && (data.status||'active')==='active') me=data;
  }
  // 시험 모드가 켜져 있는데 쓸 수 없는 계정이면 조용히 꺼둡니다
  if(cfg.test && !canTest()){ cfg.test=false; CFG.set(cfg); }
  await loadEvents().catch(()=>{});
  if(!me || !cfg.room){
    setupPage(!me && session ? '이 계정은 아직 승인되지 않았습니다. 관리자에게 요청해주세요.' : '');
    return;
  }
  await loadMembers().catch(()=>{});
  keepAwake();
  idlePage();
  // 예약과 명단을 조용히 새로 읽습니다 (녹음 중에는 건드리지 않습니다)
  setInterval(async()=>{
    if(REC.mr) return;
    await loadEvents().catch(()=>{});
    await loadMembers().catch(()=>{});
    idlePage();
  }, 120000);
}
boot();
</script>
