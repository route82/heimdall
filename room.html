<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>HEIMDALL 회의실</title>
<meta name="theme-color" content="#12161C">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="./icons/favicon.ico?v=3" sizes="any">
<style>
/* ─────────────────────────────────────────────────────────────
   회의실 태블릿 화면 (키오스크)
   버튼 하나만 누르면 되게 만드는 것이 목적입니다.
   손가락으로 누르는 화면이라 글자와 버튼을 크게 잡았습니다.
   ───────────────────────────────────────────────────────────── */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#12161C;color:#fff;
 font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
 user-select:none;-webkit-user-select:none}
.wrap{height:100%;display:flex;flex-direction:column;padding:26px 30px}
.top{display:flex;align-items:flex-start;gap:16px}
.room{font-size:26px;font-weight:800;letter-spacing:-.3px}
.today{font-size:15px;color:#8E98A6;margin-top:4px}
.clock{margin-left:auto;text-align:right}
.clock .hm{font-size:52px;font-weight:800;line-height:1;letter-spacing:-1px;
 font-variant-numeric:tabular-nums}
.clock .sec{font-size:14px;color:#6C7686;margin-top:6px}

.mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
 text-align:center;gap:18px;min-height:0}

.next{position:relative;background:#1B2028;border:1px solid #2A313C;border-radius:20px;
 padding:20px 34px 22px;max-width:92%;min-width:min(560px,88vw);
 transition:border-color .35s ease, box-shadow .35s ease, background .35s ease}
.next.on{background:#18202C;border-color:#2F6FED;
 animation:halo 3.6s ease-in-out infinite}
@keyframes halo{
  0%,100%{box-shadow:0 0 0 0 rgba(47,111,237,.26), 0 10px 30px rgba(0,0,0,.32)}
  50%    {box-shadow:0 0 0 9px rgba(47,111,237,.045), 0 10px 30px rgba(0,0,0,.32)}}
.next .lb{display:inline-flex;align-items:center;gap:7px;
 font-size:14px;color:#6FA8E0;font-weight:700;letter-spacing:.04em}
.next .lb i{width:8px;height:8px;border-radius:50%;background:#2F6FED;flex:none;
 animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.82)}}
.next .tt{font-size:30px;font-weight:800;margin:8px 0 6px;line-height:1.3}
.next .tm{font-size:17px;color:#A9B3C1}
/* 예약 시간 안에서 지금이 어디쯤인지 */
.bar{margin-top:14px;height:4px;border-radius:4px;background:#242C38;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:#2F6FED;
 width:0;transition:width .9s ease}
.barlb{margin-top:7px;font-size:13px;color:#6C7686;letter-spacing:.02em}
/* 카드에서 시작 버튼으로 흐르는 연결선 */
.tether{position:relative;width:2px;height:46px;border-radius:2px;
 background:linear-gradient(#2F6FED33,#2F6FED10);overflow:hidden}
.tether i{position:absolute;left:-2px;width:6px;height:6px;border-radius:50%;
 background:#2F6FED;box-shadow:0 0 10px #2F6FEDaa;
 animation:flow 2.4s cubic-bezier(.4,0,.6,1) infinite}
@keyframes flow{0%{top:-8px;opacity:0}18%{opacity:1}82%{opacity:1}100%{top:46px;opacity:0}}
.go .sub2{display:block;font-size:16px;font-weight:600;color:#DCE7FF;
 margin-top:6px;letter-spacing:0;max-width:520px;overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap}
.go .lbwrap{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
@media (prefers-reduced-motion: reduce){
  .next.on,.next .lb i,.tether i,.rec .dot{animation:none}
  .tether i{top:20px}}

.big{border:0;border-radius:28px;font-family:inherit;cursor:pointer;
 font-size:34px;font-weight:800;padding:34px 64px;letter-spacing:-.4px;
 display:inline-flex;align-items:center;gap:16px;box-shadow:0 10px 34px rgba(0,0,0,.35)}
.big:active{transform:scale(.98)}
.go{background:#2F6FED;color:#fff}
.stop{background:#D0342C;color:#fff}
.dot{width:20px;height:20px;border-radius:50%;background:#fff;flex:none}
.rec .dot{animation:bl 1.4s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}

.sub{font-size:16px;color:#8E98A6;line-height:1.6}
.ghost{background:transparent;border:1px solid #39414D;color:#C6CEDA;
 border-radius:16px;font-family:inherit;font-size:17px;padding:16px 28px;cursor:pointer}

.list{margin-top:auto;padding-top:14px;border-top:1px solid #232A33}
.list .h{font-size:13px;color:#6C7686;margin-bottom:8px;letter-spacing:.04em}
.row{display:flex;gap:14px;font-size:15px;color:#A9B3C1;padding:5px 0}
.row b{color:#E6EBF2;font-weight:600}

.elapsed{font-size:76px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.mtitle{font-size:24px;font-weight:700;color:#C6CEDA}
.lv{font-size:15px;color:#6FD08C;height:22px}

.agn{width:100%;max-width:1000px;margin:0 0 22px;text-align:left;
  border:1px solid #2B3442;background:#161C25;border-radius:14px;padding:14px 18px;
  max-height:300px;overflow:auto}
.agn .h{font-size:15px;font-weight:700;color:#7FA6DA;margin-bottom:8px}
.agn pre{margin:0;white-space:pre-wrap;word-break:break-word;
  font-family:inherit;font-size:17px;line-height:1.7;color:#D7DEE8}
.rmtag{margin-left:auto;font-size:14px;color:#7FA6DA;border:1px solid #2B3442;
  border-radius:999px;padding:4px 12px;flex:none}
.rmbtn{background:transparent;border:1px solid #39414D;color:#A9B3C1;border-radius:999px;
  font-family:inherit;font-size:14px;padding:5px 14px;margin-left:8px;cursor:pointer}
.rmbtn:active{background:#232B36}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;
  align-items:center;justify-content:center;z-index:50;padding:24px}
.sheet .card{background:#151A21;border:1px solid #2A313C;border-radius:22px;
  padding:26px 28px;width:100%;max-width:620px;text-align:center}
.sheet .h{font-size:22px;font-weight:800;margin-bottom:18px}
.rmopt{display:block;width:100%;margin-bottom:10px;background:#1B2028;
  border:1px solid #2A313C;color:#E6EBF2;border-radius:16px;font-family:inherit;
  font-size:21px;font-weight:700;padding:18px 20px;cursor:pointer}
.rmopt:active{background:#232B36}
.rmopt.on{border-color:#2F6FED;color:#8FB6F5}
.who{width:100%;max-width:1000px}
.who .h{font-size:17px;color:#A9B3C1;margin-bottom:12px}
.grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;
 max-height:38vh;overflow-y:auto;padding:2px}
.nm{background:#1B2028;border:2px solid #2A313C;color:#C6CEDA;border-radius:16px;
 font-family:inherit;font-size:21px;font-weight:700;padding:16px 26px;cursor:pointer;min-width:120px}
.nm.on{background:#2F6FED;border-color:#2F6FED;color:#fff}
.nm .co{display:block;font-size:12px;font-weight:500;opacity:.6;margin-top:3px}

.setup{max-width:520px;margin:0 auto;width:100%;text-align:left}
.setup h1{font-size:24px;margin:0 0 6px}
.setup input,.setup select{width:100%;background:#1B2028;border:1px solid #39414D;color:#fff;
 border-radius:14px;font-family:inherit;font-size:19px;padding:16px 18px;margin-bottom:12px}
.setup .btn{width:100%;background:#2F6FED;border:0;color:#fff;border-radius:14px;
 font-family:inherit;font-size:20px;font-weight:700;padding:18px;cursor:pointer}
.err{color:#FF8A80;font-size:15px;min-height:22px;margin-top:8px}

/* 오른쪽 위 아주 작은 설정 손잡이 — 3초 길게 눌러야 열립니다 */
.gear{position:fixed;right:0;top:0;width:76px;height:76px;opacity:0}

.chk{display:flex;align-items:center;gap:10px;font-size:16px;color:#C6CEDA;
 background:#1B2028;border:1px solid #39414D;border-radius:14px;padding:16px 18px;margin-bottom:6px}
.chk input{width:22px;height:22px;margin:0;flex:none}
.tflag{display:inline-block;margin-left:10px;background:#7A4B00;color:#FFD79A;
 border-radius:999px;font-size:13px;font-weight:700;padding:4px 12px;vertical-align:6px}
.cnt{font-size:17px;font-weight:700;color:#8FC5FF;margin-bottom:12px;min-height:24px}
.pick{display:flex;align-items:center;gap:16px;width:100%;text-align:left;
 background:#1B2028;border:1px solid #2A313C;border-radius:14px;color:#E6EBF2;
 font-family:inherit;font-size:18px;padding:16px 20px;margin-bottom:8px;cursor:pointer}
.pick:active{background:#232B36}
.pick .tm{color:#8E98A6;font-size:16px;flex:none;min-width:130px}
.rowbtn{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
.done{font-size:34px;font-weight:800}
.done .ok{font-size:64px;display:block;margin-bottom:14px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="mid"><div class="sub">불러오는 중…</div></div></div>
<div class="gear" id="gear"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SB = createClient('https://dwoiobqucmikbtikfjwk.supabase.co', 'sb_publishable_K6BW26u2jRkTBDwuMqaaFA_3HkfnOc9',
  { auth:{ persistSession:true, autoRefreshToken:true } });

const $  = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s??'').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// 이 태블릿의 설정 (회의실 이름 · 시험 모드)
const CFG = {
  get(){ try{ return JSON.parse(localStorage.getItem('hdroom')||'{}'); }catch(e){ return {}; } },
  set(v){ try{ localStorage.setItem('hdroom', JSON.stringify(v)); }catch(e){} },
};

let me=null, cfg=CFG.get(), MEMBERS=[], EVENTS=[], tick=null;
let PICKED=null;                 // 사람이 아래 목록에서 고른 회의

// 시험 모드는 이 계정만 켤 수 있습니다.
// 다른 분이 모르고 켜두면 회의록이 조용히 안 만들어져 사고가 납니다.
const TEST_EMAIL='khw@jhhds.co.kr';
const canTest = () => !!(me && String(me.email||'').trim().toLowerCase()===TEST_EMAIL);

// 시각은 한국 기준으로 고정합니다
const KST = o => new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',...o});
const hm  = t => KST({hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(t));
const ymd6 = d => {
  const t=new Date((d?new Date(d):new Date()).getTime()+9*3600*1000);
  return t.toISOString().slice(2,10).replace(/-/g,'');
};
const clk = () => {
  const n=new Date();
  return { hm:hm(n), day:KST({month:'long',day:'numeric',weekday:'long'}).format(n) };
};
function el(sec){
  sec=Math.floor(sec);
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  const p=x=>String(x).padStart(2,'0');
  return h? h+':'+p(m)+':'+p(s) : m+':'+p(s);
}
// 제목 규칙은 헤임달과 같게 — 「날짜 회사 내용」
function mkTitle(body, co){
  let t=(body||'').trim().replace(/^\d{6}\s*/,'');
  co=(co||'').trim();
  if(co && t.startsWith(co)) t=t.slice(co.length).trim();
  return [ymd6(), co, t||'회의'].filter(Boolean).join(' ');
}

// 화면이 꺼지지 않게 잡아둡니다
let wake=null;
async function keepAwake(){
  try{
    if(!('wakeLock' in navigator) || wake) return;
    wake = await navigator.wakeLock.request('screen');
    wake.addEventListener('release', ()=>{ wake=null; });
  }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible'){ wake=null; keepAwake(); }
});

// ─────────────────────────── 설정 화면
function setupPage(msgText){
  const rooms=[...new Set(ROOMS.concat(EVENTS.map(e=>e.room).filter(Boolean)))];
  app.innerHTML='<div class="mid"><div class="setup">'
    + '<h1>회의실 태블릿 설정</h1>'
    + '<div class="sub" style="margin-bottom:18px">이 태블릿을 어느 회의실에 둘지만 정하면 됩니다.</div>'
    + (me ? '' :
        '<input id="em" type="email" placeholder="회의실 계정 이메일" value="'+esc(cfg.email||'')+'">'
      + '<input id="pw" type="password" placeholder="비밀번호">')
    + '<input id="rm" type="text" placeholder="회의실 이름 (예: 5F 대회의실)" list="rmlist" value="'+esc(cfg.room||'')+'">'
    + '<datalist id="rmlist">'+rooms.map(r=>'<option value="'+esc(r)+'">').join('')+'</datalist>'
    + (canTest()
        ? '<label class="chk"><input type="checkbox" id="tm" '+(cfg.test?'checked':'')+'>'
          + '<span>시험 모드 — 회의록은 만들되 <b>김현우님만 보이게</b> 저장합니다</span></label>'
          + '<div class="sub" style="margin:6px 0 16px;font-size:14px">'
          + '슬랙 알림도 나가지 않습니다. 마음껏 시험해 보셔도 됩니다.</div>'
        : '')
    + '<button class="btn" id="save">저장하고 시작</button>'
    + '<div class="err" id="err">'+esc(msgText||'')+'</div>'
    + '</div></div>';

  $('#save').onclick=async()=>{
    const err=$('#err'); err.textContent='';
    const room=($('#rm').value||'').trim();
    if(!room){ err.textContent='회의실 이름을 적어주세요.'; return; }
    if(!me){
      const em=($('#em').value||'').trim(), pw=$('#pw').value||'';
      if(!em||!pw){ err.textContent='회의실 계정으로 로그인해주세요.'; return; }
      const {error}=await SB.auth.signInWithPassword({email:em, password:pw});
      if(error){ err.textContent='로그인하지 못했습니다: '+error.message; return; }
      cfg.email=em;
    }
    cfg.room=room;
    cfg.test = canTest() ? !!($('#tm') && $('#tm').checked) : false;
    CFG.set(cfg);
    location.reload();
  };
}

// ─────────────────────────── 자료 읽기
// 이름·회의실 이름을 견주기 좋게 다듬습니다 (띄어쓰기·기호 차이 무시)
const flat = t => String(t||'').replace(/[^0-9A-Za-z가-힣]/g,'').toLowerCase();

// 우리 건물 회의실 — 순서대로 보여줍니다. 늘어나면 여기에 한 줄 더하면 됩니다.
const ROOMS = ['5F 대회의실','5F 홍석진 대표님 사무실','1F 대회의실',
               'B1 소회의실','B1 간이 회의실','B1 대회의실'];

// 로그인한 계정이 「회의실 전용 계정」 일 때만 이름 목록에서 뺍니다.
// 개인 계정으로 로그인해도 그 사람이 사라지지 않게 하려는 것입니다.
const isRoomAcct = m => {
  const a=flat(m && m.name), b=flat(cfg.room);
  if(!a) return false;
  if(b && (a.indexOf(b)>=0 || b.indexOf(a)>=0)) return true;
  return /회의실|미팅룸|회의룸|room/i.test(m.name||'');
};
async function loadMembers(){
  const {data}=await SB.from('hd_member')
    .select('id,name,company,dept,status,approved').eq('approved',true).order('name');
  MEMBERS=(data||[]).filter(m=>(m.status||'active')==='active'
                            && (m.name||'').trim()
                            && !(m.id===me.id && isRoomAcct(m)));
  // 회사별로 묶어 보여줍니다 (사람이 늘어도 자기 이름을 빨리 찾게)
  MEMBERS.sort((x,y)=> (x.company||'').localeCompare(y.company||'')
                    || (x.name||'').localeCompare(y.name||''));
}
async function loadEvents(){
  const now=Date.now();
  const from=new Date(now-2*3600*1000).toISOString();
  const to  =new Date(now+16*3600*1000).toISOString();
  const {data}=await SB.from('hd_cal_event')
    .select('uid,title,room,starts_at,ends_at,all_day,note')
    .gte('starts_at',from).lte('starts_at',to).order('starts_at');
  EVENTS=(data||[]).filter(e=>!e.all_day);
}
// 회의실 이름이 비슷하면 같은 곳으로 봅니다 (띄어쓰기·기호 차이 무시)
function mine(){
  const r=flat(cfg.room);
  if(!r) return EVENTS;
  return EVENTS.filter(e=>{
    const x=flat(e.room);
    return x && (x.indexOf(r)>=0 || r.indexOf(x)>=0);
  });
}
// 지금 하고 있거나 곧 시작할 예약 (앞뒤 20분 여유)
function current(){
  const now=Date.now();
  return mine().find(e=>{
    const s=new Date(e.starts_at).getTime(), t=new Date(e.ends_at).getTime();
    return now >= s-20*60*1000 && now <= t+20*60*1000;
  }) || null;
}
// 예약 제목에서 회사를 알아봅니다 (참석자를 아무도 안 누르셨을 때 씁니다)
function coFromTitle(t){
  const x=flat(t);
  const cos=[...new Set(MEMBERS.map(m=>m.company).filter(Boolean))];
  return cos.find(c=>x.indexOf(flat(c))>=0) || '';
}

// ─────────────────────────── 대기 화면
function idlePage(){
  clearInterval(tick);
  const ev=PICKED || current();
  const now=Date.now();
  // 이 회의실 예약을 먼저, 그다음 다른 회의실 예약.
  // 소회의실에 잡아놓고 대회의실에서 하는 일이 잦아 전부 고를 수 있게 둡니다.
  const live=e=>new Date(e.ends_at).getTime()>now;
  const mineRest=mine().filter(e=>live(e) && e!==ev);
  const others=EVENTS.filter(e=>live(e) && e!==ev && mine().indexOf(e)<0);
  const rest=mineRest.concat(others);
  const c=clk();
  app.innerHTML=
    '<div class="top">'
    + '<div><div class="room">'+esc(cfg.room||'회의실')
    + (cfg.test?'<span class="tflag">시험 모드 · 나만 보기</span>':'')+'</div>'
    + '<div class="today" id="dy">'+esc(c.day)+'</div></div>'
    + '<div class="clock"><div class="hm" id="ck">'+c.hm+'</div>'
    + '<div class="sec">회의가 끝나면 회의록이 자동으로 만들어집니다</div></div></div>'
    + '<div class="mid">'
    + (ev ? '<div class="next on" id="card"><div class="lb"><i></i>이 회의로 녹음됩니다</div>'
          + '<div class="tt">'+esc(ev.title||'회의')+'</div>'
          + '<div class="tm">'+hm(ev.starts_at)+' ~ '+hm(ev.ends_at)
          + (PICKED ? ' · '+esc(ev.room||'')  : '')+'</div>'
          + '<div class="bar"><i id="bari"></i></div>'
          + '<div class="barlb" id="barlb"></div></div>'
          + '<div class="tether"><i></i></div>'
          : '<div class="sub">지금 잡힌 예약이 없습니다<br>'
          + '<span style="font-size:14px">아래 버튼을 누르면 제목 없이 녹음을 시작합니다</span></div>')
    + '<button class="big go" id="start"><span class="dot"></span>'
    + '<span class="lbwrap"><span>회의 녹음 시작</span>'
    + (ev ? '<span class="sub2">'+esc(ev.title||'회의')+'</span>' : '')
    + '</span></button>'
    + '<div class="sub" style="font-size:14px">'
    + (ev ? '위 회의로 녹음됩니다 · 다른 회의면 아래에서 골라주세요'
          : '누르면 바로 녹음이 시작됩니다')
    + ' · 참석자는 녹음 중에 이름을 누르시면 됩니다</div>'
    + '</div>'
    + (rest.length ? '<div class="list"><div class="h">다른 회의 고르기 — 누르면 위 카드가 바뀝니다 · '
        + '다른 회의실 예약도 여기 있습니다</div>'
        + rest.slice(0,6).map((e,i)=>'<button class="pick" data-ev="'+i+'">'
          + '<span class="tm">'+hm(e.starts_at)+' ~ '+hm(e.ends_at)+'</span>'
          + '<b>'+esc(e.title||'회의')+'</b>'
          + (mineRest.indexOf(e)<0 && e.room
              ? '<span class="rmtag">'+esc(e.room)+'</span>' : '')
          + '</button>').join('') + '</div>' : '');

  let ticks=0;
  tick=setInterval(()=>{
    const c2=clk();
    const a=$('#ck'), b=$('#dy');
    if(a) a.textContent=c2.hm;
    if(b) b.textContent=c2.day;
    if(++ticks % 60 === 0) drawBar(ev);      // 1분마다 진행 바 갱신
  }, 1000);

  drawBar(ev);
  $('#start').onclick=()=>startRec(ev);
  // 다른 회의를 누르면 바로 녹음하지 않고 위 카드만 바꿉니다.
  // 지나가다 잘못 눌러 진짜 회의가 시작되는 일을 막습니다.
  app.querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>{
    PICKED = rest[+b.dataset.ev] || null;
    idlePage();
  });
}

// 예약 시간 안에서 지금이 어디쯤인지 — 1분마다 갱신됩니다
function drawBar(ev){
  const fill=$('#bari'), lb=$('#barlb');
  if(!ev || !fill) return;
  const draw=()=>{
    const s=new Date(ev.starts_at).getTime(), e=new Date(ev.ends_at).getTime(), n=Date.now();
    const all=Math.max(1, e-s);
    const p=Math.max(0, Math.min(1, (n-s)/all));
    fill.style.width=(p*100).toFixed(1)+'%';
    if(!lb) return;
    if(n < s){
      const m=Math.round((s-n)/60000);
      lb.textContent = m>=60 ? '시작까지 '+Math.floor(m/60)+'시간 '+(m%60)+'분'
                             : '시작까지 '+m+'분';
    }else if(n > e){
      lb.textContent='예정된 시간이 지났습니다 — 그래도 녹음할 수 있습니다';
    }else{
      const m=Math.round((e-n)/60000);
      lb.textContent = m>=60 ? '끝나기까지 '+Math.floor(m/60)+'시간 '+(m%60)+'분'
                             : '끝나기까지 '+m+'분';
    }
  };
  draw();
}

// ─────────────────────────── 녹음
const REC={};
async function startRec(ev){
  let stream;
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
  }catch(e){
    alert('마이크를 쓸 수 없습니다.\n태블릿 설정에서 이 페이지의 마이크 사용을 허용해주세요.');
    return;
  }
  let mime='';
  for(const m of ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'])
    if(window.MediaRecorder && MediaRecorder.isTypeSupported(m)){ mime=m; break; }

  REC.stream=stream; REC.chunks=[]; REC.t0=Date.now(); REC.ev=ev||null;
  REC.title=(ev&&ev.title)||''; REC.who=new Set();
  PICKED=null;
  REC.agenda=((ev&&ev.note)||'').trim();
  REC.room=cfg.room||'';
  REC.mr = mime ? new MediaRecorder(stream,{mimeType:mime, audioBitsPerSecond:64000})
                : new MediaRecorder(stream);
  REC.mr.ondataavailable=e=>{ if(e.data&&e.data.size) REC.chunks.push(e.data); };
  REC.mr.onstop=finish;
  REC.mr.start(5000);          // 5초씩 나눠 모읍니다 (길게 녹음해도 안전)
  keepAwake();
  meter(stream);
  recPage();
}

// 이름 버튼 격자 (회사 이름을 작게 함께 보여줍니다)
function grid(sel){
  if(!MEMBERS.length) return '<span class="sub">구성원 명단을 불러오지 못했습니다</span>';
  return MEMBERS.map(m=>'<button class="nm'+(sel&&sel.has(m.id)?' on':'')
    +'" data-id="'+m.id+'">'+esc(m.name)
    +'<span class="co">'+esc(m.company||'')+'</span></button>').join('');
}
function bindGrid(){
  app.querySelectorAll('.nm').forEach(b=>b.onclick=()=>{
    const id=b.dataset.id;
    if(REC.who.has(id)){ REC.who.delete(id); b.classList.remove('on'); }
    else { REC.who.add(id); b.classList.add('on'); }
    const c=$('#cnt');
    if(c){
      const picked=MEMBERS.filter(m=>REC.who.has(m.id));
      c.textContent = picked.length
        ? '참석 '+picked.length+'명 · '+picked.map(m=>m.name).join(', ')
        : '아직 아무도 누르지 않았습니다';
    }
  });
}

function recPage(){
  clearInterval(tick);
  app.innerHTML=
    '<div class="top"><div><div class="room">'+esc(REC.room||cfg.room||'회의실')
    + (cfg.test?'<span class="tflag">시험 모드 · 나만 보기</span>':'')+'</div>'
    + '<div class="today">녹음하고 있습니다 · '
    + '<button class="rmbtn" id="rmch">회의실 바꾸기</button></div></div>'
    + '<div class="clock"><div class="hm" id="ck">'+clk().hm+'</div></div></div>'
    + '<div class="mid">'
    + '<div class="mtitle">'+esc(REC.title||'제목 없이 시작한 회의')+'</div>'
    + '<div class="elapsed" id="ela">0:00</div>'
    + '<div class="lv" id="lv"></div>'
    + (REC.agenda
        ? '<div class="agn"><div class="h">사전 안건</div><pre>'+esc(REC.agenda)+'</pre></div>'
        : '')
    + '<div class="who"><div class="h">들어오시면 <b>본인 이름</b>을 눌러주세요</div>'
    + '<div class="cnt" id="cnt">아직 아무도 누르지 않았습니다</div>'
    + '<div class="grid">'+grid(REC.who)+'</div></div>'
    + '<button class="big stop rec" id="stop"><span class="dot"></span>회의 종료</button>'
    + '</div>';

  tick=setInterval(()=>{
    const a=$('#ela'); if(a) a.textContent=el((Date.now()-REC.t0)/1000);
    const c=$('#ck'); if(c) c.textContent=clk().hm;
  }, 500);
  bindGrid();
  $('#stop').onclick=stopRec;
  const rb=$('#rmch'); if(rb) rb.onclick=roomPick;
}

// 녹음 중에 회의실을 바꿉니다 (예약한 곳과 실제 장소가 다를 때)
function roomPick(){
  const cur = REC.room || cfg.room || '';
  const list = [...new Set(ROOMS.concat(cur ? [cur] : []))];
  const box=document.createElement('div');
  box.className='sheet';
  box.innerHTML='<div class="card"><div class="h">어느 회의실에서 하고 계십니까</div>'
    + list.map((r,i)=>'<button class="rmopt'+(flat(r)===flat(cur)?' on':'')
        + '" data-rm="'+i+'">'+esc(r)+'</button>').join('')
    + '<button class="ghost" id="rmx" style="margin-top:14px">닫기</button></div>';
  document.body.appendChild(box);
  const close=()=>box.remove();
  box.querySelector('#rmx').onclick=close;
  box.onclick=e=>{ if(e.target===box) close(); };
  box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{
    REC.room=list[+b.dataset.rm];
    close();
    const t=document.querySelector('.top .room');
    if(t) t.innerHTML=esc(REC.room)+(cfg.test?'<span class="tflag">시험 모드 · 나만 보기</span>':'');
  });
}

// 소리가 들어오는지 눈으로 보여줍니다 (마이크가 꺼져 있으면 바로 압니다)
function meter(stream){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    const ac=new AC();
    const an=ac.createAnalyser(); an.fftSize=512;
    ac.createMediaStreamSource(stream).connect(an);
    const buf=new Uint8Array(an.frequencyBinCount);
    REC.meter=setInterval(()=>{
      an.getByteFrequencyData(buf);
      let sum=0; for(let i=0;i<buf.length;i++) sum+=buf[i];
      const lv=$('#lv');
      if(lv) lv.textContent = (sum/buf.length)>2 ? '● 소리 들어오는 중' : '';
    }, 700);
    REC.ac=ac;
  }catch(e){}
}

function stopRec(){
  if(!REC.mr || REC.mr.state!=='recording') return;
  const sec=(Date.now()-REC.t0)/1000;
  // 실수로 눌렀을 때를 걸러냅니다
  if(sec<60 && !confirm('아직 '+Math.round(sec)+'초밖에 안 됐습니다.\n회의를 끝내고 올릴까요?')) return;
  clearInterval(REC.meter); clearInterval(tick);
  REC.dur=Math.floor(sec);
  REC.mr.stop();
  (REC.stream.getTracks()||[]).forEach(t=>t.stop());
  try{ if(REC.ac) REC.ac.close(); }catch(e){}
  app.innerHTML='<div class="mid"><div class="done"><span class="ok">⏳</span>정리하는 중입니다…</div></div>';
}

function finish(){
  const type=REC.mr.mimeType||'audio/webm';
  const ext=type.indexOf('mp4')>=0?'mp4':type.indexOf('ogg')>=0?'ogg':'webm';
  REC.blob=new Blob(REC.chunks,{type}); REC.ext=ext; REC.type=type;
  REC.mr=null; REC.chunks=[];
  if(REC.blob.size<4000){ msg('녹음이 비어 있습니다','마이크가 연결되어 있는지 확인해주세요'); return; }
  // 아무도 이름을 누르지 않았으면 한 번 더 여쭙니다.
  // 참석자가 곧 열람 권한이라 비워두면 팀장·관리자만 보게 됩니다.
  if(!REC.who.size) return askWho();
  upload();
}

function askWho(){
  app.innerHTML=
    '<div class="mid">'
    + '<div class="mtitle">누가 참석하셨나요?</div>'
    + '<div class="sub">이름을 누르시면 그분들께 회의록이 슬랙으로 갑니다.<br>'
    + '누르지 않으시면 팀장님과 관리자에게만 보입니다.</div>'
    + '<div class="who"><div class="cnt" id="cnt">아직 아무도 누르지 않았습니다</div>'
    + '<div class="grid">'+grid(REC.who)+'</div></div>'
    + '<div class="rowbtn">'
    + '<button class="ghost" id="skip">그냥 올리기</button>'
    + '<button class="big go" id="up" style="font-size:26px;padding:24px 44px">올리기</button>'
    + '</div></div>';
  bindGrid();
  $('#up').onclick=upload;
  $('#skip').onclick=upload;
}

async function upload(){
  app.innerHTML='<div class="mid"><div class="done"><span class="ok">⏳</span>올리는 중입니다…</div></div>';

  // 이름을 누르신 분들이 참석자입니다. 그분들의 회사를 이 회의의 회사로 씁니다.
  const picked=MEMBERS.filter(m=>REC.who.has(m.id));
  const cos={};
  picked.forEach(m=>{ if(m.company) cos[m.company]=(cos[m.company]||0)+1; });
  let company=Object.keys(cos).sort((a,b)=>cos[b]-cos[a])[0] || '';
  if(!company) company=coFromTitle(REC.title);          // 예약 제목에서 찾아보고
  if(!company){                                          // 그래도 없으면 가장 많은 회사
    const all={};
    MEMBERS.forEach(m=>{ if(m.company) all[m.company]=(all[m.company]||0)+1; });
    company=Object.keys(all).sort((a,b)=>all[b]-all[a])[0] || '';
  }
  const dps=[...new Set(picked.filter(m=>m.company===company).map(m=>m.dept).filter(Boolean))];
  const dept = dps.length===1 ? dps[0] : '';

  // 시험 모드 — 올리기는 하되 「나만 보기」로 넣습니다.
  // 계정을 여기서 한 번 더 확인합니다 (설정만 켜둔 채 계정이 바뀌었을 수 있습니다).
  const testMode = cfg.test && canTest();
  const testFields = testMode
    ? {visibility:'private', note_label:'시험 녹음'} : {};

  try{
    const name='jobs/'+Date.now()+'_room.'+REC.ext;   // 저장소 파일 이름은 영문·숫자만
    const up=await SB.storage.from('hd-audio')
      .upload(name, REC.blob, {upsert:true, contentType:REC.type});
    if(up.error){ msg('올리지 못했습니다', up.error.message); return; }

    const ins=await SB.from('hd_job').insert({
      title: mkTitle(REC.title, company),
      participants: picked.map(m=>m.name).join(', '),
      audio_path:name, kind:'audio', orig_name:(REC.title||'회의')+'.'+REC.ext,
      device:'회의실 태블릿', created_by:me.id, created_name:cfg.room||'회의실',
      company:company, dept:dept,
      cal_uid:(REC.ev&&REC.ev.uid)||'', room:REC.room||cfg.room||'',
      agenda_md:(REC.agenda||''),
      started_at:new Date(REC.t0).toISOString(),
      ended_at:new Date(REC.t0+(REC.dur||0)*1000).toISOString(),
      ...testFields,
    });
    if(ins.error){ msg('기록을 남기지 못했습니다', ins.error.message); return; }

    msg(testMode ? '시험 녹음을 올렸습니다' : '회의가 끝났습니다',
      testMode
        ? '회의록은 <b>김현우님만</b> 보이게 저장됩니다 · 슬랙 알림은 나가지 않습니다'
        : (picked.length
            ? picked.map(m=>m.name).join(', ')+' 님께 회의록이 슬랙으로 갑니다'
            : '참석자를 누르지 않으셔서 팀장님과 관리자에게만 보입니다'));
  }catch(e){
    msg('올리지 못했습니다', e.message||String(e));
  }
}

function msg(head, sub){
  clearInterval(tick);
  app.innerHTML='<div class="mid"><div class="done"><span class="ok">✓</span>'+esc(head)+'</div>'
    + '<div class="sub" style="max-width:640px">'+esc(sub||'')
    + '<br><br>회의록은 몇 분 뒤 헤임달에 올라옵니다.</div>'
    + '<button class="ghost" id="ok">확인</button></div>';
  const back=()=>{ loadEvents().catch(()=>{}).then(idlePage); };
  $('#ok').onclick=back;
  setTimeout(back, 12000);
}

// 설정 손잡이 — 오른쪽 위 구석을 3초 길게 눌러야 열립니다
(function(){
  let t=null;
  const g=$('#gear');
  const down=()=>{ t=setTimeout(()=>{ if(!REC.mr) setupPage(''); }, 3000); };
  const up=()=>{ clearTimeout(t); };
  g.addEventListener('touchstart',down); g.addEventListener('touchend',up);
  g.addEventListener('mousedown',down);  g.addEventListener('mouseup',up);
})();

// ─────────────────────────── 시작
// 이 화면에는 서비스 워커를 쓰지 않습니다.
// 예전에 등록된 것이 남아 있으면 화면이 안 뜰 수 있어 지웁니다.
(async()=>{
  try{
    if(!navigator.serviceWorker) return;
    const rs=await navigator.serviceWorker.getRegistrations();
    for(const r of rs){
      if((r.scope||'').indexOf(location.pathname.replace(/room\.html$/,''))>=0)
        await r.unregister();
    }
  }catch(e){}
})();

async function boot(){
  const ses=await SB.auth.getSession();
  const session=ses.data && ses.data.session;
  if(session){
    const {data}=await SB.from('hd_member').select('*').eq('id',session.user.id).maybeSingle();
    if(data && data.approved && (data.status||'active')==='active') me=data;
  }
  // 시험 모드가 켜져 있는데 쓸 수 없는 계정이면 조용히 꺼둡니다
  if(cfg.test && !canTest()){ cfg.test=false; CFG.set(cfg); }
  await loadEvents().catch(()=>{});
  if(!me || !cfg.room){
    setupPage(!me && session ? '이 계정은 아직 승인되지 않았습니다. 관리자에게 요청해주세요.' : '');
    return;
  }
  await loadMembers().catch(()=>{});
  keepAwake();
  idlePage();
  // 예약과 명단을 조용히 새로 읽습니다 (녹음 중에는 건드리지 않습니다)
  setInterval(async()=>{
    if(REC.mr) return;
    await loadEvents().catch(()=>{});
    await loadMembers().catch(()=>{});
    idlePage();
  }, 120000);
}
boot();
</script>
